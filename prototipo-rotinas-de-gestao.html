<title>Firmare Gestão de Rotina</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app de coluna única, cabeçalho marrom da marca, navegação inferior fixa; painel e equipe só para admin */
:root{
  --bg:#F9F7F2; --surface:#FFFFFF; --ink:#2E1F0E; --muted:#6E5E4B; --line:#E6DFD1;
  --brand:#2E1F0E; --brand-ink:#F9F7F2; --gold:#C5A467; --gold-ink:#86672E; --gold-soft:#F1E8D5;
  --btn-bg:#2E1F0E; --btn-ink:#F9F7F2;
  --ok:#3F7D4E; --ok-soft:#E3F0E5; --warn:#A8701A; --warn-soft:#F7ECD8; --bad:#B4442F; --bad-soft:#F6E1DC;
  --display:"Lora", Georgia, "Times New Roman", serif;
  --body:Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17110A; --surface:#221A10; --ink:#F3EDE2; --muted:#B5A68F; --line:#3A2D1D;
  --brand:#0F0A05; --brand-ink:#F3EDE2; --gold:#C5A467; --gold-ink:#DDC28C; --gold-soft:#33271A;
  --btn-bg:#C5A467; --btn-ink:#1A130A; --ok:#86C696; --ok-soft:#1F3324; --warn:#E3B461; --warn-soft:#3A2C14; --bad:#E88672; --bad-soft:#3D1F18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17110A; --surface:#221A10; --ink:#F3EDE2; --muted:#B5A68F; --line:#3A2D1D;
  --brand:#0F0A05; --brand-ink:#F3EDE2; --gold:#C5A467; --gold-ink:#DDC28C; --gold-soft:#33271A;
  --btn-bg:#C5A467; --btn-ink:#1A130A; --ok:#86C696; --ok-soft:#1F3324; --warn:#E3B461; --warn-soft:#3A2C14; --bad:#E88672; --bad-soft:#3D1F18; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.2px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Cabeçalho */
.top{background:var(--brand);color:var(--brand-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.mark{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.5px;line-height:1}
.mark span{color:var(--gold)}
.top .who{margin-left:auto;text-align:right;font-size:12px;line-height:1.25;min-width:0}
.top .who b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button.who{border:0;border-radius:6px;padding:2px 4px;background:none;color:inherit;font-size:12px}
.top .who .pinlink{color:var(--gold);text-decoration:underline;text-underline-offset:2px}
.top button{background:transparent;border:1px solid rgba(197,164,103,.5);color:var(--brand-ink);border-radius:999px;padding:5px 12px;font-size:12px}
.demo{background:var(--gold-soft);color:var(--gold-ink);font-size:12px;text-align:center;padding:6px 16px}

main{padding-block:18px 110px}
section{display:grid;gap:14px}

/* Navegação inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .wrap{display:flex;justify-content:space-around;padding-block:6px}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);border-radius:8px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--gold-ink);font-weight:600}
nav.tabs .add span.plus{width:40px;height:40px;border-radius:50%;background:var(--btn-bg);color:var(--btn-ink);display:grid;place-items:center;margin-top:-18px;border:3px solid var(--bg)}

/* Semana */
.weekhead{display:flex;align-items:end;justify-content:space-between;gap:8px}
.weekhead h2{font-size:28px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;display:grid;place-items:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 0 6px;display:grid;justify-items:center;gap:1px}
.day .dw{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.day .dn{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.day .dots i.late{background:var(--bad)}
.day.today .dn{color:var(--gold-ink)}
.day[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.day[aria-pressed="true"] .dw{color:var(--gold)}
.day[aria-pressed="true"] .dn{color:var(--brand-ink)}

/* Segmentos e filtros */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink);font-weight:600}

/* Tarefas */
.group{display:grid;gap:8px}
.group > h3{font-family:var(--body);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;gap:8px;align-items:center}
.group > h3 .n{background:var(--line);color:var(--ink);border-radius:999px;padding:0 7px;font-size:11px;letter-spacing:0}
.group.late > h3{color:var(--bad)}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px;align-items:start}
.task.done .desc{text-decoration:line-through;color:var(--muted)}
.task.urg{border-left:3px solid var(--bad)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--gold);background:transparent;display:grid;place-items:center;padding:0;margin-top:1px}
.check svg{width:14px;height:14px;opacity:0}
.task.done .check{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.task.done .check svg{opacity:1}
.check:disabled{opacity:.35;cursor:default}
.tbody{min-width:0;display:grid;gap:6px}
.desc{font-weight:500;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-gold{background:var(--gold-soft);color:var(--gold-ink)}
.p-mute{background:var(--line);color:var(--muted)}
.tactions{display:flex;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;font-size:12.5px;color:var(--gold-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* Formulários */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
label.f{display:grid;gap:6px;font-size:13px;font-weight:600}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=time],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:400}
textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--btn-bg);color:var(--btn-ink);border:0;border-radius:8px;padding:12px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding-block:32px}
.login .box{width:100%;max-width:380px;display:grid;gap:18px}
.login .brandblock{text-align:center;display:grid;gap:6px}
.login .brandblock .mark{font-size:40px;color:var(--ink)}
.login .brandblock .mark span{color:var(--gold-ink)}
.pinrow{display:flex;gap:10px;justify-content:center}
.pinrow input{width:52px;height:58px;text-align:center;font-size:24px;font-family:var(--display);font-weight:600;padding:0}
.err{color:var(--bad);font-size:13px;text-align:center;min-height:18px}

/* Painel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.kpi b{font-family:var(--display);font-size:34px;font-weight:600;line-height:1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.kpi.hero span{color:var(--gold)}
.gauge{height:8px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.gauge i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.barcell{min-width:120px}

/* Equipe */
.member{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;flex:none}
.member .info{min-width:0;flex:1}
.member .info b{display:block;font-weight:600}
.member.off{opacity:.55}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;z-index:9;max-width:calc(100% - 32px)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.task,.kpi{transition:background .2s,border-color .2s}}
@media (max-width:420px){.weekhead h2{font-size:24px}.day .dn{font-size:19px}.row2{grid-template-columns:1fr}}

[hidden]{display:none!important}
/* Pacientes */
input[type=search],input[type=tel]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:400}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{background:var(--gold-soft);color:var(--gold-ink);border:0;border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-tipo{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.valor{font-size:12.5px;font-weight:600;color:var(--ok)}
.obs{font-size:13px;color:var(--muted);border-left:2px solid var(--gold);padding-left:8px;overflow-wrap:anywhere}
.concl{display:grid;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}
.pacbox{display:grid;gap:14px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
.pacbox input,.pacbox select,.pacbox textarea{background:var(--surface)}
.sugs{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.sugs button{display:flex;justify-content:space-between;gap:10px;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:10px 12px;font-size:14px}
.sugs button:last-child{border-bottom:0}
.sugs button span{font-size:12.5px}
.sugs .addnew{color:var(--gold-ink);font-weight:600}
.selpac{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--gold-soft);border-radius:8px;padding:10px 12px}
.novopac{display:grid;gap:12px}
.prow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.prow .info{min-width:0;flex:1;display:grid;gap:1px}
.prow .info b{font-weight:600}
.prow .ltv{font-family:var(--display);font-size:20px;font-weight:600;white-space:nowrap}
.prow:hover{border-color:var(--gold)}
.bday{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r);padding:12px 14px;display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}
.phead{display:flex;gap:14px;align-items:center}
.avatar.lg{width:54px;height:54px;font-size:26px}
.note{font-size:12.5px;color:var(--muted);margin:0}
/* v5: filtros e registros do painel */
.resumo{font-size:13.5px;color:var(--muted)}
.resumo b{color:var(--ink)}
.numbtn{background:none;border:0;padding:2px 4px;margin:-2px -4px;font:inherit;font-variant-numeric:tabular-nums;color:var(--gold-ink);font-weight:600;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;border-radius:4px}
.numbtn.bad{color:var(--bad)}
.numbtn.on{background:var(--gold-soft);text-decoration-style:solid}
button.kpibtn{font:inherit;color:inherit;text-align:left;width:100%}
button.kpibtn:hover,button.kpibtn.on{border-color:var(--gold)}
button.kpibtn.on{box-shadow:inset 0 0 0 1px var(--gold)}
.kpi .ver{font-size:11px;color:var(--gold-ink);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.drill{display:grid;gap:8px;border:1px solid var(--gold);border-radius:var(--r);padding:12px;background:var(--gold-soft)}
.drillhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drillhead .link{margin-left:auto}
#dz-top,#dz-pac,#dz-resp,#dz-sol{scroll-margin-top:90px}
/* v7: recorrência */
input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:400}
.p-rec{background:transparent;border:1px dashed var(--gold);color:var(--gold-ink);font-weight:600}
.recbox{display:grid;gap:10px;border:1px dashed var(--gold);border-radius:8px;padding:12px}
/* v8: campanhas */
.p-camp{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:500;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ccard{display:grid;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;font:inherit;color:inherit}
.ccard:hover{border-color:var(--gold)}
.cctop{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.cctop b{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.15}
.ccmeta{display:flex;gap:4px 14px;flex-wrap:wrap;justify-content:space-between;font-size:13px;color:var(--muted)}
.ccmeta b{color:var(--ink)}
.gauge.meta{height:10px}
.metacard{gap:8px}
.metanum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.metanum span{color:var(--muted)}
.metanum b{margin-left:auto;font-family:var(--display);font-size:28px}
.numbtn.big{font-family:var(--display);font-size:44px;line-height:1;margin:0;padding:0}
#dz-c1,#dz-c2{scroll-margin-top:90px}
.p-cat{background:var(--brand);color:var(--brand-ink);font-weight:600}
tr.atual td{background:var(--gold-soft)}
.ccvalor{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;background:var(--gold-soft);border-radius:8px;padding:8px 12px}
.ccvalor span{font-size:12.5px;color:var(--muted)}
.ccvalor b{font-family:var(--display);font-size:24px;font-weight:600;color:var(--ok)}
.ccvalor span:last-child{margin-left:auto}
.campkpis{grid-template-columns:1fr 1fr}
.campkpis .hero{grid-column:1/-1}
.p-orig{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
/* v10: importação */
.impbox{border-color:var(--gold);scroll-margin-top:90px}
input[type=file]{width:100%;font-size:14px;padding:8px;border:1px dashed var(--line);border-radius:8px;background:var(--bg)}
tr.lfora td{background:var(--bg);color:var(--muted)}
.modelobox{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--gold-soft);border-radius:8px;padding:10px 12px}
.modelobox .note{display:inline}
/* v11: menu lateral, planos, saldos */
.shell{min-height:100%}
.side{background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;gap:18px;padding:20px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.sidehead{display:grid;gap:2px;padding:0 8px}
.sidehead .mark{font-size:28px}
.sideclin{font-size:12px;color:var(--gold);letter-spacing:.04em}
.sidenav{display:grid;gap:14px;flex:1;align-content:start}
.navgroup{display:grid;gap:2px}
.navtit{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:rgba(249,247,242,.55);font-weight:600;padding:0 10px 4px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;font:inherit;font-size:14px;padding:9px 10px;border-radius:8px;text-align:left;cursor:pointer}
.navitem svg{width:20px;height:20px;flex:none;opacity:.85}
.navitem:hover{background:rgba(249,247,242,.07)}
.navitem[aria-current="page"]{background:rgba(197,164,103,.18);color:var(--gold);font-weight:600}
.navitem[aria-current="page"] svg{opacity:1}
.nbadge{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;line-height:1.5;font-variant-numeric:tabular-nums}
nav.tabs .nbadge{position:absolute;top:2px;right:calc(50% - 22px);margin:0;font-size:10px;padding:0 5px}
nav.tabs button{position:relative}
.sidefoot{display:grid;gap:10px;border-top:1px solid rgba(249,247,242,.12);padding:14px 6px 0}
.sideuser{display:flex;gap:10px;align-items:center}
.sideuser b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sideuser .avatar{background:rgba(197,164,103,.2);color:var(--gold)}
.sidepin{color:var(--gold) !important;font-size:12px}
.sidesair{color:var(--brand-ink) !important;border-color:rgba(249,247,242,.25) !important;padding:8px 12px}
.scrim{position:fixed;inset:0;background:rgba(15,10,5,.45);z-index:20}
@media (max-width: 899px){
  .side{position:fixed;top:0;bottom:0;left:0;width:min(290px,84vw);z-index:21;transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
}
@media (min-width: 900px){
  .shell{display:grid;grid-template-columns:240px minmax(0,1fr)}
  .side{position:sticky;top:0;height:100vh;overflow-y:auto}
  .content .top{display:none}
  nav.tabs{display:none}
  .content main{padding-block:28px 48px}
  .content .wrap{max-width:900px}
  .toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion: reduce){ .side{transition:none} }
.planbanner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--gold);border-radius:var(--r);padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
.planbanner > span:first-child{width:36px;height:36px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;flex:none}
.planbanner svg{width:20px;height:20px}

/* ===== v19: visual leve — fundo claro, dourado como destaque, marrom como tinta ===== */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --sombra:none; --gold-2:#4A3A22 }}
:root[data-theme="dark"]{ --sombra:none; --gold-2:#4A3A22 }
/* menu lateral claro */
.side{background:var(--surface);color:var(--ink);border-right:1px solid var(--line)}

.sideclin{color:var(--gold-ink);font-weight:600}

.sidefoot{border-top:1px solid var(--line)}

.sidesair{color:var(--ink) !important;border-color:var(--line) !important;background:transparent !important}
.side.open{box-shadow:0 0 40px rgba(46,31,14,.18)}
/* cabeçalho do celular claro */
.top{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
.top .mark{color:var(--brand)}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top .mark{color:var(--ink)}}

.demo{background:var(--gold-soft);border-bottom:1px solid var(--gold-2)}
/* cartões mais leves */
.card,.kpi,.task,.member,.prow,.arow,.ccard,.tablewrap,.day{border-color:var(--line);box-shadow:var(--sombra)}
.card,.kpi,.tablewrap,.ccard{border-radius:16px}
.task,.member,.prow,.arow{border-radius:14px}
.kpi{padding:14px 16px;gap:4px}

.group > h3{color:var(--gold-ink);letter-spacing:.12em}

th{background:var(--bg)}

/* Top 10 pagantes */

<script>
/* =========================================================
   CONFIGURAÇÃO — um único site para todas as clínicas
   API_URL: URL do App da Web do código central (Apps Script da Firmare).
   Em branco, o app roda em modo demonstração (dados de exemplo).
   Cada clínica entra pelo próprio link: endereço-do-site/?clinica=CODIGO
   (o código e o nome exibido vêm do cadastro de clínicas).
   CLINICA: nome usado só no modo demonstração.
   TIPOS: tipos de contato com paciente.
     Só os tipos de Pagamentos registram valor pago (receita e LTV).
     orcamento: o valor é de orçamento enviado (não entra no LTV).
   ========================================================= */
const CONFIG = {
  API_URL: (typeof window!=="undefined" && window.FIRMARE_API_URL) || "", // no site: definido em config.js
  CLINICA: "Clínica Modelo",
  // receita: valor entra no LTV · atende: conta como paciente atendido · saldo: aceita "valor em aberto"
  // orcamento: valor de orçamento (não entra no LTV) · recebimento: abate saldo em aberto · sessao: sessão de plano
  // Cada tipo: grupo (como aparece na lista) e desc (explicação mostrada ao escolher).
  // receita: é um pagamento (entra na receita e no LTV) · atende: conta como paciente atendido
  // saldo: aceita "valor em aberto" · orcamento: valor de proposta (não entra na receita)
  // recebimento: abate saldo em aberto · sessao: sessão de plano (criada pelo plano)
  // pagavel: atendimento que guarda o pagamento recebido na própria tarefa (conta como receita)
  // vira: ao concluir, o tipo agendado passa a ser o realizado (a mesma tarefa)
  TIPOS: [
    {nome:"Consulta agendada", grupo:"Agenda", vira:"Consulta realizada", desc:"Consulta marcada. Ao concluir, vira Consulta realizada (com o pagamento, se houver). Sinal pago antes: lance como Sinal de consulta."},
    {nome:"Procedimento agendado", grupo:"Agenda", vira:"Procedimento realizado", desc:"Procedimento marcado. Ao concluir, vira Procedimento realizado (com o pagamento, se houver)."},
    {nome:"Reagendamento", grupo:"Agenda", desc:"Consulta, procedimento ou sessão remarcados."},
    {nome:"Confirmação", grupo:"Agenda", desc:"Confirmação de presença com o paciente."},
    {nome:"Consulta realizada", grupo:"Atendimento", atende:true, pagavel:true, desc:"Paciente atendido em consulta. O pagamento da consulta fica registrado nesta mesma tarefa."},
    {nome:"Procedimento realizado", grupo:"Atendimento", atende:true, pagavel:true, desc:"Procedimento feito. O pagamento fica registrado nesta mesma tarefa."},
    {nome:"Sessão de plano", grupo:"Atendimento", atende:true, sessao:true, pagavel:true, desc:"Sessão de um programa de acompanhamento (criada pelo próprio programa)."},
    {nome:"Orçamento enviado", grupo:"Orçamento", orcamento:true, desc:"Proposta apresentada. O valor do orçamento não entra na receita."},
    {nome:"Sinal de consulta", grupo:"Pagamentos", receita:true, saldo:true, desc:"Valor adiantado para reservar a consulta. O restante vai em valor em aberto."},
    {nome:"Pagamento de consulta", grupo:"Pagamentos", receita:true, saldo:true, desc:"Valor pago pela consulta. Se faltar alguma parte, informe em valor em aberto."},
    {nome:"Pagamento de orçamento", grupo:"Pagamentos", receita:true, atende:true, saldo:true, desc:"Orçamento fechado: valor pago agora (total ou entrada). O que faltar vai em valor em aberto."},
    {nome:"Pagamento de saldo em aberto", grupo:"Pagamentos", receita:true, recebimento:true, rotulo:"Valor recebido (R$)", desc:"Parcela ou restante de um valor em aberto. Abate o saldo do paciente."},
    {nome:"Follow-up", grupo:"Relacionamento", desc:"Retomar conversa em andamento (ex.: orçamento enviado sem resposta)."},
    {nome:"Recaptação", grupo:"Relacionamento", desc:"Paciente sem retorno há algum tempo."},
    {nome:"Retorno de procedimento", grupo:"Relacionamento", desc:"Paciente que já pode repetir um procedimento (criado pelo catálogo)."},
    {nome:"Contato de indicação", grupo:"Relacionamento", desc:"Contato com paciente indicado ou com quem indicou."},
    {nome:"Aniversário", grupo:"Relacionamento", desc:"Mensagem de aniversário."},
    {nome:"Pós-consulta", grupo:"Relacionamento", desc:"Acompanhamento depois da consulta ou procedimento."},
    {nome:"Outros", grupo:"Relacionamento", desc:"Outro contato com o paciente."}
  ],
  // Tipos de campanha: permitem comparar campanhas do mesmo tipo mês a mês
  // Origem do paciente (como chegou à clínica)
  // Funções da equipe (aparecem como lista no cadastro; "Outra…" permite digitar)
  FUNCOES: ["Médica responsável", "Recepção", "Enfermagem", "Comercial interno", "Comercial externo", "Call center", "Pós-venda", "Administrativo", "Financeiro", "Gestão"],
  ORIGENS: ["Indicação", "Instagram", "WhatsApp", "Google", "Site", "Convênio", "Fachada / passou na frente", "Evento", "Outro"],
  // formas de pagamento pedidas em todo lançamento de Pagamentos
  FORMAS_PAGAMENTO: ["Pix", "Dinheiro", "Cartão de crédito", "Cartão de débito", "Nota promissória"],
  // tipos de contato oferecidos dentro de um plano de acompanhamento (ajustável por clínica)
  TIPOS_PLANO: ["Sessão de plano", "Pagamento de saldo em aberto", "Reagendamento", "Contato de indicação", "Pós-consulta"],
  CATEGORIAS_CAMPANHA: ["Aniversariantes", "Recaptação", "Procedimento específico", "Orçamentos em aberto", "Data comemorativa", "Indicação", "Outra"]
};
const DEMO = !CONFIG.API_URL;
// clínica do link (?clinica=codigo); fica lembrada neste aparelho para quem abrir sem o final do link
const CLINICA_COD = (() => {
  let c = "";
  try { c = (new URLSearchParams(location.search).get("clinica") || "").trim().toLowerCase(); } catch(e) {}
  try { if (c) localStorage.setItem("firmare-clinica", c); else c = localStorage.getItem("firmare-clinica") || ""; } catch(e) {}
  return c;
})();
const CHAVE_SESSAO = "firmare-tarefas-sessao" + (CLINICA_COD ? ":" + CLINICA_COD : "");
let NOME_CLINICA = "";
const nomeClinica = () => NOME_CLINICA || (DEMO ? CONFIG.CLINICA : "");
function definirClinica(nome){ if (nome){ NOME_CLINICA = nome; try { document.title = nome + " · Gestão de Rotina"; } catch(e) {} } }

/* ---------- utilidades ---------- */
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.slice(0,10).split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const nowIso = () => { const d = new Date(); return ymd(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); };
const DW = ["dom","seg","ter","qua","qui","sex","sáb"];
const MES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const br = s => { const d = parse(s); return pad(d.getDate())+"/"+pad(d.getMonth()+1); };
const brAno = s => { const d = parse(s); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2); };
const dia = s => String(s||"").slice(0,10);
const weekStartOf = s => { const d = parse(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return ymd(d); }; // semana começa na segunda
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim().replace(/\s+/g," ");
const brl = v => (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const brl0 = v => (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const plural = (n, s, p) => n+" "+(n===1?s:p);
function lerValor(s){ // aceita 450 | 450,00 | 1.250,50 | 1250.50
  s = String(s||"").replace(/R\$|\s/g,"");
  if (!s) return "";
  if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
  const n = Number(s);
  return isNaN(n) || n < 0 ? null : Math.round(n*100)/100;
}
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const tipoInfo = n => CONFIG.TIPOS.find(t=>t.nome===n) || {nome:n||""};
// receita: só os lançamentos do grupo Pagamentos (definido abaixo)
// contato = tarefa concluída que não é atendimento nem pagamento
const ehContato = t => { const i = tipoInfo(t.tipo); return !i.atende && !i.receita && !i.recebimento; };
// receita = só os lançamentos do grupo Pagamentos
const ehReceita = t => { const i = tipoInfo(t.tipo); return !!i.receita || (!!i.pagavel && Number(t.valor) > 0); };
const aceitaPagamento = n => !!tipoInfo(n).pagavel;
const ehPagamento = n => !!tipoInfo(n).receita;
const formaOptions = sel => `<option value="">Selecione</option>` + (CONFIG.FORMAS_PAGAMENTO||[]).map(f => `<option ${sel===f?"selected":""}>${esc(f)}</option>`).join("");
const temValor = n => { const i = tipoInfo(n); return !!(i.receita || i.orcamento); };
const rotuloValor = n => { const i = tipoInfo(n); return i.rotulo || (i.receita ? "Valor pago (R$)" : "Valor do orçamento (R$)"); };
const TIPO_SESSAO = "Sessão de plano";
const TIPO_RETORNO = "Retorno de procedimento";
const tiposEscolha = () => CONFIG.TIPOS.filter(t => !t.sessao);
// lista agrupada (Agenda, Atendimento, Orçamento, Pagamentos, Relacionamento)
// nome exibido do tipo (o valor gravado não muda)
const nomeTipo = n => n==="Sessão de plano" ? "Sessão de programa" : n;
function opcoesTipo(lista, sel, comValue){
  const grupos = []; lista.forEach(t => { const g = t.grupo || "Outros"; let x = grupos.find(y => y.g===g); if (!x) grupos.push(x = {g, ts:[]}); x.ts.push(t); });
  const op = t => `<option${comValue ? ` value="${esc(t.nome)}"` : ""} ${sel===t.nome?"selected":""}>${esc(nomeTipo(t.nome))}</option>`;
  return grupos.length > 1 ? grupos.map(x => `<optgroup label="${esc(x.g)}">${x.ts.map(op).join("")}</optgroup>`).join("") : lista.map(op).join("");
}
// tipo final do atendimento ao concluir (agendado vira realizado)
const tipoAoConcluir = t => tipoInfo(t.tipo).vira || t.tipo;
// dentro do plano: lista curta. Sessão de plano só aparece ao editar uma sessão (as sessões são geradas pelo plano)
function tiposDoPlano(ed){
  const nomes = CONFIG.TIPOS_PLANO || [];
  const lista = nomes.map(n => CONFIG.TIPOS.find(t => t.nome===n)).filter(t => t && (!t.sessao || (ed && ehSessao(ed))));
  if (ed && ed.tipo && !lista.some(t => t.nome===ed.tipo)) lista.unshift(tipoInfo(ed.tipo).nome ? tipoInfo(ed.tipo) : {nome:ed.tipo});
  return lista;
}
const TIPO_ANTIGO = {"Orçamento fechado":"Pagamento de orçamento", "Orçamento pago":"Pagamento de orçamento", "Recebimento de saldo":"Pagamento de saldo em aberto", "Agendamento":"Consulta agendada"};
const TIPO_SINAL = "Sinal de consulta", TIPO_PAG_CONSULTA = "Pagamento de consulta", TIPO_PAG_ORC = "Pagamento de orçamento", TIPO_PAG_SALDO = "Pagamento de saldo em aberto"; // nomes de versões anteriores
const migraTipo = t => { if (TIPO_ANTIGO[t.tipo]) t.tipo = TIPO_ANTIGO[t.tipo]; return t; };
const temNum = v => v!=="" && v!=null && !isNaN(Number(v));

/* ---------- situação de uma tarefa ---------- */
function situacao(t){
  if (t.status === "cancelada") return {key:"cancelada", label:"Cancelada", cls:"p-mute"};
  if (t.status === "concluida"){
    const noPrazo = dia(t.concluidaEm) <= t.prazo;
    return noPrazo ? {key:"ok", label:"Concluída no prazo", cls:"p-ok"} : {key:"tarde", label:"Concluída com atraso", cls:"p-warn"};
  }
  const h = today();
  if (t.prazo < h){ const n = diasEntre(t.prazo, h); return {key:"atrasada", label: n===1 ? "Atrasada desde ontem" : `Atrasada há ${n} dias`, cls:"p-bad"}; }
  if (t.prazo === h) return {key:"hoje", label:"Vence hoje", cls:"p-gold"};
  return {key:"aberta", label:"No prazo", cls:"p-mute"};
}

async function api(action, payload={}){
  const body = Object.assign({action, uid: S.user && S.user.id, pin: S.pin, clinica: CLINICA_COD}, payload);
  if (DEMO) return demoApi(body).then(guardaSaldo);
  try{
    const r = await fetch(CONFIG.API_URL, {method:"POST", body: JSON.stringify(body)});
    return guardaSaldo(await r.json());
  }catch(e){
    return {ok:false, error:"Sem conexão com a planilha. Verifique a internet e tente de novo."};
  }
}

// equipe não recebe valores: a planilha informa só quais pacientes têm saldo em aberto
function guardaSaldo(r){ if (r && Array.isArray(r.comSaldo)) S.comSaldo = r.comSaldo; if (r && r.estoqueDelta && S.estoque){ const e = S.estoque, d = r.estoqueDelta;
    e.movs = e.movs.filter(m => !(d.removidos||[]).includes(m.id)).concat((d.movs||[]).filter(m => !e.movs.some(x => x.id===m.id))); } return r; }
// saldo em aberto por paciente (mesma regra da ficha): valores em aberto − recebimentos − sessões de planos com saldo
function calcSaldos(tasks, adesoes){
  const modo = {}; adesoes.forEach(a => { modo[a.id] = a.modo; });
  const g = {};
  tasks.forEach(t => {
    if (!t.pacienteId || t.status!=="concluida") return;
    const k = t.pacienteId+"|"+(t.adesaoId||""), x = g[k] || (g[k] = {pid:t.pacienteId, aberto:0, abatido:0});
    if (Number(t.valorAberto) > 0) x.aberto += Number(t.valorAberto);
    if (tipoInfo(TIPO_ANTIGO[t.tipo]||t.tipo).recebimento) x.abatido += Number(t.valor)||0;
    else if (t.tipo===TIPO_SESSAO && t.adesaoId && modo[t.adesaoId]==="saldo") x.abatido += Number(t.valor)||0;
  });
  const out = {};
  Object.values(g).forEach(x => { const v = Math.max(0, Math.round((x.aberto - x.abatido)*100)/100); if (v > 0) out[x.pid] = (out[x.pid]||0) + v; });
  return out;
}

function rotSessao(r, n){

          responsavelId:it.responsavelId, insumoId:String(it.insumoId||""), insumoQtd: temNum(it.insumoQtd) ? Number(it.insumoQtd) : "", dose:String(it.dose||"").slice(0,60), valor: temNum(it.valor) ? Number(it.valor) : ""});
      }
      if (!campOk(d.campanhaId)) return fail("Campanha não encontrada.");
      const aid = "a"+(++db.seq), tarefas = [], o = b.orcamento, nomes = [...new Set(norm2.map(i => i.nome))].join(" + ");
      const total = temNum(d.valorTotal) ? Number(d.valorTotal) : 0, ent = temNum(d.valorEntrada) ? Number(d.valorEntrada) : 0;
      let modo = "avulso";
      if (o){
        const t = {id:"t"+(++db.seq), solicitanteId:me.id, responsavelId:o.responsavelId||me.id, descricao:String(o.descricao||"Pagamento de orçamento").slice(0,400),
          prazo: ehData(o.prazo) ? o.prazo : today(), hora:o.hora||"", prioridade:o.prioridade||"normal", status:"aberta", concluidaEm:"", criadaEm:nowIso(),
          pacienteId:pa.id, tipo:"Pagamento de orçamento", valor: temNum(o.valor) ? Number(o.valor) : "", valorAberto: temNum(o.valorAberto) ? Number(o.valorAberto) : "",
          obs:String(o.obs||"").slice(0,300), serieId:"", recorrencia:"", campanhaId:o.campanhaId||"", adesaoId:aid, sessao:"", formaPagamento:String(o.formaPagamento||"")};
        if (o.realizada){ t.status = "concluida"; t.concluidaEm = dataConc(t.prazo); }
        modo = Number(t.valorAberto) > 0 ? "saldo" : "avulso";
        db.tasks.push(t); tarefas.push(t);
      } else if (total > 0){
        if (ent > total) return fail("O valor pago não pode ser maior que o total.");
        const t = {id:"t"+(++db.seq), solicitanteId:me.id, responsavelId:me.id, descricao:"Adesão ao programa "+nomes, prazo:today(), hora:"", prioridade:"normal",
          status:"concluida", concluidaEm:nowIso(), criadaEm:nowIso(), pacienteId:pa.id, tipo:"Pagamento de orçamento", valor: ent || "", valorAberto: total-ent || "",
          obs:"", serieId:"", recorrencia:"", campanhaId:d.campanhaId||"", adesaoId:aid, sessao:"", formaPagamento: ent ? String(d.formaPagamento||"") : ""};
        modo = "saldo"; db.tasks.push(t); tarefas.push(t);
      }
      const p0 = norm2[0], totS = norm2.reduce((s,i) => s + i.sessoes, 0);
      const a = {id:aid, pacienteId:pa.id, paciente:pa.nome, planoId:p0.procId, plano:nomes, inicio:norm2.map(i => i.inicio).sort()[0], sessoes:totS, intervaloDias:p0.intervaloDias,
        rotuloSessao: norm2.every(i => i.rotuloSessao===norm2[0].rotuloSessao) ? norm2[0].rotuloSessao : "Sessão", responsavelId:p0.responsavelId, modo, status:"ativo", criadaEm:nowIso(), criadaPor:me.nome, encerradaEm:"", motivo:"",
        unidadeId:String(d.unidadeId||""), itens:norm2};
      db.adesoes.push(a);
      norm2.forEach(it => cancelarRetornos(pa.id, it.procId, tarefas));
      tarefas.forEach(t => { if (t.adesaoId===aid) t.unidadeId = a.unidadeId; });
      norm2.forEach(it => datasPlano(it.inicio, it.sessoes, it.intervaloDias).forEach((dt, i) => {
        const t = {id:"t"+(++db.seq), solicitanteId:me.id, responsavelId:it.responsavelId, descricao:`${it.rotuloSessao} ${i+1}/${it.sessoes} · ${it.nome}${it.dose ? " " + it.dose : ""}`,
          prazo:dt, hora:d.hora||"", prioridade:"normal", status:"aberta", concluidaEm:"", criadaEm:nowIso(), pacienteId:pa.id, tipo:TIPO_SESSAO,
          valor:"", valorAberto:"", obs:"", serieId:"", recorrencia:"", campanhaId:"", adesaoId:aid, sessao:`${i+1}/${it.sessoes}`, unidadeId:a.unidadeId, itemKey:it.key};
        db.tasks.push(t); tarefas.push(t);
      }));
      demoSave(); return ok({adesao:JSON.parse(JSON.stringify(a)), tarefas:tarefas.map(saida)});
    }
    case "encerrarAdesao": {
      if (!mePode("programas.gerir")) return fail("Seu perfil não tem acesso a esta ação.");
      const a = db.adesoes.find(x => x.id===b.id); if (!a) return fail("Programa não encontrado.");
      a.status = "cancelado"; a.motivo = String(b.motivo||"Encerrado") + (b.obs ? " — "+String(b.obs).slice(0,200) : ""); a.encerradaEm = nowIso();
      const tarefas = [];
      db.tasks.forEach(t => { if (t.adesaoId===a.id && ehSessao(t) && t.status==="aberta"){ t.status = "cancelada"; tarefas.push(saida(t)); } });
      demoSave(); return ok({adesao:a, tarefas});
    }
    case "excluirAdesao": {
      if (!mePode("programas.gerir")) return fail("Seu perfil não tem acesso a esta ação.");
      if (!db.adesoes.some(x => x.id===b.id)) return fail("Programa não encontrado.");
      const ids = db.tasks.filter(t => t.adesaoId===b.id && ehSessao(t)).map(t => t.id);
      db.tasks = db.tasks.filter(t => !ids.includes(t.id)); db.tasks.forEach(t => { if (t.adesaoId===b.id) t.adesaoId = ""; });
      db.adesoes = db.adesoes.filter(x => x.id!==b.id);
      let removidos = [];
      if (db.estoque){ removidos = db.estoque.movs.filter(m => m.tarefaId && ids.includes(m.tarefaId)).map(m => m.id); db.estoque.movs = db.estoque.movs.filter(m => !removidos.includes(m.id)); }
      demoSave(); return Promise.resolve({ok:true, data:{ids}, estoqueDelta: removidos.length ? {movs:[], removidos} : undefined});
    }
    case "salvarCampanha": {
      if (!mePode("campanhas.gerir")) return fail("Seu perfil não tem acesso a esta ação.");
      const c = b.campanha || {};
      if (!String(c.nome||"").trim()) return fail("Dê um nome à campanha.");
      if (!ehData(c.inicio) || !ehData(c.fim) || c.fim < c.inicio) return fail("Confira as datas da campanha.");
      if (!METRICAS[c.metrica]) return fail("Escolha a métrica da meta.");
      if (!(Number(c.meta) > 0)) return fail("Informe uma meta maior que zero.");
      let x = c.id && db.campanhas.find(y => y.id===c.id);
      if (!x){ x = {id:"c"+(++db.seq), criadaEm:nowIso()}; db.campanhas.push(x); }
      Object.assign(x, {categoria:String(c.categoria||"Outra").slice(0,60), foco:String(c.foco||"").trim().slice(0,80), nome:String(c.nome).trim().slice(0,80), objetivo:String(c.objetivo||"").trim().slice(0,400), inicio:c.inicio, fim:c.fim,
        metrica:c.metrica, tipoMetrica: c.metrica==="tipo" ? String(c.tipoMetrica||"") : "", meta:Number(c.meta)});
      demoSave(); return ok(x);
    }
    case "excluirCampanha": {
      if (!mePode("campanhas.gerir")) return fail("Seu perfil não tem acesso a esta ação.");
      if (!db.campanhas.some(c => c.id===b.id)) return fail("Campanha não encontrada.");
      db.campanhas = db.campanhas.filter(c => c.id!==b.id);
      db.tasks.forEach(t => { if (t.campanhaId===b.id) t.campanhaId = ""; });
      demoSave(); return ok({id:b.id});
    }
    case "salvarPerfis": {
      if (!me.admin && !mePode("config")) return fail("Seu perfil não tem acesso a esta ação.");
      const lista = (Array.isArray(b.perfis) ? b.perfis : []).slice(0,20).map(p => ({id:String(p.id||("pf_"+(++db.seq))).slice(0,30), nome:String(p.nome||"Perfil").trim().slice(0,30) || "Perfil",
        perms:(p.perms||[]).filter(k => PERMS.some(x => x[1]===k))}));
      const emUso = db.team.filter(u => u.ativo && !u.admin && u.perfilId && !lista.some(p => p.id===u.perfilId));
      if (emUso.length) return fail("Há pessoas usando um perfil que seria excluído: " + emUso.map(u => u.nome).join(", ") + ".");
      db.perfis = lista; demoSave(); return ok({perfis:lista});
    }
    case "salvarPessoa": {
      if (!mePode("config")) return fail("Seu perfil não tem acesso a esta ação.");
      const p = b.pessoa || {};
      if (!p.nome || !/^\d{4}$/.test(String(p.pin||""))) return fail("Informe o nome e um PIN de 4 números.");
      let u = p.id && db.team.find(x => x.id===p.id);
      if (!u){ u = {id:"u"+(++db.seq)}; db.team.push(u); }
      if (!p.admin && !(db.perfis||[]).some(x => x.id===p.perfilId)) return fail("Escolha o perfil de acesso.");
      if (u.id===me.id && me.admin && !p.admin) return fail("Você não pode tirar o seu próprio acesso de administrador.");
      Object.assign(u, {nome:p.nome.trim(), funcao:(p.funcao||"").trim(), pin:String(p.pin), admin:!!p.admin, perfilId: p.admin ? "" : p.perfilId, ativo:p.ativo!==false});
      demoSave(); return ok(Object.assign(pub(u),{pin:u.pin}));
    }
  }
  return fail("Ação desconhecida.");
}

function recolherDicas(root){
  root.querySelectorAll("p.note:not([data-dica])").forEach(p => {
    p.dataset.dica = "1";
    const txt = p.textContent.replace(/\s+/g, " ").trim();
    if (p.className!=="note" || p.id || txt.length < 70 || /\d/.test(txt) || p.getAttribute("aria-live") || p.querySelector("button,a,input,select,textarea") || p.closest(".tablewrap,.prtab,.dicat,.estform-keep")) return;
    const ico = document.createElement("span"); ico.className = "dica"; ico.tabIndex = 0; ico.setAttribute("role", "note"); ico.setAttribute("aria-label", txt);
    ico.innerHTML = '<span class="dicai" aria-hidden="true">i</span>'; const tip = document.createElement("span"); tip.className = "dicat"; tip.innerHTML = p.innerHTML; ico.appendChild(tip);
    // encaixa no título logo acima, quando houver; senão fica no lugar do texto, discreto
    let alvo = p.previousElementSibling;
    if (alvo && alvo.matches("div") && alvo.querySelector("h2")) alvo = alvo.querySelector("h2");
    if (alvo && alvo.matches("h2,h3,.eyebrow,label.f,.chk")){ alvo.appendChild(ico); p.remove(); }
    else { const w = document.createElement("div"); w.className = "dicalinha"; w.appendChild(ico); const r = document.createElement("span"); r.className = "dicarot"; r.textContent = "Como funciona"; w.appendChild(r); p.replaceWith(w); }
  });
}
new MutationObserver(() => { if (!recolherDicas.agendado){ recolherDicas.agendado = true; requestAnimationFrame(() => { recolherDicas.agendado = false; recolherDicas(document.body); }); } }).observe(document.getElementById("app"), {childList:true, subtree:true});

async function atualizar(t, status, extra={}){
  if (S.busy) return;
  S.busy = true;
  const antes = {status:t.status, concluidaEm:t.concluidaEm, valor:t.valor, obs:t.obs, valorAberto:t.valorAberto, tipo:t.tipo, formaPagamento:t.formaPagamento};
  delete extra.reprogramarLocal;
  t.status = status; t.concluidaEm = status==="concluida" ? (extra.concluidaEm ? extra.concluidaEm+"T12:00" : nowIso()) : "";
  Object.assign(t, extra, {concluidaEm: t.concluidaEm});
  S.concluindo = null; render();
  const r = await api("atualizarTarefa", Object.assign({id:t.id, status}, extra));
  S.busy = false;
  if (!r.ok){ Object.assign(t, antes); render(); toast(r.error); return; }
  Object.assign(t, r.data);
  const novos = [];
  (r.todas||[]).forEach(x => { const o = S.tasks.find(y => y.id===x.id); if (o){ if (o!==t) Object.assign(o, x); } else { S.tasks.push(x); novos.push(x); } });
  render();
  const rep = (r.todas||[]).filter(x => x.id!==t.id && ehSessao(x)).length, ret = novos.find(x => x.tipo===TIPO_RETORNO);
  if (rep || ret){ toast(["Sessão concluída", rep ? `${rep} próximas reprogramadas` : "", ret ? `contato de retorno em ${br(ret.prazo)}` : ""].filter(Boolean).join(" · ")); return; }
  toast(status==="concluida" ? (extra.tipo ? `${extra.tipo} registrada` : ehSessao(t) ? `${rotDaSessao(t)} ${t.sessao} registrada${r.estoqueDelta && (r.estoqueDelta.movs||[]).length ? " · baixa no estoque feita" : ""}` : "Tarefa concluída") + (Number(extra.valor) > 0 ? ` · pagamento de ${brl(extra.valor)} (${extra.formaPagamento})` : "")
    : status==="cancelada" ? "Tarefa cancelada" : "Tarefa reaberta");
}

      if (va!=="" || vVal()) extra.valorAberto = va;
    }
    const rep = document.querySelector(`input[name="crep-${t.id}"]:checked`);
    if (document.querySelector(`input[name="crep-${t.id}"]`)){
      if (!rep){ toast("Escolha se as próximas sessões serão reprogramadas."); return; }
      extra.reprogramar = rep.value==="sim";
    }
    const di = document.getElementById("cdat-"+t.id);
    if (di && di.value){
      if (di.value > today()){ toast("A data de realização não pode ser no futuro."); return; }
      if (di.value !== today()) extra.concluidaEm = di.value;
    }
    const pg = lerPagBloco(t.id);
    if (pg && pg.erro){ toast(pg.erro); return; }
    // pagamento fica na própria tarefa; "Não" apaga um valor anotado antes
    if (pg && !pg.nao){ extra.valor = pg.valor; extra.valorAberto = pg.aberto; extra.formaPagamento = pg.forma; }
    else if (pg && pg.nao && Number(t.valor) > 0){ extra.valor = ""; extra.valorAberto = ""; extra.formaPagamento = ""; }
    const vira = tipoInfo(t.tipo).vira; if (vira){ if (t.descricao===t.tipo) extra.descricao = vira; extra.tipo = vira; }
    atualizar(t, "concluida", extra);
  });
}
const ordenar = arr => arr.slice().sort((a,b)=> (a.prazo+(a.hora||"99")).localeCompare(b.prazo+(b.hora||"99")) || (a.prioridade==="urgente"?-1:1));
const dataRef = t => dia(t.concluidaEm) || t.prazo;

function ligarPicker(px, inicialId, aoMudar){
  const st = {id: inicialId || "", novo:false};
  const $ = s => document.getElementById(px+s);
  const mostrar = () => {
    $("sel").hidden = !st.id; $("busca").hidden = !!st.id || st.novo; $("novo").hidden = !st.novo;
    if (st.id) $("selnome").textContent = nomePac(st.id);
    if (aoMudar) aoMudar(st.id, st.novo);
  };
  const sugerir = () => {
    const bruto = $("q").value.trim(), q = norm(bruto), box = $("sugs");
    if (!q){ box.hidden = true; box.innerHTML = ""; return; }
    const achados = S.pacientes.filter(p => norm(p.nome).includes(q) || (p.telefone||"").replace(/\D/g,"").includes(q.replace(/\D/g,"")||"#"))
      .sort((a,b)=>a.nome.localeCompare(b.nome)).slice(0,6);
    const exato = S.pacientes.some(p => norm(p.nome)===q);
    box.innerHTML = achados.map(p=>`<button type="button" data-pid="${esc(p.id)}"><b>${esc(p.nome)}</b><span class="muted">${esc(p.telefone||"")}</span></button>`).join("")
      + (exato ? "" : `<button type="button" data-novo="1" class="addnew">+ Cadastrar “${esc(bruto)}” como novo paciente</button>`);
    box.hidden = false;
    box.querySelectorAll("[data-pid]").forEach(b => b.onclick = () => { st.id = b.dataset.pid; st.novo = false; mostrar(); });
    const nb = box.querySelector("[data-novo]");
    if (nb) nb.onclick = () => { st.novo = true; st.id = ""; $("nn").value = bruto; mostrar(); $("nt").focus(); };
  };
  $("q").oninput = () => { $("err").hidden = true; $("q").classList.remove("erro"); sugerir(); };
  $("troca").onclick = () => { st.id = ""; mostrar(); $("q").value = ""; sugerir(); $("q").focus(); };
  $("cancnovo").onclick = () => { st.novo = false; mostrar(); };
  ligarOrigem(px+"n");
  mostrar();
  return {
    atual(){ return st.id; },
    async resolver(){
      if (st.id) return st.id;
      if (st.novo){
        const nomeP = $("nn").value.trim();
        if (!nomeP) throw "Informe o nome do paciente.";
        const un = document.getElementById(px + "nuni"); if (un && !un.value){ un.classList.add("erro"); un.focus(); throw "Escolha a unidade principal do paciente."; }
        const r = await api("salvarPaciente", {paciente:Object.assign({nome:nomeP, telefone:$("nt").value.trim(), aniversario:$("na").value}, lerOrigem(px+"n"))});
        if (!r.ok) throw r.error;
        S.pacientes.push(r.data); st.id = r.data.id; st.novo = false; mostrar();
        return st.id;
      }
      // nome digitado igual ao de um paciente cadastrado: seleciona sozinho
      const q = norm($("q").value.trim()), iguais = q ? S.pacientes.filter(p => norm(p.nome)===q) : [];
      if (iguais.length===1){ st.id = iguais[0].id; mostrar(); return st.id; }
      $("err").hidden = false; $("q").classList.add("erro"); if (q) sugerir();
      $("pk").scrollIntoView({block:"center", behavior:"smooth"}); $("q").focus();
      throw q ? "Escolha o paciente na lista ou cadastre como novo." : "Informe o paciente.";
    }
  };
}

    if (!r.ok){ btn.disabled=false; btn.textContent=txt; toast(r.error); return; }
    if (ed){
      const lista = r.todas || [r.data];
      lista.forEach(x => { const o = S.tasks.find(y => y.id===x.id); if (o) Object.assign(o, x); });
      toast(lista.length > 1 ? `Série atualizada: ${lista.length} tarefas` : tarefa.concluir ? `${r.data.tipo} registrada` : "Tarefa atualizada"); voltar(); return;
    }
    S.tasks.push(...(r.todas || [r.data]));
    toast(r.todas ? `Série criada: ${r.todas.length} tarefas para ${primeiro(r.data.responsavelId)}` : ehRetro ? "Lançamento registrado" : "Tarefa criada para "+primeiro(r.data.responsavelId));
    if (pre.voltarCampanha && r.data.campanhaId){ abrirCampanha(r.data.campanhaId); return; }
    if (pre.voltarAdesao && r.data.adesaoId){ abrirAdesao(r.data.adesaoId); return; }
    if (pre.voltarPaciente || (ehRetro && r.data.pacienteId)){ abrirPaciente(r.data.pacienteId); return; }
    S.dia = r.data.prazo; S.semana = weekStartOf(r.data.prazo);
    S.filtroHoje = r.data.responsavelId===S.user.id ? "minhas" : "solicitadas";
    ir("hoje");
  });
}

/* ---------- CAMPANHAS ---------- */
const METRICAS = {
  convertidos: "Pacientes convertidos",
  contatos: "Contatos realizados",
  tipo: "Tipo de contato concluído",
  receita: "Receita gerada (R$)"
};
const AJUDA_METRICA = {
  convertidos: "Pacientes da campanha com consulta, procedimento ou orçamento pago concluído.",
  contatos: "Contatos concluídos com pacientes (mensagens, ligações, follow-ups), sem contar pagamentos.",
  tipo: "Quantidade de tarefas concluídas do tipo escolhido.",
  receita: "Soma dos pagamentos (de consulta, de orçamento e de saldo em aberto) vinculados à campanha."
};
const camp = id => S.campanhas.find(c => c.id===id);
const catCamp = c => c.categoria || "Outra";
const rotuloCat = c => catCamp(c) + (c.foco ? " · " + c.foco : "");
function proximoMes(c){
  // copia a campanha para o mês seguinte; se ela ocupa o mês inteiro, ocupa o mês seguinte inteiro
  const iniMes = c.inicio.slice(8)==="01", fimMes = addDays(c.fim,1).slice(8)==="01";
  const ini = addMeses(c.inicio, 1);
  const fim = iniMes && fimMes ? addDays(addMeses(addDays(c.fim,1), 1, 1), -1) : addMeses(c.fim, 1);
  return {categoria:c.categoria, foco:c.foco, nome:c.nome, objetivo:c.objetivo, metrica:c.metrica, tipoMetrica:c.tipoMetrica, meta:c.meta, inicio:ini, fim};
}
const nomeCamp = id => (camp(id)||{}).nome || "Campanha";
const rotuloMeta = c => c.metrica==="tipo" ? (c.tipoMetrica || "Tarefas") : METRICAS[c.metrica] || "Resultado";
const fmtRes = (c, v) => c.metrica==="receita" ? brl0(v) : String(v);
function situacaoCamp(c){
  const h = today();
  if (h < c.inicio) return {key:"futura", label:"Começa em "+br(c.inicio), cls:"p-mute"};
  if (h > c.fim) return {key:"encerrada", label:"Encerrada", cls:"p-mute"};
  const resta = diasEntre(h, c.fim);
  return {key:"andamento", label: resta===0 ? "Último dia" : `Em andamento · ${plural(resta,"dia restante","dias restantes")}`, cls:"p-gold"};
}
function statsCamp(c){
  const ts = S.tasks.filter(t => t.campanhaId===c.id && t.status!=="cancelada");
  const feitas = ts.filter(t => t.status==="concluida");
  const contatos = feitas.filter(t => t.pacienteId && ehContato(t));
  const conv = feitas.filter(t => t.pacienteId && ehAtende(t));
  const pacAlc = new Set(feitas.filter(t=>t.pacienteId).map(t=>t.pacienteId));
  const pacConv = new Set(conv.map(t=>t.pacienteId));
  const pagosCamp = feitas.filter(t => t.pacienteId && ehReceita(t));
  const receita = somaValor(pagosCamp);
  let resultado = 0, arr = [];
  if (c.metrica==="contatos"){ arr = contatos; resultado = contatos.length; }
  else if (c.metrica==="tipo"){ arr = feitas.filter(t=>t.tipo===c.tipoMetrica); resultado = arr.length; }
  else if (c.metrica==="convertidos"){ arr = conv; resultado = pacConv.size; }
  else { arr = pagosCamp; resultado = receita; }
  const oculto = c.metrica==="receita" && !vVal();
  const meta = Number(c.meta) || 0;
  return {ts, feitas, abertas: ts.filter(t=>t.status==="aberta"), contatos, conv, pacAlc: pacAlc.size, pacConv: pacConv.size,
    receita, resultado, arr, meta, oculto, pct: meta ? Math.round(resultado/meta*100) : null,
    taxaConv: pacAlc.size ? Math.round(pacConv.size/pacAlc.size*100) : null};
}
function barraMeta(pct){
  const w = Math.max(0, Math.min(100, pct||0));
  const cor = pct>=100 ? "var(--ok)" : pct>=60 ? "var(--gold)" : "var(--warn)";
  return `<div class="gauge meta" role="img" aria-label="${pct??0}% da meta"><i style="width:${w}%;background:${cor}"></i></div>`;
}
// campanhas em andamento hoje
const campAtivasHoje = () => (S.campanhas||[]).filter(c => c.inicio <= today() && c.fim >= today());
// campanha do paciente: a que ele marcou ao chegar, ou a de uma ação dele numa campanha em andamento
function campanhaDoPaciente(pid, data){
  const d = data || today(), ok = c => c && c.inicio <= d && c.fim >= d, p = pac(pid);
  if (p && p.campanhaId && ok((S.campanhas||[]).find(c => c.id===p.campanhaId))) return p.campanhaId;
  const t = S.tasks.filter(t => t.pacienteId===pid && t.campanhaId && ok((S.campanhas||[]).find(c => c.id===t.campanhaId))).sort((x,y) => (y.criadaEm||"").localeCompare(x.criadaEm||""))[0];
  return t ? t.campanhaId : "";
}
function campanhasAtivasPara(dataRef, atual){
  // campanhas que ainda fazem sentido para vincular: não encerradas há mais de 30 dias, ou a já vinculada
  const lim = addDays(today(), -30);
  return S.campanhas.filter(c => c.id===atual || c.fim >= lim)
    .sort((a,b)=> (situacaoCamp(a).key==="andamento"?0:1)-(situacaoCamp(b).key==="andamento"?0:1) || b.inicio.localeCompare(a.inicio));
}
function campOptions(sel, comFiltros){
  const lista = comFiltros ? S.campanhas.slice().sort((a,b)=>b.inicio.localeCompare(a.inicio)) : campanhasAtivasPara(today(), sel);
  return (comFiltros ? `<option value="">Todas</option><option value="__sem" ${sel==="__sem"?"selected":""}>Sem campanha</option>` : `<option value="">Nenhuma</option>`)
    + lista.map(c=>`<option value="${esc(c.id)}" ${sel===c.id?"selected":""}>${esc(c.nome)} (${br(c.inicio)} a ${br(c.fim)})</option>`).join("");
}
function abrirCampanha(id){ window.scrollTo(0,0); if (S.importCamp && S.importCamp.campId!==id) S.importCamp = null; S.campSel = id; S.campHist = "tudo"; S.drillCamp = null; S.campForm = null; ir("campanha"); }
const mesRotulo = ym => { const [y,m] = ym.split("-").map(Number); return MES[m-1].charAt(0).toUpperCase()+MES[m-1].slice(1)+" de "+y; };
const mesSoma = (ym, k) => { const [y,m] = ym.split("-").map(Number); const d = new Date(y, m-1+k, 1); return d.getFullYear()+"-"+pad(d.getMonth()+1); };

function ligarFormCamp(c, aoSalvar){
  const met = document.getElementById("cmet");
  met.onchange = () => {
    document.getElementById("ctipol").hidden = met.value!=="tipo";
    document.getElementById("cmetal").textContent = met.value==="receita" ? "Meta (R$)" : "Meta (quantidade)";
    document.getElementById("cmetajuda").textContent = AJUDA_METRICA[met.value];
  };
  document.getElementById("ccanc").onclick = () => { S.campForm = null; render(); };
  const ex = document.getElementById("cexcluir");
  if (ex) ex.onclick = async () => {
    if (ex.dataset.confirm !== "1"){ ex.dataset.confirm = "1"; ex.textContent = "Toque de novo para excluir"; return; }
    ex.disabled = true;
    const r = await api("excluirCampanha", {id: c.id});
    if (!r.ok){ ex.disabled = false; toast(r.error); return; }
    S.campanhas = S.campanhas.filter(x => x.id!==c.id);
    S.tasks.forEach(t => { if (t.campanhaId===c.id) t.campanhaId = ""; });
    S.campForm = null; toast("Campanha excluída"); ir("campanhas");
  };
  document.getElementById("fcamp").addEventListener("submit", async e => {
    e.preventDefault();
    const m = met.value;
    const meta = m==="receita" ? lerValor(cmeta.value) : Number(String(cmeta.value).replace(",","."));
    if (!(meta > 0)){ toast("Informe uma meta maior que zero."); return; }
    if (m!=="receita" && !Number.isInteger(meta)){ toast("A meta precisa ser um número inteiro."); return; }
    if (!cini.value || !cfim.value || cfim.value < cini.value){ toast("Confira as datas: o fim precisa ser depois do início."); return; }
    const dados = {id: c.id, categoria: ccat.value, foco: cfoco.value.trim(), nome: cnome.value.trim(), objetivo: cobj.value.trim(), inicio: cini.value, fim: cfim.value,
      metrica: m, tipoMetrica: m==="tipo" ? ctipo.value : "", meta};
    if (!dados.nome){ toast("Dê um nome à campanha."); return; }
    const r = await api("salvarCampanha", {campanha: dados});
    if (!r.ok){ toast(r.error); return; }
    const i = S.campanhas.findIndex(x => x.id===r.data.id);
    if (i>=0) S.campanhas[i] = r.data; else S.campanhas.push(r.data);
    S.campForm = null; toast(c.id ? "Campanha atualizada" : "Campanha criada"); aoSalvar(r.data);
  });
}

/* ---------- IMPORTAÇÃO DE LISTA NA CAMPANHA ---------- */
const MAX_IMPORT = 500;
let XLSXpromise = null;
function carregarXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!XLSXpromise) XLSXpromise = new Promise((ok, erro) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = () => ok(window.XLSX);
    sc.onerror = () => { XLSXpromise = null; erro(new Error("Não foi possível abrir o leitor de planilhas. Verifique a internet ou cole as linhas no campo abaixo.")); };
    document.head.appendChild(sc);
  });
  return XLSXpromise;
}
const fmtYmd = (y, m, d) => { const dt = new Date(y, m-1, d); return dt.getFullYear()===y && dt.getMonth()===m-1 && dt.getDate()===d ? ymd(dt) : null; };
function dataDeCelula(v){ // devolve aaaa-mm-dd, "" (vazio) ou null (inválida)
  if (v===undefined || v===null || v==="") return "";
  if (v instanceof Date) return isNaN(v) ? null : ymd(new Date(v.getTime() + 12*3600e3));
  if (typeof v === "number"){
    if (v > 59 && v < 80000){ const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*864e5); return fmtYmd(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate()); }
    return null;
  }
  const s = String(v).trim(); if (!s) return "";
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return fmtYmd(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if (m){ let y = +m[3]; if (y < 100) y += y > 30 ? 1900 : 2000; return fmtYmd(y, +m[2], +m[1]); }
  return null;
}
// Ordem importa: "Data de nascimento" não pode ser lida como prazo; "Nome do responsável" não pode ser lido como paciente.
const COLS_IMPORT = [["obs",["observ","obs","nota","coment"]], ["resp",["respons","execut","colaborador"]], ["nasc",["nasc","aniver"]], ["camp",["campanha"]],
  ["prazo",["prazo","vencimento","data limite"]], ["tel",["telefone","celular","whats","fone","contato"]], ["nome",["nome","paciente"]]];
function mapearColunas(primeira){
  const cab = primeira.map(h => norm(h));
  if (!cab.some(h => h.includes("nome") || h.includes("paciente"))) return {temCab:false, idx:{nome:0, tel:1, nasc:2, camp:3, resp:4, prazo:5, obs:6}};
  const idx = {}, usados = new Set();
  COLS_IMPORT.forEach(([k, chaves]) => {
    const i = cab.findIndex((h, j) => !usados.has(j) && chaves.some(c => h.includes(c)));
    idx[k] = i; if (i >= 0) usados.add(i);
  });
  return {temCab:true, idx};
}
function acharResponsavel(txt){
  const q = norm(txt); if (!q) return null;
  const ativos = S.team.filter(u => u.ativo);
  const semTitulo = s => norm(s).replace(/^dra?\.?\s+/,"");
  let u = ativos.find(x => norm(x.nome)===q || semTitulo(x.nome)===semTitulo(q));
  if (u) return u;
  const porInicio = ativos.filter(x => semTitulo(x.nome).startsWith(semTitulo(q)));
  if (porInicio.length===1) return porInicio[0];
  const porPrimeiro = ativos.filter(x => semTitulo(x.nome).split(" ")[0]===semTitulo(q).split(" ")[0]);
  return porPrimeiro.length===1 ? porPrimeiro[0] : null;
}
function prepararImport(tabela, imp, c){
  const linhasBrutas = tabela.filter(r => Array.isArray(r) && r.some(v => String(v ?? "").trim()!==""));
  if (!linhasBrutas.length) return {erro: "Nenhuma linha encontrada na planilha."};
  const {temCab, idx} = mapearColunas(linhasBrutas[0].map(v => String(v ?? "")));
  if (idx.nome < 0) return {erro: "Não encontrei a coluna com o nome do paciente. Use o modelo ou deixe o nome na primeira coluna."};
  const dados = temCab ? linhasBrutas.slice(1) : linhasBrutas;
  const cel = (r, k) => idx[k] >= 0 ? r[idx[k]] : "";
  const vistos = new Set();
  const abertosNaCamp = new Set(S.tasks.filter(t => t.campanhaId===c.id && t.status==="aberta" && t.pacienteId).map(t => t.pacienteId));
  const linhas = dados.map((r, i) => {
    const o = {linha: i + (temCab ? 2 : 1), nome: String(cel(r,"nome") ?? "").trim().replace(/\s+/g," "),
      telefone: String(cel(r,"tel") ?? "").trim(), respTxt: String(cel(r,"resp") ?? "").trim(), avisos: [],
      obs: String(cel(r,"obs") ?? "").trim().replace(/\s+/g," ").slice(0,300)};
    const nasc = dataDeCelula(cel(r,"nasc"));
    o.aniversario = nasc || "";
    if (nasc===null) o.avisos.push("nascimento não reconhecido");
    const prazo = dataDeCelula(cel(r,"prazo"));
    if (!o.nome){ o.status = "erro"; o.motivo = "Sem nome do paciente"; return o; }
    const chave = norm(o.nome);
    if (vistos.has(chave)){ o.status = "ignorada"; o.motivo = "Paciente repetido na lista"; return o; }
    vistos.add(chave);
    const existente = S.pacientes.find(p => norm(p.nome)===chave);
    o.pacienteId = existente ? existente.id : "";
    if (existente && abertosNaCamp.has(existente.id)){ o.status = "ignorada"; o.motivo = "Já tem tarefa em aberto nesta campanha"; return o; }
    const u = o.respTxt ? acharResponsavel(o.respTxt) : null;
    if (u) o.responsavelId = u.id;
    else if (imp.respPadrao){ o.responsavelId = imp.respPadrao; if (o.respTxt) o.avisos.push(`“${o.respTxt}” não encontrado: usado o responsável padrão`); }
    else { o.status = "erro"; o.motivo = o.respTxt ? `Responsável “${o.respTxt}” não encontrado na equipe` : "Sem responsável (defina um responsável padrão)"; return o; }
    if (prazo) o.prazo = prazo;
    else if (imp.prazoPadrao){ o.prazo = imp.prazoPadrao; if (prazo===null) o.avisos.push("prazo não reconhecido: usado o prazo padrão"); }
    else { o.status = "erro"; o.motivo = prazo===null ? "Prazo não reconhecido (use dd/mm/aaaa)" : "Sem prazo (defina um prazo padrão)"; return o; }
    o.status = "ok";
    return o;
  });
  if (linhas.length > MAX_IMPORT) return {erro: `A lista tem ${linhas.length} linhas. O limite por importação é ${MAX_IMPORT}; divida a planilha em partes.`};
  return {linhas, temCab};
}

/* ---------- importação da lista de pacientes ---------- */
const MAX_IMPORT_PAC = 2000;
const COLS_IMPORT_PAC = [["ult",["ultim","consulta","atendimento","visita"]], ["nasc",["nasc","aniver"]], ["tel",["telefone","celular","whats","fone","contato"]], ["nome",["nome","paciente"]]];
const digitosTel = s => String(s||"").replace(/\D/g,"");
function prepararImportPac(tabela){
  const brutas = tabela.filter(r => Array.isArray(r) && r.some(v => String(v ?? "").trim()!==""));
  if (!brutas.length) return {erro: "Nenhuma linha encontrada na planilha."};
  const cab = brutas[0].map(h => norm(String(h ?? "")));
  const temCab = cab.some(h => h.includes("nome") || h.includes("paciente"));
  const idx = {nome:0, tel:1, nasc:2, ult:3};
  if (temCab){ const usados = new Set();
    COLS_IMPORT_PAC.forEach(([k, chaves]) => { const i = cab.findIndex((h, j) => !usados.has(j) && chaves.some(c => h.includes(c))); idx[k] = i; if (i >= 0) usados.add(i); }); }
  if (idx.nome < 0) return {erro: "Não encontrei a coluna com o nome do paciente. Use o modelo ou deixe o nome na primeira coluna."};
  const dados = temCab ? brutas.slice(1) : brutas;
  if (dados.length > MAX_IMPORT_PAC) return {erro: `A lista tem ${dados.length} pacientes. O limite por importação é ${MAX_IMPORT_PAC}; divida a planilha em partes.`};
  const cel = (r, k) => idx[k] >= 0 ? r[idx[k]] : "";
  const porNome = {}, porTel = {};
  S.pacientes.forEach(p => { porNome[norm(p.nome)] = p; const d = digitosTel(p.telefone); if (d.length >= 10) porTel[d] = p; });
  const vistos = new Set(), hj = today();
  const linhas = dados.map((r, i) => {
    const o = {linha: i + (temCab ? 2 : 1), nome: String(cel(r,"nome") ?? "").trim().replace(/\s+/g," "), telefone: String(cel(r,"tel") ?? "").trim(), avisos: []};
    const nasc = dataDeCelula(cel(r,"nasc")), ult = dataDeCelula(cel(r,"ult"));
    o.aniversario = nasc && nasc <= hj ? nasc : "";
    if (nasc===null) o.avisos.push("nascimento não reconhecido"); else if (nasc && nasc > hj) o.avisos.push("nascimento no futuro: ignorado");
    o.ultimaConsulta = ult && ult <= hj ? ult : "";
    if (ult===null) o.avisos.push("data da última consulta não reconhecida"); else if (ult && ult > hj) o.avisos.push("última consulta no futuro: ignorada");
    if (!o.nome){ o.status = "erro"; o.motivo = "Sem nome do paciente"; return o; }
    const chave = norm(o.nome), dt = digitosTel(o.telefone);
    if (vistos.has(chave) || (dt.length >= 10 && vistos.has("t"+dt))){ o.status = "ignorada"; o.motivo = "Paciente repetido na lista"; return o; }
    vistos.add(chave); if (dt.length >= 10) vistos.add("t"+dt);
    const ex = porNome[chave] || (dt.length >= 10 ? porTel[dt] : null);
    if (!ex){ o.status = "novo"; return o; }
    o.existente = ex.nome;
    const comp = [];
    if (!ex.telefone && o.telefone) comp.push("telefone");
    if (!ex.aniversario && o.aniversario) comp.push("nascimento");
    if (o.ultimaConsulta && o.ultimaConsulta > (ex.ultimaConsulta||"")) comp.push("última consulta");
    if (comp.length){ o.status = "atualiza"; o.completa = comp; }
    else { o.status = "ignorada"; o.motivo = "Já cadastrado, nada a completar"; }
    return o;
  });
  return {linhas};
}

/* =========================================================
   GESTÃO DE PESSOAS — ficha, alertas (férias, experiência, documentos),
   metas mensais, conversas 1:1 e banco de horas (saldo vindo do app de ponto)
   ========================================================= */
const CONTRATOS = ["CLT", "PJ", "Estágio", "Autônomo", "Sócia"];
const IND_PES = {
  agendamentos: {nome:"Agendamentos feitos", tipo:"qtd"},
  confirmacoes: {nome:"Confirmações feitas", tipo:"qtd"},
  contatos: {nome:"Contatos com pacientes", tipo:"qtd"},
  orc_qtd: {nome:"Orçamentos fechados (quantidade)", tipo:"qtd"},
  orc_valor: {nome:"Orçamentos fechados (valor)", tipo:"valor"},
  recebimentos: {nome:"Recebimentos registrados", tipo:"qtd"},
  tarefas_prazo: {nome:"Tarefas concluídas no prazo", tipo:"pct"},
  contagens_prazo: {nome:"Contagens de estoque no prazo", tipo:"pct"},
  manual: {nome:"Outra meta (lançamento manual)", tipo:"qtd"}
};
const pes = () => S.pessoas || (S.pessoas = {fichas:[], metas:[], conversas:[], horas:[], config:{limiteHoras:10}});
const ficha = id => pes().fichas.find(f => f.id===id);
const fichaDoUser = uid => pes().fichas.find(f => f.userId===uid);
const mesRot = m => MES[Number(m.slice(5,7))-1] + "/" + m.slice(2,4);
const fimMes = m => addDays(addMeses(m+"-01", 1), -1);
const fmtH = h => { const n = Number(h)||0, s = n < 0 ? "−" : n > 0 ? "+" : "", a = Math.abs(n); return s + Math.floor(a) + "h" + (Math.round((a % 1)*60) ? String(Math.round((a % 1)*60)).padStart(2,"0") : ""); };
function lerHoras(v){ const s = String(v||"").trim().replace("−","-"); if (!s) return ""; const neg = s.startsWith("-"); const t = s.replace(/^[+-]/,"");
  let n; if (t.includes(":") || /h/i.test(t)){ const [h, m] = t.split(/[:h]/i); n = (Number(h)||0) + (Number(m)||0)/60; } else n = Number(t.replace(",","."));
  return isNaN(n) ? null : Math.round((neg ? -n : n)*100)/100; }
const tempoCasa = adm => { if (!adm) return ""; const m = Math.floor(diasEntre(adm, today())/30.44); return m < 12 ? plural(Math.max(m,0),"mês","meses") : plural(Math.floor(m/12),"ano","anos") + (m % 12 ? " e " + plural(m % 12,"mês","meses") : ""); };

// realizado das metas automáticas, pelos registros da ferramenta
function realizadoMeta(mt, f){
  if (mt.indicador==="manual") return temNum(mt.realizado) ? Number(mt.realizado) : null;
  const uid = f && f.userId; if (!uid) return null;
  const ini = mt.mes + "-01", fim = fimMes(mt.mes), noMes = d => d && d >= ini && d <= fim;
  const evs = e => S.tasks.filter(ehEsteira).reduce((s, t) => s + histDe(t).filter(x => x.e===e && !x.rot && x.por===uid && noMes(dia(x.em||""))).length, 0);
  const conc = S.tasks.filter(t => t.status==="concluida" && t.responsavelId===uid && noMes(dia(t.concluidaEm||"")));
  const pct = (lista, ok) => lista.length ? Math.round(lista.filter(ok).length / lista.length * 100) : null;
  switch (mt.indicador){
    case "agendamentos": return evs("agendado");
    case "confirmacoes": return evs("confirmado");
    case "contatos": return conc.filter(ehContato).length;
    case "orc_qtd": return conc.filter(t => t.tipo==="Pagamento de orçamento").length;
    case "orc_valor": return somaValor(conc.filter(t => t.tipo==="Pagamento de orçamento"));
    case "recebimentos": return conc.filter(ehReceb).length;
    case "tarefas_prazo": return pct(S.tasks.filter(t => t.responsavelId===uid && t.status!=="cancelada" && noMes(t.prazo) && t.prazo <= today() && !ehPagamento(t.tipo)), t => t.status==="concluida" && dia(t.concluidaEm) <= t.prazo);
    case "contagens_prazo": return pct(est().contagens.filter(c => c.responsavelId===uid && noMes(c.prazo) && c.prazo <= today()), c => c.status==="concluida" && (c.concluidaEm||"") <= c.prazo);
  }
  return null;
}

// alertas: férias (CLT), experiência, documentos e banco de horas
function feriasPeriodos(f){
  if (f.contrato!=="CLT" || !ehData(f.admissao||"")) return [];
  const dias = (f.ferias||[]).filter(x => x.status!=="cancelada").sort((a,b) => a.inicio.localeCompare(b.inicio)).reduce((s, x) => s + diasEntre(x.inicio, x.fim) + 1, 0);
  const out = []; let resto = dias;
  for (let k = 1; k < 40; k++){
    const fimAq = addDays(addMeses(f.admissao, 12*k), -1); if (fimAq >= today()) break;
    const limite = addDays(addMeses(f.admissao, 12*(k+1)), -1), cob = Math.min(30, resto); resto -= cob;
    out.push({k, ini: addMeses(f.admissao, 12*(k-1)), fimAq, limite, faltam: 30 - cob});
  }
  return out;
}
function alertasPessoa(f){
  const out = [], h = today(), add = (tipo, sev, texto, data) => out.push({f, tipo, sev, texto, data});
  if (f.ativo===false) return out;
  feriasPeriodos(f).filter(p => p.faltam > 0).forEach(p => {
    const d = diasEntre(h, p.limite);
    if (d < 0) add("Férias", "bad", `Férias do período ${brAno(p.ini)}–${brAno(p.fimAq)} vencidas (${p.faltam} dias). Férias concedidas fora do prazo são pagas em dobro.`, p.limite);
    else if (d <= 60) add("Férias", "warn", `Programar ${p.faltam} dias de férias até ${brAno(p.limite)} (faltam ${plural(d,"dia","dias")}).`, p.limite);
  });
  if (f.contrato==="CLT" && ehData(f.admissao||"")){
    const e1 = addDays(f.admissao, 44), e2 = addDays(f.admissao, 89);
    if (h <= e1 && diasEntre(h, e1) <= 10) add("Experiência", "warn", `1º período de experiência termina em ${brAno(e1)}: decidir se prorroga.`, e1);
    else if (h > e1 && h <= e2 && diasEntre(h, e2) <= 10) add("Experiência", "warn", `Experiência termina em ${brAno(e2)}: decidir sobre a efetivação.`, e2);
  }
  (f.docs||[]).forEach(dc => { if (!ehData(dc.validade||"")) return; const d = diasEntre(h, dc.validade);
    if (d < 0) add("Documento", "bad", `${dc.nome} vencido desde ${brAno(dc.validade)}.`, dc.validade);
    else if (d <= 30) add("Documento", "warn", `${dc.nome} vence em ${brAno(dc.validade)}.`, dc.validade); });
  const ult = pes().horas.filter(x => x.pessoaId===f.id).sort((a,b) => a.mes.localeCompare(b.mes)).pop(), lim = Number(pes().config.limiteHoras) || 10;
  if (ult && Math.abs(Number(ult.saldo)) > lim) add("Banco de horas", Number(ult.saldo) > 0 ? "warn" : "bad", `Saldo de ${fmtH(ult.saldo)} em ${mesRot(ult.mes)} (limite ±${lim}h).`, fimMes(ult.mes));
  return out;
}
const alertasTodos = () => pes().fichas.flatMap(alertasPessoa).sort((a,b) => (a.sev==="bad"?0:1)-(b.sev==="bad"?0:1) || a.data.localeCompare(b.data));

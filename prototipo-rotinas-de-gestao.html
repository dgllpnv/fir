/* =========================================================
   ESTOQUE — rotina de inventário (não substitui o sistema principal)
   contagem inicial + entradas − descartes − contagem final = consumo do período
   ========================================================= */
const CATEGORIAS_ESTOQUE = ["Injetáveis", "Vitaminas e ADEK", "Soros", "Bioestimuladores", "Implantes hormonais", "Descartáveis", "Dermocosméticos", "Outros"];
const MOTIVOS_DESCARTE = ["Vencido", "Avaria ou quebra", "Sobra de frasco aberto", "Outro"];
const est = () => S.estoque || (S.estoque = {itens:[], movs:[], contagens:[], locais:[]});
const itemEst = id => est().itens.find(i => i.id===id);
const locaisEst = (uni) => (est().locais||[]).filter(l => l.ativo!==false && (!uni || !l.unidadeId || l.unidadeId===uni)).sort((a,b) => a.nome.localeCompare(b.nome));
const nomeLocal = id => ((est().locais||[]).find(l => l.id===id) || {}).nome || "";
const rotLocal = l => l.nome + (temUnidades() && l.unidadeId ? " · " + nomeUnidade(l.unidadeId) : "");
const porLocal = (a, b) => (nomeLocal(a.localId) || "~").localeCompare(nomeLocal(b.localId) || "~") || a.nome.localeCompare(b.nome);
const sinalMov = m => m.tipo==="entrada" ? 1 : m.tipo==="ajuste" ? (Number(m.sinal)===1 ? 1 : -1) : m.tipo==="contagem" ? 0 : -1;
const movSeq = m => Number(String(m.id||"").replace(/\D/g,"")) || 0;
const movOrd = (a, b) => (a.data + (a.em||"")).localeCompare(b.data + (b.em||"")) || (movSeq(a) - movSeq(b));
const movsItem = id => est().movs.filter(m => m.itemId===id).sort(movOrd);
const ultContagem = (id, ate) => movsItem(id).filter(m => m.tipo==="contagem" && (!ate || m.data <= ate)).pop() || null;
function saldoItem(id){
  const ms = movsItem(id), c = ms.filter(m => m.tipo==="contagem").pop();
  const depois = c ? ms.filter(m => movOrd(m, c) > 0) : ms;
  let q = c ? Number(c.qtd)||0 : 0;
  depois.forEach(m => { q += sinalMov(m) * (Number(m.qtd)||0); });
  return {qtd: Math.max(0, Math.round(q*100)/100), contagem: c, semContagem: !c && !ms.filter(m => m.tipo!=="consumo").length};
}
// validades: as da última contagem + entradas posteriores (descartes de vencidos abatem da validade informada)
function validadesItem(id, lista){
  const ms = lista ? lista.filter(m => m.itemId===id).sort(movOrd) : movsItem(id), c = ms.filter(m => m.tipo==="contagem").pop();
  const mapa = {};
  const soma = (v, q) => { if (!v) return; mapa[v] = (mapa[v]||0) + q; };
  if (c) (c.validades||[]).forEach(x => soma(x.v, Number(x.q)||0));
  (c ? ms.filter(m => movOrd(m, c) > 0) : ms).forEach(m => {
    if (m.tipo==="entrada" && m.validade) soma(m.validade, Number(m.qtd)||0);
    if (m.tipo!=="entrada" && m.tipo!=="contagem" && m.validade && mapa[m.validade]!==undefined) soma(m.validade, sinalMov(m) * (Number(m.qtd)||0));
  });
  // saídas sem lote informado saem primeiro dos lotes que vencem antes
  let usado = (c ? ms.filter(m => movOrd(m, c) > 0) : ms).filter(m => m.tipo!=="entrada" && m.tipo!=="contagem" && !(m.validade && mapa[m.validade]!==undefined)).reduce((s,m) => s - sinalMov(m) * (Number(m.qtd)||0), 0);
  const lotes = Object.entries(mapa).filter(([,q]) => q > 0).map(([v,q]) => ({v, q})).sort((a,b) => a.v.localeCompare(b.v));
  lotes.forEach(l => { const t = Math.min(l.q, usado); l.q = Math.round((l.q - t)*100)/100; usado -= t; });
  return lotes.filter(l => l.q > 0);
}
function consumoItem(id, ini, fim){
  const ms = movsItem(id), cs = ms.filter(m => m.tipo==="contagem");
  const a = cs.filter(m => m.data <= ini).pop() || cs.find(m => m.data >= ini && m.data <= fim);
  const b = cs.filter(m => m.data <= fim && a && movOrd(m, a) > 0).pop();
  if (!a || !b) return null;
  const entre = ms.filter(m => movOrd(m, a) > 0 && movOrd(m, b) < 0);
  const soma = f => Math.round(entre.filter(f).reduce((s,m) => s + (Number(m.qtd)||0), 0)*1000)/1000;
  const ent = soma(m => m.tipo==="entrada"), desc = soma(m => m.tipo==="descarte");
  const pac = soma(m => m.tipo==="consumo" && !!m.pacienteId), semPac = soma(m => m.tipo==="consumo" && !m.pacienteId), int = soma(m => m.tipo==="interno");
  const ajS = soma(m => m.tipo==="ajuste" && Number(m.sinal)!==1), ajE = soma(m => m.tipo==="ajuste" && Number(m.sinal)===1);
  const reg = Math.round((pac + semPac + int)*1000)/1000, saidas = Math.round((reg + desc + ajS - ajE)*1000)/1000;
  const consumo = Math.round(((Number(a.qtd)||0) + ent - desc - (Number(b.qtd)||0))*1000)/1000;
  const esperadoFim = Math.round(((Number(a.qtd)||0) + ent - saidas)*1000)/1000;
  return {ini:a, fim:b, ent, desc, pac: Math.round((pac+semPac)*1000)/1000, int, aj: Math.round((ajE-ajS)*1000)/1000, saidas, consumo, reg, esperadoFim,
    dif: Math.round(((Number(b.qtd)||0) - esperadoFim)*1000)/1000, perda: Math.round((esperadoFim - (Number(b.qtd)||0))*1000)/1000};
}
// consumo registrado pelas sessões (baixas automáticas) num período
function registradoItem(id, ini, fim){ const ms = movsItem(id).filter(m => (m.tipo==="consumo" || m.tipo==="interno") && m.data > ini && m.data <= fim);
  return {qtd: Math.round(ms.reduce((s,m) => s + (Number(m.qtd)||0), 0)*100)/100, sessoes: ms.length}; }
const fmtPerda = (p, i, adm) => !p ? '<span class="muted">0</span>' : `<span class="pill ${p > 0 ? "p-bad" : "p-warn"}">${p > 0 ? "−" : "+"}${fmtQ(Math.abs(p), i)}${adm && Number(i.custo) > 0 ? " · " + brl0(Math.abs(p)*i.custo) : ""}</span>`;
function curvaABC(){
  const itens = est().itens.filter(i => i.ativo!==false).map(i => ({i, v: saldoItem(i.id).qtd * (Number(i.custo)||0)})).sort((a,b) => b.v - a.v);
  const tot = itens.reduce((s,x) => s + x.v, 0); let acc = 0; const out = {};
  itens.forEach(x => { const antes = acc; acc += x.v; out[x.i.id] = !tot || x.v===0 ? "C" : antes/tot < .8 ? "A" : antes/tot < .95 ? "B" : "C"; });
  return out;

const altoValor = (it, abc) => it.altoValor==="sim" ? true : it.altoValor==="nao" ? false : (abc||curvaABC())[it.id]==="A";

    g0("eigler").onclick = e => { e.preventDefault(); abrirLeitor(c => {

      if (!c.gtin){ toast("Não foi possível reconhecer o código da caixa."); return; }
      const outro = est().itens.find(i => i.id!==ef0.itemId && i.gtin && i.gtin.padStart(14,"0")===c.gtin); if (outro){ toast("Este código já está ligado a " + outro.nome + "."); return; }

      if (!g0("einome").value.trim()) g0("einome").focus(); }, "Ler o código da caixa"); };
  } else {

      Object.assign(ef0, {qtd: v("emq"), data: v("emd"), obs: v("emo"), procId: v("emproc"), aplicadoPor: v("emap"), motivo: v("emm"), sinal: v("emsinal"), un: v("emun") || ef0.un}); if (g0("emv") && g0("emv").tagName==="SELECT") ef0.validade = g0("emv").value; };

      if (!it || !(q > 0)){ out.textContent = it ? `Em estoque: ${fmtQ(saldoItem(it.id).qtd, it)}${usoItem(it) ? " (" + fmtUso(saldoItem(it.id).qtd, it) + ")" : ""}.` : ""; return; }
      const un = g0("emun") ? g0("emun").value : "est", cp = compraItem(it), u = usoItem(it);
      const qe = un==="compra" && cp ? q*cp.f : un==="uso" && u ? q/u.f : q;
      let t = un!=="est" ? `= ${fmtQ(Math.round(qe*1000)/1000, it)}` : "";
      if (ef0.tipo!=="entrada" && (ef0.sub||"paciente")==="paciente" && sobraDescartada(it) && qe % 1 > 1e-9) t += ` · sobra de ${fmtQ(Math.round((Math.ceil(qe) - qe)*1000)/1000, it)} vai para descarte (a sobra deste item não é aproveitada)`;
      out.textContent = t ? t + "." : ""; };
    g0("efitem").onchange = () => { guardar(); ef0.itemId = g0("efitem").value; ef0.un = null; ef0.validade = undefined; render(); };
    const bler = g0("emler"); if (bler) bler.onclick = e => { e.preventDefault(); guardar(); abrirLeitor(c => { const it = itemDoCodigo(c);
      if (!it){ if (c.gtin){ S.ligarCodigo = Object.assign({}, c, {acaoFixa: ef0.tipo==="entrada" ? "entrada" : "saida"}); S.estForm = null; render(); return; } toast("Este código não é de um item do estoque."); return; }
      ef0.itemId = it.id; ef0.un = null; ef0.validade = c.validade || undefined; ef0.lote = c.lote || ef0.lote; render(); focoForm(); toast("Item: " + it.nome); }); };
    if (g0("emun")) g0("emun").onchange = () => { if (ef0.tipo==="entrada"){ guardar(); render(); } else conv(); };
    g0("emq").addEventListener("input", conv); conv();
    fm.querySelectorAll("[data-esub]").forEach(b => b.onclick = () => { guardar(); ef0.sub = b.dataset.esub; ef0.un = null; render(); });
    if (g0("espk")) pkSaida = ligarPicker("es", ef0.pacienteId, id => { ef0.pacienteId = id; });

        gtin: g("eigtin").value.replace(/\D/g,""), unidCompra: g("eiuc").value.trim(), fatorCompra: Number(g("eifc").value) || "", unidUso: g("eiuu").value.trim(), fatorUso: Number(g("eifu").value) || "", aproveitaSobra: g("eisob").checked,

        altoValor: g("eiav").value, ativo: g("eiativo") ? g("eiativo").checked : true};
      if (custo!==undefined) item.custo = custo;
      if (!item.nome){ toast("Dê um nome ao item."); return; }
      if (item.unidCompra && !(item.fatorCompra > 0)){ toast(`Informe quantas ${item.medida} vêm em 1 ${item.unidCompra}.`); g("eifc").focus(); return; }
      if (item.unidUso && !(item.fatorUso > 0)){ toast(`Informe quanto tem em 1 ${item.medida} (em ${item.unidUso}).`); g("eifu").focus(); return; }
      const ini = g("eiqtd") && g("eiqtd").value!=="" ? {qtd: Number(g("eiqtd").value), validade: g("eiv1").value} : null;

    const un = g("emun") ? g("emun").value : "est", cp = compraItem(it), u = usoItem(it);
    const fator = un==="compra" && cp ? cp.f : un==="uso" && u ? 1/u.f : 1, qe = Math.round(q*fator*1000)/1000;
    let custo = g("emc") ? lerValor(g("emc").value) : "";

    if ((sub==="interno" || sub==="ajuste") && !g("emo").value.trim()){ toast("Informe o motivo."); g("emo").focus(); return; }
    let pacienteId = "";
    if (sub==="paciente"){ try { pacienteId = await pkSaida.resolver(); } catch(m){ toast(String(m)); return; } }
    const mov = {itemId, tipo: ef.tipo==="entrada" ? "entrada" : sub==="paciente" ? "consumo" : sub, qtd: qe, data: g("emd").value, validade: g("emv") ? g("emv").value || "" : "", obs: g("emo").value.trim(),

  });

/* =========================================================
   CÓDIGO QR DO ESTOQUE — etiqueta por item e leitura pela câmera do celular
   Lê também o código da caixa do medicamento (DataMatrix GS1: produto, lote e validade) e o código de barras (EAN).
   Bibliotecas carregadas só quando usadas.
   ========================================================= */
const LIB_QRGEN = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";
const LIB_QRLER = "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
const libsCarregadas = {};
function carregarLib(url){
  return libsCarregadas[url] || (libsCarregadas[url] = new Promise((ok, erro) => { const s = document.createElement("script"); s.src = url; s.onload = ok; s.onerror = () => { delete libsCarregadas[url]; erro(new Error("Não foi possível carregar o leitor. Confira a internet.")); }; document.head.appendChild(s); }));
}
const codigoQrItem = it => "FRMEST:" + (CLINICA_COD || "demo") + ":" + it.id;
async function svgQr(texto){
  await carregarLib(LIB_QRGEN);
  const q = window.qrcode(0, "M"); q.addData(texto); q.make();
  return q.createSvgTag({cellSize:4, margin:2, scalable:true});
}
// interpreta o que foi lido: etiqueta da ferramenta, DataMatrix GS1 ou código de barras
function interpretarCodigo(txt){
  const t = String(txt||"").trim();
  const m = t.match(/^FRMEST:[^:]*:(.+)$/); if (m) return {itemId: m[1], origem:"etiqueta"};
  const gs = t.replace(/^\]d2|^\]C1|^\]Q3/, "").replace(/\u001d/g, "|");
  if (/^01\d{14}/.test(gs)){ // GS1: (01) GTIN, (17) validade AAMMDD, (10) lote, (21) série
    const out = {gtin: gs.slice(2, 16), origem:"medicamento"}; let r = gs.slice(16);
    while (r.length){ r = r.replace(/^\|/, ""); const ai = r.slice(0,2);
      if (ai==="17" || ai==="15"){ const v = r.slice(2,8); if (ai==="17") out.validade = "20" + v.slice(0,2) + "-" + v.slice(2,4) + "-" + (v.slice(4,6)==="00" ? "28" : v.slice(4,6)); r = r.slice(8); }
      else if (ai==="10" || ai==="21"){ const fim = r.indexOf("|"), val = fim < 0 ? r.slice(2) : r.slice(2, fim); if (ai==="10") out.lote = val; else out.serie = val; r = fim < 0 ? "" : r.slice(fim); }
      else break; }
    return out;
  }
  if (/^\d{8,14}$/.test(t)) return {gtin: t.padStart(14, "0"), origem:"barras"};
  return {texto: t, origem:"desconhecido"};
}
const itemDoCodigo = c => c.itemId ? itemEst(c.itemId) : c.gtin ? est().itens.find(i => i.gtin && i.gtin.padStart(14,"0")===c.gtin) : null;

/* ---------- importar cadastro de itens (exportado do sistema principal) ---------- */
const COLS_IMPORT_EST = [["local",["local","localizacao","armazenamento","sala","onde fica"]], ["codigo",["codigo","cod","sku","referencia","ref"]], ["minimo",["minimo","min"]], ["custo",["custo","preco","valor"]], ["medida",["unidade de medida","medida","unid","un"]],
  ["categoria",["categoria","grupo","classe","familia","tipo"]], ["rot",["rotatividade","giro"]], ["val",["validade","vencimento"]], ["nome",["nome","produto","descricao","item","material","insumo"]]];
const simNao = v => ["sim","s","x","1","true","verdadeiro"].includes(norm(String(v??"")));
function prepararImportEst(tabela){
  const brutas = tabela.filter(r => Array.isArray(r) && r.some(v => String(v ?? "").trim()!==""));
  if (!brutas.length) return {erro:"Nenhuma linha encontrada na planilha."};
  const cab = brutas[0].map(h => norm(String(h ?? "")));
  const temCab = cab.some(h => ["nome","produto","descricao","item","material","insumo"].some(c => h.includes(c)));
  const idx = {codigo:-1, nome:0, categoria:1, medida:2, custo:3, minimo:4, rot:5, val:6, local:-1};
  if (temCab){ const usados = new Set(); Object.keys(idx).forEach(k => idx[k] = -1);
    COLS_IMPORT_EST.forEach(([k, chaves]) => { const i = cab.findIndex((h, j) => !usados.has(j) && chaves.some(c => h===c || h.includes(c) && c.length > 2)); idx[k] = i; if (i >= 0) usados.add(i); }); }
  if (idx.nome < 0) return {erro:"Não encontrei a coluna com o nome do item. Use o modelo ou deixe o nome na primeira coluna."};
  const dados = temCab ? brutas.slice(1) : brutas;
  if (dados.length > 2000) return {erro:"A lista passa de 2.000 itens. Divida em partes."};
  const cel = (r, k) => idx[k] >= 0 ? r[idx[k]] : "";
  const porNome = {}, porCod = {}; est().itens.forEach(i => { porNome[norm(i.nome)] = i; if (i.codigo) porCod[norm(i.codigo)] = i; });
  const vistos = new Set();
  return {linhas: dados.map((r, k) => {
    const o = {linha: k + (temCab ? 2 : 1), nome: String(cel(r,"nome") ?? "").trim().replace(/\s+/g," ").slice(0,80), codigo: String(cel(r,"codigo") ?? "").trim().slice(0,40),
      categoria: String(cel(r,"categoria") ?? "").trim().slice(0,40), medida: String(cel(r,"medida") ?? "").trim().slice(0,20), local: String(cel(r,"local") ?? "").trim().slice(0,40), avisos: []};
    if (o.local && !(est().locais||[]).some(l => norm(l.nome)===norm(o.local))) o.avisos.push(`local “${o.local}” será criado`);
    const c = cel(r,"custo"); o.custo = c==="" || c==null ? "" : typeof c === "number" ? c : lerValor(String(c).replace(/[R$\s]/g,""));
    if (o.custo===null){ o.avisos.push("custo não reconhecido"); o.custo = ""; }
    const m = cel(r,"minimo"); o.minimo = m==="" || m==null || isNaN(Number(String(m).replace(",","."))) ? "" : Number(String(m).replace(",","."));
    o.altaRot = idx.rot >= 0 ? simNao(cel(r,"rot")) : undefined; o.controlaValidade = idx.val >= 0 ? simNao(cel(r,"val")) : undefined;
    if (o.categoria && !CATEGORIAS_ESTOQUE.some(x => norm(x)===norm(o.categoria))) o.avisos.push(`categoria “${o.categoria}” entra como está`);
    if (!o.nome){ o.status = "erro"; o.motivo = "Sem nome do item"; return o; }
    const ch = o.codigo ? "c" + norm(o.codigo) : "n" + norm(o.nome);
    if (vistos.has(ch)){ o.status = "ignorada"; o.motivo = "Item repetido na lista"; return o; }
    vistos.add(ch);
    const ex = (o.codigo && porCod[norm(o.codigo)]) || porNome[norm(o.nome)];
    o.status = ex ? "existe" : "novo"; if (ex) o.existente = ex.nome;
    return o; })};
}

/* ---------- entrada pela nota fiscal eletrônica (XML da NF-e) ---------- */
const tokensNome = s => norm(s).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w => w.length > 1 && !["de","da","do","com","para","em","x","c"].includes(w));
// parte do nome do item encontrada na descrição da nota (as notas costumam ter descrições longas)
function parecido(a, b){ const A = [...new Set(tokensNome(a))], B = tokensNome(b); if (!A.length || !B.length) return 0;
  const achou = A.filter(x => B.some(w => w===x || (w.length >= 3 && x.length >= 3 && (x.startsWith(w) || w.startsWith(x))))).length; return achou / A.length; }
function lerXmlNFe(txt){
  const doc = new DOMParser().parseFromString(txt, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("O arquivo não é um XML válido.");
  const tg = (el, n) => { const x = el && el.getElementsByTagName(n)[0]; return x ? x.textContent.trim() : ""; };
  const inf = doc.getElementsByTagName("infNFe")[0]; if (!inf) throw new Error("Não parece um XML de NF-e (nota fiscal eletrônica).");
  const emit = inf.getElementsByTagName("emit")[0], ide = inf.getElementsByTagName("ide")[0];
  const nota = {numero: tg(ide,"nNF"), data: (tg(ide,"dhEmi") || tg(ide,"dEmi")).slice(0,10), fornecedor: tg(emit,"xFant") || tg(emit,"xNome"), cnpj: tg(emit,"CNPJ"), chave: (inf.getAttribute("Id")||"").replace(/^NFe/,"")};
  const linhas = [];
  [...inf.getElementsByTagName("det")].forEach(det => {
    const p = det.getElementsByTagName("prod")[0]; if (!p) return;
    const base = {cProd: tg(p,"cProd"), xProd: tg(p,"xProd"), uCom: tg(p,"uCom"), qCom: Number(tg(p,"qCom"))||0, vUn: Number(tg(p,"vUnCom"))||0};
    const rastros = [...p.getElementsByTagName("rastro")];
    if (rastros.length) rastros.forEach(r => linhas.push(Object.assign({}, base, {qCom: Number(tg(r,"qLote")) || base.qCom, lote: tg(r,"nLote"), validade: tg(r,"dVal").slice(0,10)})));
    else linhas.push(Object.assign({}, base, {lote:"", validade: tg(p,"dVal").slice(0,10)}));
  });
  if (!linhas.length) throw new Error("Nenhum produto encontrado na nota.");
  return {nota, linhas};
}
function casarLinhasNota(dado){
  const itens = est().itens.filter(i => i.ativo!==false);
  dado.linhas.forEach(l => {
    const vinc = itens.find(i => (i.vinculos||[]).some(v => v.cProd===l.cProd && (!v.cnpj || !dado.nota.cnpj || v.cnpj===dado.nota.cnpj)));
    if (vinc){ const v = vinc.vinculos.find(v => v.cProd===l.cProd); l.itemId = vinc.id; l.fator = Number(v.fator) || 1; l.como = "vínculo salvo"; return; }
    let melhor = null, sc = 0; itens.forEach(i => { const s = Math.max(parecido(i.nome, l.xProd), i.codigo && norm(i.codigo)===norm(l.cProd) ? 1 : 0); if (s > sc){ sc = s; melhor = i; } });
    if (melhor && sc >= .5){ l.itemId = melhor.id; l.como = sc >= .75 ? "nome parecido" : "sugestão: confira"; } else { l.itemId = ""; l.como = "sem correspondência"; }
    l.fator = melhor && sc >= .5 && compraItem(melhor) ? compraItem(melhor).f : 1;
  });
  return dado;
}

function abrirContagem(id){ S.estTab = "contagens"; S.contSel = id; ir("estoque"); }

        return `${cabLocal(i, ki)}<div class="contitem" data-ci="${esc(i.id)}"><div class="info"><b>${esc(i.nome)}</b><span class="muted">${esc(i.categoria||"")} · ${esc(i.medida||"un.")}</span></div>

          <button class="link" type="button" data-cadd="${esc(i.id)}">+ outra validade</button><span class="muted conttot">Total: <b>${fmtQ(linhasV.reduce((s,x)=>s+(Number(x.q)||0),0), i)}</b></span></div>`

        if (vs.some(x => x.q!=="")) vals[id] = {validades: vs}; else delete vals[id]; }
      else { const q = box.querySelector("[data-cs]").value; if (q!=="") vals[id] = {qtd: q}; else delete vals[id]; } }); };
  main.querySelectorAll("[data-cq]").forEach(inp => inp.oninput = () => { const box = inp.closest("[data-ci]"), it = itemEst(box.dataset.ci);

    S._confFalta = false;

    render(); window.scrollTo(0,0);
  };
  document.getElementById("cfim").onclick = () => salvar(true);
  document.getElementById("csalva").onclick = () => salvar(false);
}

function estAnalise(corpo){
  const adm = pode("estoque.gerir"), f = S.estAn || (S.estAn = {per:"ant", dias:60, uni:""});
  if (f.per==="per" && !f.ini){ f.ini = addDays(today(),-29); f.fim = today(); }
  const rng = intervalo(f.per, f.ini, f.fim), abc = curvaABC();
  const itens = est().itens.filter(i => i.ativo!==false && (!f.uni || i.unidadeId===f.uni)).sort((a,b) => a.nome.localeCompare(b.nome));
  const cons = itens.map(i => ({i, c: consumoItem(i.id, rng[0], rng[1]), g: registradoItem(i.id, addDays(rng[0], -1), rng[1])}));
  const perdaNE = cons.reduce((s,x) => s + (x.c && x.c.perda > 0 ? x.c.perda*(Number(x.i.custo)||0) : 0), 0), itensPerda = cons.filter(x => x.c && x.c.perda > 0).length;
  const lim = addDays(today(), f.dias);
  const vencendo = []; itens.forEach(i => { if (i.controlaValidade) validadesItem(i.id).filter(x => x.v <= lim).forEach(x => vencendo.push({i, ...x})); });
  vencendo.sort((a,b) => a.v.localeCompare(b.v));
  const abaixo = itens.map(i => ({i, s: saldoItem(i.id)})).filter(x => !x.s.semContagem && Number(x.i.minimo) > 0 && x.s.qtd < Number(x.i.minimo));
  const desc = est().movs.filter(m => m.tipo==="descarte" && m.data >= rng[0] && m.data <= rng[1] && itens.some(i => i.id===m.itemId));
  const perdas = desc.reduce((s,m) => s + (Number(m.qtd)||0)*(Number((itemEst(m.itemId)||{}).custo)||0), 0);
  const valorCons = cons.reduce((s,x) => s + (x.c ? (x.c.consumo + x.c.desc)*(Number(x.i.custo)||0) : 0), 0);
  const temRotina = S.tasks.some(t => t.estoqueRef==="analise" && t.status==="aberta");
  const sub = (c, i) => [c.pac ? `uso em pacientes ${fmtNum(c.pac)}` : "", c.desc ? `descartes ${fmtNum(c.desc)}` : "", c.int ? `uso interno ${fmtNum(c.int)}` : "", c.aj ? `ajustes ${c.aj > 0 ? "+" : "−"}${fmtNum(Math.abs(c.aj))}` : ""].filter(Boolean).join(" · ");
  const tabela = (imp) => `<table class="${imp ? "prtab" : ""}" style="min-width:680px"><thead><tr><th>Item</th><th class="n">Contagem inicial</th><th class="n">Entradas</th><th class="n">Saídas registradas</th><th class="n">Saldo esperado</th><th class="n">Contagem final</th><th class="n">Diferença</th></tr></thead>
    <tbody>${cons.map(({i,c,g}) => `<tr><td><b>${esc(i.nome)}</b>${usoItem(i) ? `<div class="muted" style="font-size:11px">${esc(rotUnid(i))}</div>` : ""}</td>${c ? `<td class="n">${fmtQ(c.ini.qtd,i)}<div class="muted" style="font-size:11px">${br(c.ini.data)}</div></td><td class="n">${c.ent ? "+"+fmtQ(c.ent,i) : "—"}</td>
        <td class="n">${c.saidas ? "−"+fmtQ(c.saidas,i) : "—"}${sub(c,i) ? `<div class="muted" style="font-size:11px">${sub(c,i)}</div>` : ""}</td><td class="n"><b>${fmtQ(c.esperadoFim,i)}</b></td>
        <td class="n"><b>${fmtQ(c.fim.qtd,i)}</b><div class="muted" style="font-size:11px">${br(c.fim.data)}</div></td><td class="n">${imp ? (c.perda ? (c.perda > 0 ? "−" : "+") + fmtQ(Math.abs(c.perda),i) : "0") : fmtPerda(c.perda, i, adm)}</td>`
        : `<td class="n muted" colspan="6">aguardando duas contagens no período${g.qtd ? ` · ${fmtQ(g.qtd,i)} em saídas registradas` : ""}</td>`}</tr>`).join("")}</tbody></table>`;
  corpo.innerHTML = `
    <div class="row2">
      <label class="f" for="eaper">Período<select id="eaper">${PERIODOS.map(([k,l])=>`<option value="${k}" ${f.per===k?"selected":""}>${l}</option>`).join("")}</select></label>

    </div>
    ${f.per==="per" ? datasPersonalizadas("ea", f.ini, f.fim) : ""}

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" type="button" id="eaprint">Imprimir relatório</button>
      ${temRotina ? '<span class="pill p-ok" style="align-self:center">Rotina mensal de análise ativa</span>' : '<button class="btn ghost" type="button" id="earot">Criar rotina mensal de análise</button>'}
    </div>

      <p class="note">Saldo esperado = contagem inicial + entradas − saídas registradas (uso em pacientes, descartes, uso interno e ajustes). A diferença compara o saldo esperado com a contagem final: <b>vermelho</b> é falta (desperdício, desvio ou uso não registrado); <b>amarelo</b> é sobra (entrada não lançada ou saída lançada a mais). Quantidades na unidade de estoque.</p></div>

  ligarDatas("ea", f, "ini", "fim", render);

/* =========================================================
   ESTEIRA DO PACIENTE — a mesma tarefa anda pelas etapas, com histórico
   Agendado → Confirmado → Realizado → Orçamento enviado → Fechado | Perdido
   Saídas: No-show (reagendar volta para Agendado) e Desmarcou
   ========================================================= */
const TIPOS_AGENDA = ["Consulta agendada","Procedimento agendado"], TIPOS_REALIZ = ["Consulta realizada","Procedimento realizado"];
const ETAPAS = {agendado:"Agendada", confirmado:"Confirmada", faltou:"No-show", realizado:"Realizada", orcamento:"Orçamento enviado", fechado:"Fechado", perdido:"Orçamento perdido", desmarcou:"Desmarcada"};
const ETAPA_CLS = {agendado:"p-mute", confirmado:"p-gold", faltou:"p-bad", realizado:"p-ok", orcamento:"p-gold", fechado:"p-ok", perdido:"p-bad", desmarcou:"p-mute"};
const MOTIVOS_PERDA = ["Preço", "Sem retorno do paciente", "Escolheu outro lugar", "Não é o momento", "Outro"];
const ehEsteira = t => !!t.pacienteId && (TIPOS_AGENDA.includes(t.tipo) || TIPOS_REALIZ.includes(t.tipo));
function etapaDe(t){
  if (t.etapa) return t.etapa;
  if (!ehEsteira(t)) return "";
  if (t.status==="cancelada") return "desmarcou";
  return TIPOS_AGENDA.includes(t.tipo) ? "agendado" : t.status==="concluida" ? "realizado" : "agendado";
}
function histDe(t){
  let h = t.historico;
  if (typeof h === "string"){ try { h = JSON.parse(h || "[]"); } catch(e){ h = []; } }
  if (Array.isArray(h) && h.length) return h;
  // tarefas anteriores à esteira: histórico reconstruído a partir das datas
  const out = [{e:"agendado", em:t.criadaEm, por:t.solicitanteId}];
  if (t.status==="concluida" && TIPOS_REALIZ.includes(t.tipo)) out.push({e:"realizado", em:t.concluidaEm, por:t.responsavelId});
  if (t.status==="cancelada") out.push({e:"desmarcou", em:t.concluidaEm || t.criadaEm, por:t.solicitanteId});
  return out;
}
const rotuloAgenda = t => (t.tipo||"").startsWith("Procedimento") ? "procedimento" : "consulta";
function acoesEsteira(t){
  if (!ehEsteira(t) || t.status==="cancelada") return [];
  const e = etapaDe(t), ab = t.status==="aberta";
  if (ab && e==="agendado") return (waLink(pac(t.pacienteId)) ? [["whats", t.confEnviadaEm ? "Reenviar confirmação" : "Enviar confirmação"]] : []).concat([["confirmar","Confirmou"],["noshow","No-show"],["reagendar","Reagendar"],["desmarcar","Desmarcou"]]);
  if (ab && e==="confirmado") return [["noshow","No-show"],["reagendar","Reagendar"],["desmarcar","Desmarcou"]];
  if (ab && (e==="faltou" || e==="desmarcou")) return [["reagendar","Reagendar"],["encerrar","Encerrar"]];
  if (!ab && e==="realizado") return dia(t.concluidaEm||"") >= addDays(today(),-30) ? [["orcamento","Registrar orçamento"],["fechar","Fechou"]] : [];
  if (!ab && e==="orcamento") return [["fechar","Fechou"],["retomar","Registrar follow-up"],["perder","Perdeu"]];
  return [];
}

         ["orcamento","Orçamentos enviados",pct(conta.orcamento,conta.realizado)+" dos realizados"],["fechado","Fechados",pct(conta.fechado,conta.orcamento+0||conta.realizado)+(conta.orcamento?" dos orçamentos":" dos realizados")]]
        .map(([k,l,s],i)=>`<div class="funpasso"><span>${l}</span><b class="num">${conta[k]}</b>${adm && k in valor ? `<em class="num funval">${brl0(valor[k])}${k==="realizado" ? " recebido" : k==="orcamento" ? " orçado" : " fechado"}</em>` : ""}<small>${s||"&nbsp;"}</small><i style="width:${conta.agendado ? Math.max(4, Math.round(conta[k]/Math.max(conta.agendado,1)*100)) : 0}%"></i></div>`).join("")}

      <div class="kpi"><span>Desmarcados</span><b class="num">${conta.desmarcou}</b><span>no período</span></div>
      <div class="kpi"><span>Orçamentos perdidos</span><b class="num">${conta.perdido}</b><span>${adm && valor.perdido ? brl0(valor.perdido) + " em orçamentos · " : ""}${conta.perdido ? "veja os motivos no histórico" : "no período"}</span></div>
    </div>
    <div class="group"><h3>Onde estão os pacientes agora</h3>
      <p class="note">Agendadas, confirmadas, no-show e orçamentos em aberto mostram a situação de hoje; realizadas, fechados e perdidos mostram o período escolhido.</p>
      <div class="kanban">${colunas.map(([e,l]) => { const c = col(e); return `<div class="kcol"><div class="khead"><span class="pill ${ETAPA_CLS[e]}">${esc(l)}</span><b class="num">${c.length}</b>${adm && ["orcamento","fechado","perdido"].includes(e) && c.some(t => Number(t.valorOrcamento) > 0) ? `<span class="num kval">${brl0(c.reduce((s,t) => s + (Number(t.valorOrcamento)||0), 0))}</span>` : ""}</div>
        ${c.slice(0,30).map(miniCard).join("") || `<div class="kvazio">Nenhum</div>`}${c.length>30?`<div class="kvazio">+${c.length-30}</div>`:""}</div>`; }).join("")}</div>
    </div>
  </section>`;
  document.getElementById("eper").onchange = e => { f.per = e.target.value; render(); };
  document.getElementById("eresp").onchange = e => { f.resp = e.target.value; render(); };
  const eu = document.getElementById("euni"); if (eu) eu.onchange = e => { f.uni = e.target.value; render(); };
  ligarDatas("ep", f, "ini", "fim", render);
  main.querySelectorAll("[data-pac]").forEach(b => b.onclick = () => abrirPaciente(b.dataset.pac));
}

/* =========================================================
   RECEBIMENTO — um único lugar para registrar dinheiro recebido
   (grava como os tipos do grupo Pagamentos; regras de receita, LTV e saldo inalteradas)
   ========================================================= */
const REFS_RECEB = [
  {k:"consulta", t:"Consulta", d:"Pagamento de uma consulta (já feita ou de hoje).", tipo:"Pagamento de consulta", aberto:true},
  {k:"sinal", t:"Sinal de consulta", d:"Valor adiantado para reservar uma consulta que ainda vai acontecer.", tipo:"Sinal de consulta", aberto:true},
  {k:"novo", t:"Procedimento ou programa novo", d:"Venda: o paciente fechou agora um procedimento ou programa (orçamento aprovado).", tipo:"Pagamento de orçamento", aberto:true},
  {k:"plano", t:"Programa em andamento", d:"Parcela ou sessão de um programa que o paciente já está fazendo.", tipo:"Pagamento de saldo em aberto", aberto:false},
  {k:"saldo", t:"Saldo em aberto", d:"Restante de um valor que ficou pendente (fora de programa).", tipo:"Pagamento de saldo em aberto", aberto:false}
];
function rotuloReceb(t){
  const a = t.adesaoId ? adesao(t.adesaoId) : null;
  if (t.tipo==="Sinal de consulta") return "Sinal de consulta";
  if (t.tipo==="Pagamento de consulta") return "Consulta";
  if (t.tipo==="Pagamento de orçamento") return a ? "Programa novo · " + a.plano : "Procedimento ou programa novo";
  if (t.tipo==="Pagamento de saldo em aberto" || t.tipo==="Recebimento de saldo") return a ? "Programa em andamento · " + a.plano : "Saldo em aberto";
  if (ehSessao(t)) return "Na sessão · " + ((a||{}).plano || "programa");
  return "Na própria tarefa · " + t.tipo;
}
const ehReceb = t => t.status==="concluida" && t.pacienteId && (ehPagamento(t.tipo) || (aceitaPagamento(t.tipo) && (Number(t.valor) > 0 || !!t.formaPagamento)));
function linhaReceb(t, comPac){
  const adm = vVal();
  return `<div class="rcrow"><div style="min-width:0">${comPac ? `<b>${esc(nomePac(t.pacienteId))}</b>` : `<b>${brAno(dia(t.concluidaEm))}</b>`}
      <span class="muted">${esc(rotuloReceb(t))}${t.formaPagamento ? " · " + esc(t.formaPagamento) : ""}${comPac ? " · registrado por " + esc(primeiro(t.responsavelId)) : ""}</span></div>
    <span class="num rcval">${adm ? brl(Number(t.valor)||0) : ""}</span></div>`;
}
function abrirRecebimento(pre){ S.recPre = pre || {}; ir("receber"); }
function vReceber(main){
  const pre = S.recPre || {}, adm = vVal(), f = S.recForm || (S.recForm = {ref: pre.ref || "", adesaoId: pre.adesaoId || "", uni: pre.cardId ? pre.unidadeId : undefined, campanhaId: pre.campanhaId || ""});
  const card = pre.cardId ? S.tasks.find(x => x.id===pre.cardId) : null;
  if (card && Array.isArray(card.programaOrc) && card.programaOrc.length && !f.bld){ f.prog = true; f.bld = bldDoOrcamento(card.programaOrc); f.doOrc = true; }
  const hojeLista = S.tasks.filter(t => ehReceb(t) && dia(t.concluidaEm)===today()).sort((a,b)=>(b.concluidaEm||"").localeCompare(a.concluidaEm||""));
  const porForma = {}; hojeLista.forEach(t => { const k = t.formaPagamento || "Sem forma"; porForma[k] = (porForma[k]||0) + (Number(t.valor)||0); });
  main.innerHTML = `<section>
    <div class="eyebrow">Financeiro</div>
    <h2 style="margin-bottom:4px">Registrar recebimento</h2>
    ${metaMesHtml()}
    <p class="note" style="margin-top:0">Todo dinheiro que o paciente pagou entra por aqui. Atendimento é tarefa; dinheiro é recebimento.</p>
    ${card ? `<div class="rcaviso"><b>Fechamento do orçamento · ${esc(nomePac(card.pacienteId))}</b><span class="note" style="margin:0">${Number(card.valorOrcamento) > 0 ? "Orçamento de <b>" + brl(card.valorOrcamento) + "</b>. Informe a entrada: o restante vira saldo em aberto sozinho. " : "Registre a entrada recebida e, se ficou parte para depois, o valor em aberto. "}</span></div>` : ""}
    <form class="card" id="frc" style="display:grid;gap:14px">
      ${pickerHtml("rc")}
      <div id="rcresto"></div>
    </form>
    <div class="group"><h3>Recebimentos de hoje <span class="n">${hojeLista.length}</span></h3>
      ${adm && hojeLista.length ? `<div class="kpis campkpis"><div class="kpi hero"><span>Total recebido hoje</span><b class="num">${brl0(somaValor(hojeLista))}</b><span style="color:inherit;opacity:.8">${Object.entries(porForma).map(([k,v])=>esc(k)+" "+brl0(v)).join(" · ")}</span></div></div>` : ""}
      ${hojeLista.length ? `<div class="card rclista">${hojeLista.map(t=>linhaReceb(t, true)).join("")}</div>` : `<div class="empty">Nenhum recebimento registrado hoje.</div>`}
    </div>
  </section>`;
  const resto = document.getElementById("rcresto");
  let pid = "", pnovo = false;
  const guardar = () => { const g = id => document.getElementById(id);
    if (g("rcv")) f.valor = g("rcv").value; if (g("rcf")) f.forma = g("rcf").value; if (g("rcd")) f.data = g("rcd").value;
    if (g("rcab")) f.aberto = g("rcab").value; if (g("rcobs2")) f.obs = g("rcobs2").value; if (g("rcuni")) f.uni = g("rcuni").value;
    if (g("rccamp")) f.campanhaId = g("rccamp").value; };
  const desenhar = () => {
    if (!pid && !pnovo){ resto.innerHTML = `<p class="note" style="margin:0">Escolha o paciente para continuar.</p>`; return; }
    const ades = S.adesoes.filter(a => a.pacienteId===pid && a.status!=="cancelado").map(a => ({a, s: statsAdesao(a)}))
      .filter(x => x.s.sit.key!=="concluido" || x.s.saldo > 0);
    const info = saldoInfo(pid), sa = saldoAviso(pid);
    const recentes = S.tasks.filter(t => t.pacienteId===pid && ehReceb(t) && dia(t.concluidaEm) >= addDays(today(), -7)).sort((a,b)=>(b.concluidaEm||"").localeCompare(a.concluidaEm||""));
    if (f.ref==="plano" && !ades.length) f.ref = "";
    if (f.ref==="plano" && !ades.some(x=>x.a.id===f.adesaoId)) f.adesaoId = ades.length===1 ? ades[0].a.id : (ades.some(x=>x.a.id===f.adesaoId) ? f.adesaoId : "");
    const ref = REFS_RECEB.find(r => r.k===f.ref);
    const adSel = f.adesaoId ? adesao(f.adesaoId) : null;
    const planos = S.planos.filter(p => p.ativo!==false), ativos = S.team.filter(u => u.ativo);
    resto.innerHTML = `
      ${recentes.length ? `<div class="rcaviso"><b>Recebimentos deste paciente nos últimos 7 dias</b><span class="note" style="margin:0">Confira para não lançar o mesmo pagamento duas vezes.</span>${recentes.map(t=>linhaReceb(t, false)).join("")}</div>` : ""}
      ${sa ? alertaSaldoHtml(pid, null, true) : ""}
      <fieldset class="rcrefs"><legend>O que o paciente está pagando?</legend>
        ${REFS_RECEB.map(r => { const off = r.k==="plano" && !ades.length;
          return `<button type="button" class="rcref" data-ref="${r.k}" aria-pressed="${f.ref===r.k}" ${off ? "disabled" : ""}><b>${esc(r.t)}</b><span>${esc(off ? "Este paciente não tem programa em andamento." : r.d)}</span></button>`; }).join("")}
      </fieldset>
      ${!ref ? "" : `
      ${ref.k==="plano" ? `<label class="f" for="rcad">Qual programa?<select id="rcad"><option value="">Selecione</option>${ades.map(({a,s})=>`<option value="${esc(a.id)}" ${f.adesaoId===a.id?"selected":""}>${esc(a.plano)} · ${s.feitas.length} de ${s.total} ${esc(rotSessao(a.rotuloSessao, s.total))}${adm && s.saldo>0 ? " · saldo "+brl0(s.saldo) : ""}</option>`).join("")}</select>
        <small>${adSel ? (adSel.modo==="saldo" ? "O valor abate o saldo deste programa." : "Programa pago por sessão: o valor fica registrado neste programa.") : "O valor fica ligado ao programa e, se houver saldo, abate o saldo dele."}</small></label>` : ""}
      ${ref.k==="saldo" && adm ? `<p class="note" style="margin:0">Saldo em aberto fora de programa: <b>${brl((info.grupos[""]||{saldo:0}).saldo)}</b></p>` : ""}
      <div class="row2">
        <label class="f" for="rcv">Valor recebido (R$)<input id="rcv" type="text" inputmode="decimal" placeholder="Ex.: 450,00" value="${esc(f.valor||"")}"></label>
        <label class="f" for="rcf">Forma de pagamento<select id="rcf">${formaOptions(f.forma||"")}</select></label>
      </div>
      <div class="row2">
        <label class="f" for="rcd">Data do recebimento<input id="rcd" type="date" max="${today()}" value="${esc(f.data||today())}"></label>
        ${ref.aberto ? `<label class="f" for="rcab">Ficou valor em aberto? <small>(opcional · o que ainda falta pagar)</small><input id="rcab" type="text" inputmode="decimal" placeholder="Ex.: 1.200,00" value="${esc(f.aberto||"")}"></label>` : "<div></div>"}
      </div>
      ${ref.k==="novo" && planos.length ? `<div class="pacbox" style="gap:10px">
        <label class="chk" for="rcpl"><input id="rcpl" type="checkbox" ${f.prog?"checked":""}> ${f.doOrc ? "Programar as sessões do programa orçado <small>(já montado no orçamento: confira a data de início)</small>" : "É um programa de acompanhamento: montar agora (procedimentos e sessões)"}</label>
        <div id="rcplbox" ${f.prog?"":"hidden"}>${builderHtml("rcb", f.bld || (f.bld = {inicio: today(), itens:[itemDoProc(null)]}))}</div></div>` : ""}
      ${temUnidades() ? `<label class="f" for="rcuni" style="max-width:360px">Unidade<select id="rcuni">${unidadeOptions(f.uni ?? (adSel ? unidadeDaAdesao(adSel) : (pac(pid)||{}).unidadeId || ""), "Sem unidade")}</select></label>` : ""}
      ${S.campanhas.length ? `<label class="f" for="rccamp" style="max-width:420px">Campanha <small>(opcional)</small><select id="rccamp">${campOptions(f.campanhaId || (adSel ? adSel.campanhaId||"" : "") || (pid ? campanhaDoPaciente(pid) : ""), false)}</select>${!f.campanhaId && !(adSel && adSel.campanhaId) && pid && campanhaDoPaciente(pid) ? '<small class="muted">Sugerida porque a paciente está nessa campanha.</small>' : ""}</label>` : ""}
      <label class="f" for="rcobs2">Observação <small>(opcional)</small><input id="rcobs2" type="text" maxlength="200" placeholder="Ex.: parcela 2 de 4" value="${esc(f.obs||"")}"></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="submit" id="rcsalvar">Registrar recebimento</button>
        <button class="btn ghost" type="button" id="rcvolta">Cancelar</button></div>`}`;
    resto.querySelectorAll("[data-ref]").forEach(b => b.onclick = () => { guardar(); f.ref = b.dataset.ref; if (f.ref!=="plano") f.adesaoId = ""; f.uni = undefined; desenhar();
      const v = document.getElementById("rcv"); if (v && f.ref!=="plano") v.focus(); });
    const sad = document.getElementById("rcad"); if (sad) sad.onchange = () => { guardar(); f.adesaoId = sad.value; f.uni = undefined; desenhar(); };
    // fechamento de orçamento: o que não foi pago na entrada vira saldo em aberto
    const orcV = card ? Number(card.valorOrcamento)||0 : 0, iv = document.getElementById("rcv"), ia = document.getElementById("rcab");
    if (orcV > 0 && iv && ia){ const calc = () => { if (ia.dataset.mexeu==="1") return; const v = lerValor(iv.value); if (v===null || v==="") { ia.value = ""; return; } const resto = Math.max(0, Math.round((orcV - v)*100)/100); ia.value = resto > 0 ? resto.toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2}) : ""; };
      iv.addEventListener("input", calc); ia.addEventListener("input", () => { ia.dataset.mexeu = "1"; }); if (!f.aberto) calc(); }
    const cpl = document.getElementById("rcpl"); if (cpl) cpl.onchange = () => { f.prog = cpl.checked; document.getElementById("rcplbox").hidden = !cpl.checked; };
    if (f.bld && document.getElementById("rcbbld")) ligarBuilder("rcb", f.bld, null);
    const bv = document.getElementById("rcvolta"); if (bv) bv.onclick = () => { S.recForm = null; S.recPre = null; if (pre.voltarPaciente) abrirPaciente(pre.pacienteId); else if (pre.voltarAdesao) abrirAdesao(pre.adesaoId); else ir("hoje"); };
  };
  const pk = ligarPicker("rc", pre.pacienteId, (id, novo) => { if (id!==pid || !!novo!==pnovo){ guardar(); pid = id; pnovo = !!novo; desenhar(); } });
  pid = pre.pacienteId || ""; desenhar();
  document.getElementById("frc").addEventListener("submit", async e => {
    e.preventDefault();
    const ref = REFS_RECEB.find(r => r.k===f.ref);
    let pacienteId;
    try { pacienteId = await pk.resolver(); } catch(m){ toast(String(m)); return; }
    if (!pacienteId){ toast("Escolha o paciente."); return; }
    if (!ref){ toast("Escolha o que o paciente está pagando."); return; }
    if (ref.k==="plano" && !f.adesaoId){ toast("Escolha o programa."); return; }
    const v = lerValor(rcv.value);
    if (!(v > 0)){ toast("Informe o valor recebido."); rcv.focus(); return; }
    if (!rcf.value){ toast("Escolha a forma de pagamento."); rcf.focus(); return; }
    if (!rcd.value || rcd.value > today()){ toast("A data do recebimento precisa ser até hoje."); return; }
    const ab = ref.aberto ? lerValor(document.getElementById("rcab").value) : "";
    if (ab===null){ toast("Valor em aberto inválido. Use o formato 1.200,00."); return; }
    const ad = ref.k==="plano" ? adesao(f.adesaoId) : null;
    const uniEl = document.getElementById("rcuni"), campEl = document.getElementById("rccamp");
    const tarefa = {responsavelId:S.user.id, descricao: ref.k==="plano" && ad ? "Pagamento do programa " + ad.plano : ref.tipo, prazo: rcd.value, hora:"", prioridade:"normal",
      pacienteId, tipo: ref.tipo, valor: v, valorAberto: ab || "", formaPagamento: rcf.value, obs: document.getElementById("rcobs2").value.trim(), realizada:true,
      adesaoId: ad ? ad.id : "", campanhaId: campEl ? campEl.value : (ad ? ad.campanhaId||"" : ""),
      unidadeId: uniEl ? uniEl.value : (ad ? unidadeDaAdesao(ad) : (pac(pacienteId)||{}).unidadeId || "")};
    const bt = document.getElementById("rcsalvar"); bt.disabled = true; bt.textContent = "Registrando…";
    const cpl = document.getElementById("rcpl");
    if (ref.k==="novo" && cpl && cpl.checked){
      const bi = builderItens(f.bld);
      if (bi.erro){ bt.disabled = false; bt.textContent = "Registrar recebimento"; toast(bi.erro); return; }
      const ra = await api("criarAdesao", {adesao:{pacienteId, itens:bi.itens, hora:"", campanhaId:tarefa.campanhaId, unidadeId:tarefa.unidadeId}, orcamento:tarefa});
      if (!ra.ok){ bt.disabled = false; bt.textContent = "Registrar recebimento"; toast(ra.error); return; }
      receberAdesao(ra.data); S.recForm = null; S.recPre = null;
      if (card) await moverEtapa(card, "fechar", {valor: (Number(v)||0) + (Number(ab)||0), nota: "programa " + ra.data.adesao.plano});
      toast(`Recebimento registrado e ${plural(ra.data.tarefas.filter(ehSessao).length,"sessão programada","sessões programadas")}`); abrirAdesao(ra.data.adesao.id); return;
    }
    const r = await api("criarTarefa", {tarefa});
    if (!r.ok){ bt.disabled = false; bt.textContent = "Registrar recebimento"; toast(r.error); return; }
    S.tasks.push(r.data); S.recForm = null;
    if (card){ await moverEtapa(card, "fechar", {valor: (Number(v)||0) + (Number(ab)||0)}); S.recPre = null; toast("Orçamento fechado e recebimento registrado"); abrirPaciente(card.pacienteId); return; }
    toast("Recebimento de " + brl(v) + " registrado");
    if (pre.voltarPaciente) { S.recPre = null; abrirPaciente(pacienteId); }
    else if (pre.voltarAdesao) { S.recPre = null; abrirAdesao(pre.adesaoId); }
    else { S.recPre = {}; render(); }
  });
}

/* =========================================================
   ACOMPANHAMENTO DE PLANOS, SALDOS E RECEBIMENTOS
   ========================================================= */
const plano = id => S.planos.find(p => p.id===id);
const adesao = id => S.adesoes.find(a => a.id===id);
const ehSessao = t => t.tipo===TIPO_SESSAO && !!t.adesaoId;
const ehAtende = t => !!tipoInfo(t.tipo).atende;
const ehRecebimento = t => !!tipoInfo(t.tipo).recebimento;
const temSaldo = n => !!tipoInfo(n).saldo;
const sessaoNum = t => parseInt(String(t.sessao||"").split("/")[0], 10) || 0;
const rotuloIntervalo = d => d===7 ? "toda semana" : d===14 ? "a cada 15 dias" : d===30 || d===28 ? "todo mês" : `a cada ${d} dias`;
/* ---------- unidades ---------- */
const unidade = id => (S.unidades||[]).find(u => u.id===id);
const temUnidades = () => (S.unidades||[]).some(u => u.ativo!==false);
const nomeUnidade = id => (unidade(id)||{}).nome || "Sem unidade";
const unidadeDaTarefa = t => t.unidadeId || (pac(t.pacienteId)||{}).unidadeId || "";
const unidadeDaAdesao = a => a.unidadeId || (pac(a.pacienteId)||{}).unidadeId || "";
const passaUnidade = (u, f) => !f || (f==="__sem" ? !u : u===f);
function unidadeOptions(sel, rotuloVazio){
  return `<option value="">${esc(rotuloVazio)}</option>` + (S.unidades||[]).filter(u => u.ativo!==false || u.id===sel)
    .map(u => `<option value="${esc(u.id)}" ${sel===u.id?"selected":""}>${esc(u.nome)}</option>`).join("");
}
const unidadeFiltro = sel => `<option value="">Todas as unidades</option>` + (S.unidades||[]).map(u => `<option value="${esc(u.id)}" ${sel===u.id?"selected":""}>${esc(u.nome)}</option>`).join("")
  + `<option value="__sem" ${sel==="__sem"?"selected":""}>Sem unidade</option>`;
// desempenho por unidade no intervalo (pagamentos e adesões pela data; atrasos considerando hoje)
function statsUnidades(ini, fim){
  const h = today(), dentro = d => d>=ini && d<=fim;
  const ids = (S.unidades||[]).map(u => u.id);
  if (S.pacientes.some(p => !p.unidadeId) || S.tasks.some(t => t.pacienteId && !unidadeDaTarefa(t))) ids.push("");
  return ids.map(id => {
    const pacs = S.pacientes.filter(p => (p.unidadeId||"")===id);

    const sess = S.tasks.filter(t => ehSessao(t) && t.status!=="cancelada" && unidadeDaTarefa(t)===id && dentro(t.prazo) && t.prazo < h);
    const faltas = sess.filter(t => t.status==="aberta" || dia(t.concluidaEm) > t.prazo);
    const tarAtr = S.tasks.filter(t => !ehSessao(t) && t.pacienteId && t.status==="aberta" && t.prazo < h && unidadeDaTarefa(t)===id);
    return {id, nome: id ? nomeUnidade(id) : "Sem unidade", pacientes: pacs.length, faturamento: somaValor(pagos), nPagos: pagos.length,
      ltv: ltvs.length ? ltvs.reduce((a,x)=>a+x.ltv,0)/ltvs.length : 0, adesoes: novas.length, ativas: ativas.length,

  }).filter(x => x.id || x.pacientes || x.nPagos || x.adesoes || x.tarAtr);
}

function datasPlano(inicio, n, intervalo){ return [...Array(n)].map((_, i) => addDays(inicio, i*intervalo)); }
function sessoesDe(aid){
  return S.tasks.filter(t => t.adesaoId===aid && ehSessao(t)).sort((a,b) => sessaoNum(a)-sessaoNum(b) || a.prazo.localeCompare(b.prazo));
}
function saldoInfo(pid){
  // saldo em aberto por adesão ("" = saldo geral do paciente)
  const grupos = {};
  const g = k => grupos[k] || (grupos[k] = {aberto:0, abatido:0});
  S.tasks.forEach(t => {
    if (t.pacienteId!==pid || t.status!=="concluida") return;
    if (temNum(t.valorAberto) && Number(t.valorAberto) > 0) g(t.adesaoId||"").aberto += Number(t.valorAberto);
    if (ehRecebimento(t)) g(t.adesaoId||"").abatido += Number(t.valor)||0;
    else if (ehSessao(t)){ const a = adesao(t.adesaoId); if (a && a.modo==="saldo") g(t.adesaoId).abatido += Number(t.valor)||0; }
  });
  let total = 0;
  Object.values(grupos).forEach(x => { x.saldo = Math.max(0, Math.round((x.aberto - x.abatido)*100)/100); total += x.saldo; });
  return {grupos, total};
}
function statsAdesao(a){
  const h = today(), ss = sessoesDe(a.id);
  const validas = ss.filter(t => t.status!=="cancelada");
  const feitas = validas.filter(t => t.status==="concluida"), abertas = validas.filter(t => t.status==="aberta");
  const atrasadas = abertas.filter(t => t.prazo < h);
  const prox = abertas.slice().sort((x,y)=>x.prazo.localeCompare(y.prazo))[0] || null;
  const noPrazo = feitas.filter(t => dia(t.concluidaEm) <= t.prazo).length;
  const atraso = atrasadas.length ? diasEntre(atrasadas.map(t=>t.prazo).sort()[0], h) : 0;
  let sit;
  if (a.status==="cancelado") sit = {key:"encerrado", label:"Encerrado" + (a.motivo ? " · "+a.motivo : ""), cls:"p-mute"};
  else if (!abertas.length && feitas.length) sit = {key:"concluido", label:"Programa concluído", cls:"p-ok"};
  else if (atrasadas.length) sit = {key:"atrasado", label: atraso===1 ? "Sessão atrasada desde ontem" : `Sessão atrasada há ${atraso} dias`, cls:"p-bad"};
  else if (prox && prox.prazo===h) sit = {key:"hoje", label:"Sessão hoje", cls:"p-gold"};
  else sit = {key:"emdia", label:"Em dia", cls:"p-ok"};
  const total = a.status==="cancelado" ? (Number(a.sessoes) || ss.length) : (validas.length || Number(a.sessoes) || 0);
  const retorno = S.tasks.find(t => t.adesaoId===a.id && t.tipo===TIPO_RETORNO && t.status!=="cancelada") || null;
  const ultPag = S.tasks.filter(t => t.adesaoId===a.id && t.status==="concluida" && ehReceita(t) && Number(t.valor)>0).map(t => dia(t.concluidaEm)).sort().pop() || "";
  return {ss, validas, feitas, abertas, atrasadas, prox, noPrazo, atraso, sit, total, retorno, ultPag,
    pct: total ? Math.round(feitas.length/total*100) : 0,
    saldo: (saldoInfo(a.pacienteId).grupos[a.id] || {saldo:0}).saldo,
    recebido: somaValor(S.tasks.filter(t => t.adesaoId===a.id && t.status==="concluida" && ehReceita(t)))};
}

function ligarRecebimento(pid, aoTerminar){
  document.getElementById("rccanc").onclick = () => { S.recebendo = null; render(); };

}

/* =========================================================
   PROGRAMA MONTADO POR PACIENTE — itens (procedimento, sessões, intervalo, insumo e dose)
   Programas antigos (um procedimento só) viram um item "i1".
   ========================================================= */
function itensAdesao(a){
  if (!a) return [];
  if (Array.isArray(a.itens) && a.itens.length) return a.itens;
  return [{key:"i1", procId:a.planoId, nome:a.plano, rotuloSessao:a.rotuloSessao||"Sessão", sessoes:Number(a.sessoes)||0, intervaloDias:Number(a.intervaloDias)||7,
    responsavelId:a.responsavelId, inicio:a.inicio, depoisDe:"", insumoId:"", insumoQtd:"", dose:""}];
}
const itemDaSessao = t => { const a = adesao(t.adesaoId); return itensAdesao(a).find(i => i.key===(t.itemKey||"i1")) || itensAdesao(a)[0] || null; };
const fmtQtd = q => String(Math.round((Number(q)||0)*100)/100).replace(".",",");
// datas de cada item: na data de início, em data própria ou depois que outro item termina
function agendaItens(itens, inicio){
  const out = {};
  itens.forEach(it => {
    let ini = it.inicioModo==="data" && ehData(it.dataInicio||"") ? it.dataInicio : inicio;
    if (it.inicioModo==="depois" && out[it.depoisDe] && out[it.depoisDe].length) ini = addDays(out[it.depoisDe][out[it.depoisDe].length-1], Number(it.intervaloDias)||7);
    out[it.key] = (Number(it.sessoes) >= 1 && ehData(ini||"")) ? datasPlano(ini, Number(it.sessoes), Number(it.intervaloDias)||7) : [];
  });
  return out;
}
let seqItem = 0;
function itemDoProc(p){
  return {key:"n" + Date.now().toString(36) + (++seqItem), procId:p ? p.id : "", sessoes: p ? Number(p.sessoes)||1 : 4, intervaloDias: p ? Number(p.intervaloDias)||7 : 7,
    inicioModo:"inicio", depoisDe:"", dataInicio:"", insumoId: p ? p.insumoPadraoId||"" : "", insumoQtd: p && temNum(p.insumoPadraoQtd) ? p.insumoPadraoQtd : (p && p.insumoPadraoId ? 1 : ""),
    dose:"", responsavelId: p && p.responsavelId ? p.responsavelId : S.user.id, valor: p && Number(p.valor) > 0 ? p.valor : ""};
}
function builderResumo(st){
  const ag = agendaItens(st.itens, st.inicio), total = st.itens.reduce((s,i) => s + (Number(i.sessoes)||0), 0);
  const sug = st.itens.reduce((s,i) => s + (Number(i.sessoes)||0) * (Number(i.valor)||0), 0);
  const linhas = st.itens.map((it, k) => { const p = plano(it.procId), ds = ag[it.key] || [];
    return `<li><b>${k+1}. ${esc(p ? p.nome : "Escolha o procedimento")}</b>${it.dose ? " · " + esc(it.dose) : ""} — ${ds.length ? plural(ds.length,"sessão","sessões") + `, de ${brAno(ds[0])} a ${brAno(ds[ds.length-1])}` : "sem datas"}${it.insumoId && itemEst(it.insumoId) ? ` · baixa: ${usoItem(itemEst(it.insumoId)) ? fmtUso(it.insumoQtd, itemEst(it.insumoId)) + " (" + fmtQtd(it.insumoQtd) + " " + esc(itemEst(it.insumoId).medida||"un.") + ")" : fmtQtd(it.insumoQtd) + " " + esc(itemEst(it.insumoId).medida||"un.")} de ${esc(itemEst(it.insumoId).nome)} por sessão` : ""}</li>`; }).join("");
  return {html:`<div class="bldres"><b>${plural(total,"sessão programada","sessões programadas")}</b>${vVal() && sug ? ` · valor sugerido <b>${brl(sug)}</b>` : ""}<ul>${linhas}</ul></div>`, sug, total};
}
// resumo do que vem do cadastro (mostrado sem abrir o ajuste)
function resumoAjuste(it){
  const ii = it.insumoId && itemEst(it.insumoId), u = usoItem(ii);
  return [rotuloIntervalo(Number(it.intervaloDias)||7), ii ? (u ? fmtUso(it.insumoQtd, ii) : fmtQtd(it.insumoQtd) + " " + (ii.medida||"un.")) + " de " + ii.nome : "", it.dose && !(ii && u && it.dose===fmtUso(it.insumoQtd, ii)) ? it.dose : "", primeiro(it.responsavelId), vVal() && Number(it.valor) > 0 ? brl(it.valor) + "/sessão" : ""].filter(Boolean).join(" · ");
}

      return `<div class="blditem" data-bi="${k}">

        ${st.itens.length > 1 ? `<button class="link danger" type="button" data-bx="${k}">Remover</button>` : ""}</div>

        <label class="f">Começa<select data-bf="inicioModo"><option value="inicio" ${it.inicioModo==="inicio"?"selected":""}>Na data de início</option>${st.itens.slice(0,k).map((o,j) => `<option value="depois:${esc(o.key)}" ${it.inicioModo==="depois" && it.depoisDe===o.key?"selected":""}>Depois do item ${j+1}</option>`).join("")}<option value="data" ${it.inicioModo==="data"?"selected":""}>Em outra data</option></select></label>

      </div>

let bldRedesenhando = false;
function ligarBuilder(px, st, aoMudar){
  const box = document.getElementById(px + "bld"); if (!box) return;
  const redesenhar = () => { const cur = document.getElementById(px + "bld"); if (!cur || bldRedesenhando) return; bldRedesenhando = true;
    try { cur.outerHTML = builderHtml(px, st); } finally { bldRedesenhando = false; } ligarBuilder(px, st, aoMudar); if (aoMudar) aoMudar(); };
  document.getElementById(px + "ini").onchange = e => { st.inicio = e.target.value; redesenhar(); };
  box.querySelectorAll(".bldajuste").forEach(d => d.ontoggle = () => { st.abertos = st.abertos || {}; st.abertos[d.dataset.bk] = d.open; });
  box.querySelectorAll("[data-bi]").forEach(row => {
    const it = st.itens[Number(row.dataset.bi)];
    row.querySelectorAll("[data-bf]").forEach(el => el.onchange = () => {
      const f = el.dataset.bf, v = el.value;
      if (f==="procId"){ const p = plano(v), novo = itemDoProc(p); Object.assign(it, {procId:v, sessoes:novo.sessoes, intervaloDias:novo.intervaloDias, insumoId:novo.insumoId, insumoQtd:novo.insumoQtd, valor:novo.valor}); if (p && p.responsavelId) it.responsavelId = p.responsavelId; }
      else if (f==="inicioModo"){ if (v.startsWith("depois:")){ it.inicioModo = "depois"; it.depoisDe = v.slice(7); } else { it.inicioModo = v; it.depoisDe = ""; } }
      else if (f==="valor"){ const x = lerValor(v); it.valor = x===null ? it.valor : x; }
      else if (f==="insumoId"){ it.insumoId = v; if (v && !temNum(it.insumoQtd)) it.insumoQtd = 1; if (!v) it.insumoQtd = ""; }
      else if (f==="insumoQtdUso"){ const u = usoItem(itemEst(it.insumoId)); it.insumoQtd = v==="" ? "" : Math.round(Number(v)/(u ? u.f : 1)*10000)/10000; }
      else if (f==="sessoes" || f==="intervaloDias" || f==="insumoQtd") it[f] = v==="" ? "" : Number(v);
      else it[f] = v;
      redesenhar();
    });
  });
  box.querySelectorAll("[data-bx]").forEach(b => b.onclick = () => { const k = Number(b.dataset.bx), key = st.itens[k].key; st.itens.splice(k, 1);
    st.itens.forEach(i => { if (i.depoisDe===key){ i.inicioModo = "inicio"; i.depoisDe = ""; } }); redesenhar(); });
  document.getElementById(px + "badd").onclick = () => { st.itens.push(itemDoProc(null)); redesenhar(); };
}
// valida e devolve os itens para gravar (com a data de início já calculada)
function builderItens(st){
  if (!st.itens.length) return {erro:"Adicione pelo menos um procedimento."};
  if (!ehData(st.inicio||"")) return {erro:"Informe a data de início do programa."};
  const ag = agendaItens(st.itens, st.inicio), itens = [];
  for (const [k, it] of st.itens.entries()){
    const p = plano(it.procId); if (!p) return {erro:`Escolha o procedimento do item ${k+1}.`};
    if (!(Number.isInteger(Number(it.sessoes)) && it.sessoes >= 1 && it.sessoes <= 104)) return {erro:`Sessões do item ${k+1}: de 1 a 104.`};
    if (!(Number.isInteger(Number(it.intervaloDias)) && it.intervaloDias >= 1 && it.intervaloDias <= 365)) return {erro:`Intervalo do item ${k+1}: de 1 a 365 dias.`};
    if (it.inicioModo==="data" && !ehData(it.dataInicio||"")) return {erro:`Informe a data de início do item ${k+1}.`};
    if (it.insumoId && !(Number(it.insumoQtd) > 0)) return {erro:`Informe a quantidade do insumo por sessão no item ${k+1}.`};
    const ds = ag[it.key] || [];
    itens.push({key:"i" + (k+1), refKey:it.key, procId:p.id, nome:p.nome, rotuloSessao:p.rotuloSessao||"Sessão", sessoes:Number(it.sessoes), intervaloDias:Number(it.intervaloDias),
      inicio: ds[0], depoisDe: it.inicioModo==="depois" ? it.depoisDe : "", insumoId: it.insumoId||"", insumoQtd: it.insumoId ? Number(it.insumoQtd) : "",
      dose: String(it.dose||"").trim() || (it.insumoId && usoItem(itemEst(it.insumoId)) ? fmtUso(Number(it.insumoQtd), itemEst(it.insumoId)) : ""),
      responsavelId: it.responsavelId || S.user.id, valor: Number(it.valor) > 0 ? Number(it.valor) : ""});
  }
  const mapa = {}; itens.forEach(i => { mapa[i.refKey] = i.key; }); itens.forEach(i => { i.depoisDe = i.depoisDe ? mapa[i.depoisDe] || "" : ""; delete i.refKey; });
  return {itens};
}

function receberAdesao(d){
  const ia = S.adesoes.findIndex(x => x.id===d.adesao.id); if (ia>=0) S.adesoes[ia] = d.adesao; else S.adesoes.push(d.adesao);
  (d.tarefas||[]).forEach(t => { const i = S.tasks.findIndex(x=>x.id===t.id); if (i>=0) S.tasks[i] = t; else S.tasks.push(t); });
}

/* ---------- blocos do Painel ---------- */
function painelPlanosHtml(ini, fim){
  const dentro = s => s>=ini && s<=fim;
  const sess = S.tasks.filter(t => ehSessao(t) && t.status!=="cancelada" && dentro(t.prazo));
  const feitas = sess.filter(t => t.status==="concluida"), noPrazo = feitas.filter(t => dia(t.concluidaEm) <= t.prazo);

  const porPlano = S.planos.map(p => { const s2 = sess.filter(t => (adesao(t.adesaoId)||{}).planoId===p.id);

// Top 10 pagantes: soma dos pagamentos por paciente (no período do Painel ou desde o início)
function top10Html(ini, fim, rot){
  const tudo = S.topModo==="tudo", por = {};

    if (!t.pacienteId || t.status!=="concluida" || !ehReceita(t)) return;

];
const catInfo = n => CATEGORIAS_DESP.find(c => c[0]===n) || CATEGORIAS_DESP[CATEGORIAS_DESP.length-1];
const fin = () => S.fin || (S.fin = {contas:[], caixas:[], metas:{}, cobrancas:[], config:{}});
const mesDe = d => String(d||"").slice(0,7);
const rotMes = m => { const [y, mm] = m.split("-"); return MES[Number(mm)-1] + " de " + y; };
const addMesStr = (m, n) => addMeses(m + "-01", n).slice(0,7);

const contaVencida = c => !c.pagoEm && c.vencimento < today();
const respCaixa = () => fin().config.caixaResp || (S.team.find(u => u.ativo && /recep/i.test(u.funcao||"")) || {}).id || "";

function finDemoSaida(db, me){
  const o = finSaida(db.financeiro, me), m = today().slice(0,7), meta = Number((db.financeiro.metas||{})[m])||0;
  if (!me.valores && meta){ const v = db.tasks.filter(t => t.status==="concluida" && t.pacienteId && dia(t.concluidaEm).slice(0,7)===m && Number(t.valor) > 0 && (ehPagamento(t.tipo) || aceitaPagamento(t.tipo))).reduce((s,t) => s + Number(t.valor), 0); o.metaPct = Math.round(v/meta*100); }
  return o;
}
function finSaida(f, me){
  const o = JSON.parse(JSON.stringify(f || {contas:[], caixas:[], metas:{}, cobrancas:[], config:{}}));
  if (!me.admin){ o.contas = o.contas.filter(c => c.responsavelId===me.id); o.metas = {}; o.caixas = o.caixas.filter(c => c.por===me.id || c.data===today()); }
  delete o.seq; return o;
}
function receberFin(d){
  const f = fin();
  (d.contas||[]).forEach(c => { const i = f.contas.findIndex(x => x.id===c.id); if (i>=0) f.contas[i] = c; else f.contas.push(c); });
  (d.removidas||[]).forEach(id => { f.contas = f.contas.filter(c => c.id!==id); });
  (d.caixas||[]).forEach(c => { const i = f.caixas.findIndex(x => x.id===c.id); if (i>=0) f.caixas[i] = c; else f.caixas.push(c); });
  (d.cobrancas||[]).forEach(c => { if (!f.cobrancas.some(x => x.id===c.id)) f.cobrancas.push(c); });
  if (d.metas) f.metas = Object.assign(f.metas||{}, d.metas);
  if (d.config) f.config = Object.assign(f.config||{}, d.config);
}

  const pag = pagasM(m), pagV = pag.reduce((s,c) => s + Number(c.valorPago||c.valor), 0), pagAnt = pagasM(ant).reduce((s,c) => s + Number(c.valorPago||c.valor), 0);

      <label class="f" for="fmeta" style="max-width:260px">Meta de faturamento do mês (R$)<input id="fmeta" type="text" inputmode="decimal" value="${meta ? meta.toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2}) : ""}" placeholder="Ex.: 120.000,00"></label></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${temRotina ? '<span class="pill p-ok" style="align-self:center">Rotina mensal de fechamento ativa</span>' : '<button class="btn ghost" type="button" id="fmrot">Criar rotina mensal de fechamento</button>'}<button class="btn ghost" type="button" id="fmprint">Imprimir</button></div>
    <div class="kpis">
      <div class="kpi hero"><span>Recebido no mês</span><b class="num">${brl0(recV)}</b><span style="color:inherit;opacity:.85">${rec.length} recebimentos ${delta(recV, recAnt)}</span></div>
      <div class="kpi"><span>Despesas pagas</span><b class="num">${brl0(pagV)}</b><span>${plural(pag.length,"conta","contas")} ${delta(pagV, pagAnt, true)}</span></div>
      <div class="kpi"><span>Resultado do mês</span><b class="num" style="color:${res < 0 ? "var(--bad)" : "var(--ok)"}">${brl0(res)}</b><span>${recV ? Math.round(res/recV*100) + "% do recebido" : "recebido − despesas pagas"}</span></div>

function permsDoPerfil(perfis, perfilId){ const p = (perfis||[]).find(x => x.id===perfilId); return p ? p.perms : []; }
// regra única usada pela tela e pelo servidor
function temPerm(user, perfis, k){
  if (!user) return false; if (user.admin) return true;
  const ps = permsDoPerfil(perfis, user.perfilId), info = permInfo(k);
  if (info && info[4] && !ps.includes(info[4])) return false;
  return ps.includes(k);
}

function ligarPerfis(root){
  const box = root.querySelector("#pfbox"); if (!box) return; const ed = S.perfisEd;
  const mudou = () => { ed.mudou = true; render(); };
  box.querySelectorAll("[data-pil]").forEach(b => b.onclick = () => { ed.pilar = b.dataset.pil; render(); });
  box.querySelectorAll("[data-pf]").forEach(c => c.onchange = () => { const p = ed.perfis[Number(c.dataset.pf)], k = c.dataset.pk;
    if (c.checked){ if (!p.perms.includes(k)) p.perms.push(k); const req = permInfo(k)[4]; if (req && !p.perms.includes(req)){ p.perms.push(req); toast("“" + permInfo(req)[2] + "” também foi marcado: é necessário para esta opção."); } }
    else { p.perms = p.perms.filter(x => x!==k); PERMS.filter(x => x[4]===k && p.perms.includes(x[1])).forEach(x => { p.perms = p.perms.filter(y => y!==x[1]); toast("“" + x[2] + "” foi desmarcado: depende desta opção."); }); }
    mudou(); });
  box.querySelectorAll("[data-pfn]").forEach(i => i.onchange = () => { ed.perfis[Number(i.dataset.pfn)].nome = i.value.trim() || "Perfil"; mudou(); });
  box.querySelector("#pfnovo").onclick = () => { ed.perfis.push({id:"pf_" + Date.now().toString(36), nome:"Novo perfil", perms:[]}); mudou(); };
  const dup = box.querySelector("#pfdup"); if (dup) dup.onchange = () => { const v = dup.value, i = Number(v.slice(1)); if (!v) return;
    if (v[0]==="d") ed.perfis.push({id:"pf_" + Date.now().toString(36), nome:ed.perfis[i].nome + " (cópia)", perms: ed.perfis[i].perms.slice()}); else ed.perfis.splice(i, 1); mudou(); };
  box.querySelector("#pfsalvar").onclick = async () => {
    const r = await api("salvarPerfis", {perfis: ed.perfis}); if (!r.ok){ toast(r.error); return; }
    S.perfis = r.data.perfis; S.perfisEd = null; toast("Perfis salvos · valem a partir do próximo acesso de cada pessoa"); render(); };
}

  {t:"Atendimentos e pagamentos", q:"O paciente pagou só uma parte. Como registro?", a:"No Recebimento, informe o valor pago agora e o restante em “Ficou valor em aberto?”. Quando o paciente pagar o restante, use Recebimento › Saldo em aberto (ou Programa em andamento, se for de um programa): o valor abate o saldo.", k:"parcial parte entrada saldo aberto devendo restante parcela"},
  {t:"Atendimentos e pagamentos", q:"Quais formas de pagamento existem?", a:"Pix, Dinheiro, Cartão de crédito, Cartão de débito e Nota promissória. O Painel mostra quanto entrou por cada forma.", k:"forma pagamento pix dinheiro cartao credito debito nota promissoria"},
  {t:"Atendimentos e pagamentos", adm:true, q:"Onde vejo quem está devendo?", a:"Nos programas: em Programas, toque em “Ver quem deve” no cartão “Saldo a receber nos programas”. Para todos os saldos (orçamentos, procedimentos e programas): no Painel, bloco “Valores em aberto”. O saldo também aparece como alerta na próxima sessão do paciente.", k:"devendo divida saldo aberto receber inadimplente quem deve"},

  {t:"Programas de acompanhamento", q:"Como coloco um paciente em um programa?", a:"Em Programas › Nova adesão: escolha o paciente e a data de início e monte o programa item por item, com o procedimento, o número de sessões, o intervalo, a dose e quando cada item começa (ex.: Tirzepatida 2,5 mg por 4 semanas e depois 5 mg por mais 4). Depois informe o valor total e o pago na adesão. As sessões são criadas automaticamente.", k:"programa adesao aderir sessoes pacote acompanhamento montar itens dose"},
  {t:"Programas de acompanhamento", q:"A sessão dá baixa no estoque?", a:"Sim. Ao concluir a sessão, sai do estoque o insumo do item na quantidade definida na montagem (a dose) e os descartáveis cadastrados no procedimento. Se a sessão for reaberta, a baixa é desfeita. Na análise do estoque, a diferença entre o saldo esperado e a contagem final mostra o que saiu sem registro.", k:"baixa estoque sessao dose insumo consumo automatico perda"},
  {t:"Programas de acompanhamento", q:"Como concluo uma sessão do programa?", a:"Toque no círculo da sessão. Informe a data em que foi realizada e escolha se as próximas sessões seguem a partir dessa data ou mantêm as datas originais. Se houve pagamento, preencha “Houve pagamento?”.", k:"sessao concluir programa reprogramar datas dose aplicacao"},
  {t:"Programas de acompanhamento", q:"O que acontece quando o programa termina?", a:"Ao concluir a última sessão, se o procedimento tiver frequência de retorno cadastrada, a ferramenta cria sozinha uma tarefa de contato para o retorno, com a antecedência definida no cadastro.", k:"fim programa termino retorno lembrete repetir procedimento"},
  {t:"Programas de acompanhamento", adm:true, q:"Como encerro ou cancelo um programa?", a:"Abra a adesão em Programas e use “Encerrar programa” (disponível para o administrativo). As sessões ainda abertas são canceladas e o histórico fica guardado.", k:"encerrar cancelar programa desistiu parar"},
  // Campanhas e relacionamento
  {t:"Campanhas e relacionamento", adm:true, q:"Como crio uma campanha?", a:"Em Campanhas › Nova campanha: dê um nome, o objetivo e o roteiro. Depois crie tarefas nela ou importe uma lista de pacientes.", k:"campanha criar recaptacao acao marketing"},
  {t:"Campanhas e relacionamento", adm:true, q:"Como importo uma lista de pacientes para a campanha?", a:"Dentro da campanha, use “Importar lista de pacientes” e “Baixar planilha modelo”. Preencha a planilha (há uma coluna de Observação), escolha o arquivo e toque em “Ler lista”. Uma tarefa é criada para cada paciente.", k:"importar lista planilha excel modelo campanha observacao"},
  {t:"Campanhas e relacionamento", q:"Onde vejo os aniversariantes?", a:"Os do dia aparecem na tela Hoje. Os do mês ficam em Pacientes › Aniversariantes, com atalho para criar a tarefa de contato.", k:"aniversario aniversariante parabens nascimento"},

  {t:"Rotina e tarefas", q:"Como faço a contagem de estoque?", a:"A contagem chega como tarefa (ex.: “Contagem · Alta rotatividade”). Toque no círculo ou em “Abrir contagem”, conte o que está fisicamente no estoque e informe as quantidades (nos itens com validade, quantas vencem em cada mês). Dá para imprimir a lista e contar no papel. Ao concluir, a ferramenta calcula o consumo desde a contagem anterior.", k:"estoque contagem inventario contar itens validade imprimir lista"},
  {t:"Rotina e tarefas", q:"Chegou uma compra. Como lanço no estoque?", a:"Em Processos › Estoque › Entrada pela nota: com a nota em mãos, informe o fornecedor e uma linha por item (quantidade na unidade do estoque, validade e custo). Para um item só, use Registrar entrada. A entrada soma ao estoque até a próxima contagem.", k:"estoque entrada compra chegou material nota fornecedor"},
  {t:"Rotina e tarefas", q:"Como registro o produto usado em um paciente?", a:"Pela ficha do paciente, em Produtos utilizados › Registrar uso de produto, ou pelo estoque, em Registrar saída › Uso em paciente. Informe o produto, a dose (ex.: 2,5 mg ou 20 UI), o procedimento e o lote. Sessões de programa e procedimentos com insumo registram sozinhos.", k:"produto paciente uso dose saida estoque lote aplicacao botox toxina"},
  {t:"Gestão", adm:true, q:"Como a ferramenta converte caixa, ampola e mg?", a:"No cadastro do item, em Unidades de medida: unidade de estoque (ampola), de compra (caixa, com quantas ampolas vêm em cada) e de uso (mg, com quanto tem em cada ampola). A entrada pode ser em caixas, a contagem em ampolas e a dose em mg.", k:"unidade medida conversao caixa ampola mg ui ml frasco"},
  {t:"Gestão", adm:true, q:"Quantas ampolas usei no mês passado?", a:"Em Processos › Estoque, toque no item: “Consumo por mês” mostra os últimos meses. Na aba Análise, escolha o período (ex.: mês passado) e veja, por item, contagem inicial, entradas, saídas registradas, saldo esperado, contagem final e a diferença.", k:"consumo estoque ampolas mes passado quanto usei tirzepatida gasto"},
  {t:"Gestão", adm:true, q:"Como funciona a gestão de pessoas?", a:"Em Pessoas › Equipe, cada pessoa da clínica tem uma ficha (cargo, contrato, admissão, documentos, férias). A Visão geral mostra os alertas: férias para programar, fim da experiência, documentos vencendo e banco de horas acima do limite, com botão para gerar tarefa. Nas abas, ficam as metas do mês, as conversas 1:1 e o banco de horas.", k:"pessoas equipe ficha ferias experiencia documentos aso coren banco de horas rh colaboradora"},
  {t:"Gestão", adm:true, q:"Como registro a conversa 1:1?", a:"Em Pessoas › Conversas 1:1 › Registrar conversa: escolha a pessoa, veja as metas do mês dela e anote pontos fortes, pontos a desenvolver e combinados. Cada combinado pode virar uma tarefa para a pessoa. Também dá para criar a rotina mensal de conversas.", k:"conversa 1:1 feedback acompanhamento combinados reuniao individual"},

const semAcento = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function vAjuda(main){
  const adm = S.user.admin || pode("painel") || pode("config");
  const base = AJUDA.filter(x => adm || !x.adm);
  const temas = [...new Set(base.map(x=>x.t))];
  S.ajTema = S.ajTema || "";
  main.innerHTML = `
    <div class="eyebrow">Ajuda</div>
    <h1 style="margin-bottom:6px">Como podemos ajudar?</h1>
    <p class="note" style="margin-top:0">Digite sua dúvida com suas palavras, por exemplo: “pagamento parcial”, “trocar PIN”, “quem está devendo”.</p>
    <div class="ajbusca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="ajq" type="search" placeholder="Buscar na ajuda" aria-label="Buscar na ajuda" value="${esc(S.ajQ||"")}" autocomplete="off"></div>
    <div class="seg ajtemas" role="group" aria-label="Temas"><button type="button" data-ajt="" aria-pressed="${!S.ajTema}">Todos</button>${temas.map(t=>`<button type="button" data-ajt="${esc(t)}" aria-pressed="${S.ajTema===t}">${esc(t)}</button>`).join("")}</div>
    <div id="ajres"></div>
    <div class="card ajfim"><b>Não encontrou o que procurava?</b><span>Consulte o <button class="link" type="button" id="ajman">manual completo</button>, que explica cada tela passo a passo, ou fale com o administrativo da clínica ou com a consultoria Firmare.</span></div>`;
  const q = document.getElementById("ajq"), res = document.getElementById("ajres");
  const desenhar = () => {
    const termos = semAcento(q.value).split(/\s+/).filter(w=>w.length>1);
    let lista = base.filter(x => !S.ajTema || termos.length || x.t===S.ajTema);
    if (termos.length){
      lista = lista.map(x => { const tq = semAcento(x.q), tk = semAcento(x.k+" "+x.t), ta = semAcento(x.a);
          let sc = 0; for (const w of termos){ if (tq.includes(w)) sc+=3; else if (tk.includes(w)) sc+=2; else if (ta.includes(w)) sc+=1; else return null; } return [sc,x]; })
        .filter(Boolean).sort((a,b)=>b[0]-a[0]).map(r=>r[1]);
    }
    const grupos = termos.length ? [["Resultados", lista]] : temas.filter(t=>!S.ajTema||t===S.ajTema).map(t=>[t, lista.filter(x=>x.t===t)]);
    res.innerHTML = lista.length ? grupos.map(([t, its]) => `<div class="group"><h3>${esc(t)} <span class="n">${its.length}</span></h3>
        <div class="ajlista">${its.map(x=>`<details class="ajitem"${termos.length && its.length<=3 ? " open" : ""}><summary>${esc(x.q)}</summary><p>${esc(x.a)}</p></details>`).join("")}</div></div>`).join("")
      : `<div class="empty">Nada encontrado para “${esc(q.value)}”. Tente outra palavra, como “pagamento”, “programa” ou “paciente”.</div>`;
  };
  document.getElementById("ajman").onclick = () => { S.manQ = q.value; ir("manual"); };
  q.oninput = () => { S.ajQ = q.value; desenhar(); };
  main.querySelectorAll("[data-ajt]").forEach(b => b.onclick = () => { S.ajTema = b.dataset.ajt; S.ajQ = ""; vAjuda(main); });
  desenhar();
}

Cada movimento fica em **“Evolução”**, no próprio cartão: etapa, data, quem fez e observação.`},
  {t:"Tela Jornada do paciente", txt:`Em **Comercial › Jornada do paciente**, com filtro de **período**, pessoa e unidade:
- **Funil:** agendados, confirmados, realizados, orçamentos enviados e fechados, com a conversão entre as etapas.
- Para o administrativo, cada etapa mostra também o **valor**: realizados (recebido no atendimento), orçamentos enviados (valor orçado), fechados (valor fechado) e perdidos (valor dos orçamentos perdidos).
- **No-show** (quantidade e taxa), desmarcados e orçamentos perdidos.
- **Onde estão os pacientes agora:** colunas com os cartões de cada etapa. Toque no nome para abrir a ficha.

Os números contam os movimentos registrados no período escolhido.`},
  {t:"Cancelar e excluir", txt:`- **Cancelar:** a tarefa não vai mais acontecer. Fica no histórico como cancelada. Pode ser feito por quem solicitou ou pelo administrativo.
- **Excluir** (dentro de Editar): apaga o registro, só para lançamentos feitos por engano. Em tarefas recorrentes, é possível excluir só esta ou esta e as próximas.`},
  {t:"Tela Tarefas: buscar e filtrar", txt:`Na tela Tarefas, combine os filtros:
- **Solicitante** e **Responsável por executar**.
- **Situação** (abertas, concluídas, canceladas…) e **Período**, ambos em lista suspensa.
- **Buscar:** paciente, descrição ou resultado.
- **Tipo**, **Campanha** e **Unidade**.

O período considera a data de realização das concluídas e o prazo das demais.`}
 ]},
 {id:"m5", cap:"5. Tipos de contato", secs:[
  {t:"Agenda", txt:`- **Consulta agendada:** consulta marcada. Ao concluir, vira **Consulta realizada** na mesma tarefa, com o pagamento, se houver.
- **Procedimento agendado:** procedimento marcado. Ao concluir, vira **Procedimento realizado**.
- **Reagendamento:** consulta, procedimento ou sessão remarcados.
- **Confirmação:** confirmação de presença.`},
  {t:"Atendimento", txt:`Contam como paciente atendido.
- **Consulta realizada** e **Procedimento realizado:** o pagamento recebido no atendimento fica registrado na própria tarefa.
- **Sessão de plano:** criada automaticamente pelo programa de acompanhamento.`},
  {t:"Orçamento", txt:`- **Orçamento enviado:** proposta apresentada ao paciente. O valor do orçamento **não** entra na receita; serve para medir a conversão (enviados × pagos).`},
  {t:"Pagamentos", txt:`Só os pagamentos entram na receita e no LTV.
- **Sinal de consulta:** valor adiantado para reservar a consulta.
- **Pagamento de consulta:** valor pago pela consulta.
- **Pagamento de orçamento:** orçamento fechado; valor pago agora (total ou entrada).
- **Pagamento de saldo em aberto:** parcela ou restante de um valor em aberto. Abate o saldo do paciente.`},
  {t:"Relacionamento", txt:`- **Follow-up:** retomar conversa em andamento (ex.: orçamento sem resposta).
- **Recaptação:** paciente sem retorno há algum tempo.
- **Retorno de procedimento:** paciente que já pode repetir um procedimento (criado automaticamente pelo catálogo).
- **Contato de indicação:** com o paciente indicado ou com quem indicou.
- **Aniversário:** mensagem de aniversário.
- **Pós-consulta:** acompanhamento depois da consulta ou procedimento.
- **Outros:** qualquer outro contato.`}
 ]},
 {id:"m6", cap:"6. Atendimentos e pagamentos", secs:[
  {t:"Consulta agendada que aconteceu", txt:`Conclua a própria tarefa “Consulta agendada”. Ela passa a ser **Consulta realizada** automaticamente. Se houve pagamento, preencha o bloco **“Houve pagamento?”** na mesma tela: valor pago, forma de pagamento e, se faltar algo, valor em aberto.

Não é preciso criar outra tarefa. O mesmo vale para Procedimento agendado.`},
  {t:"Registrar um recebimento", txt:`Todo dinheiro recebido entra por **Financeiro › Recebimentos**. Atendimento é tarefa; dinheiro é recebimento.
- Escolha o **paciente**.
- Diga **o que ele está pagando**: Consulta, Sinal de consulta, Procedimento ou programa novo (venda), Programa em andamento ou Saldo em aberto.
- Informe o **valor recebido**, a **forma de pagamento** (Pix, Dinheiro, Cartão de crédito, Cartão de débito ou Nota promissória) e a data.
- Se ficou uma parte para depois, informe em **“Ficou valor em aberto?”**.

O formulário mostra os recebimentos do paciente nos últimos 7 dias, para evitar lançar o mesmo pagamento duas vezes. Embaixo, a lista **Recebimentos de hoje** ajuda a conferir o caixa do dia.`},
  {t:"Consulta ou recebimento da consulta?", txt:`São duas coisas diferentes:
- A **consulta** é o atendimento: conclua a tarefa da consulta.
- O **dinheiro** é o recebimento. Se o paciente pagou na hora, responda **“Recebeu algum valor?”** ao concluir a consulta. Pronto: não lance de novo.
- Se pagou em outro momento (sinal antes, ou restante depois), use **Recebimento › Consulta** ou **Sinal de consulta**.`},
  {t:"Programa em andamento × programa novo", txt:`- **Programa novo:** o paciente acabou de fechar (venda). Use Recebimento › Procedimento ou programa novo; dá para programar as sessões do catálogo na mesma tela.
- **Programa em andamento:** o paciente já faz o programa e está pagando uma parcela ou uma sessão. Use Recebimento › Programa em andamento e escolha o programa. O valor abate o saldo dele.

Nunca registre como “programa novo” o pagamento de um programa que já está rodando: isso conta uma venda que não aconteceu.`},
  {t:"Pagamento parcial e saldo em aberto", txt:`Exemplo: orçamento de R$ 3.000, paciente pagou R$ 1.000 de entrada.
- Lance um **Pagamento de orçamento** com valor pago R$ 1.000 e valor em aberto R$ 2.000.
- A cada parcela, lance um **Pagamento de saldo em aberto** com o valor recebido. O saldo do paciente diminui automaticamente.

Também é possível usar **“Registrar recebimento”** na ficha do paciente, escolhendo de qual saldo abater.`},
  {t:"Orçamento com programa ou procedimento do catálogo", txt:`O caminho mais simples é montar o programa **no orçamento** (cartão da jornada › Registrar orçamento › “É um programa”): escolha o procedimento e o número de sessões; intervalo, dose, responsável e valor já vêm do cadastro e ficam em “Ajustar”. No **Fechou**, o programa já vem montado e o saldo é calculado sozinho.

Sem orçamento registrado, monte no Recebimento › Procedimento ou programa novo, marcando **“É um programa de acompanhamento: montar agora”**.`},
  {t:"O que conta como receita", txt:`Entram na receita e no LTV:
- Os quatro tipos do grupo Pagamentos.
- O pagamento registrado ao concluir Consulta realizada, Procedimento realizado ou Sessão de plano.

**Não** entram: valor de Orçamento enviado e valor em aberto (só conta quando for pago).`}
 ]},
 {id:"m7", cap:"7. Pacientes e relacionamento", secs:[
  {t:"Cadastrar paciente", txt:`Em **Pacientes › Novo paciente**, ou direto ao criar uma tarefa vinculada a paciente. Informe:
- Nome e telefone (para o botão de WhatsApp).
- Data de nascimento (para o lembrete de aniversário).
- **Data da última consulta** (opcional): para pacientes que já eram atendidos antes da ferramenta.
- **Origem:** Indicação, Instagram, WhatsApp, Google, Site, Convênio, Fachada, Evento ou Outro. Em Indicação, é possível registrar quem indicou.
- **Unidade principal**, quando a clínica tem mais de um local.`},
  {t:"Importar a lista de pacientes", adm:true, txt:`Para cadastrar toda a base de uma vez, use **Pacientes › Importar pacientes**:
- Toque em **“Baixar planilha modelo”** e preencha uma linha por paciente: **Nome completo** (obrigatório), **Telefone**, **Data de nascimento** e **Data da última consulta** (datas em dd/mm/aaaa).
- Se a clínica tem unidades, escolha a unidade principal dos pacientes da lista.
- Escolha o arquivo (.xlsx, .xls ou .csv), ou cole as linhas, e toque em **“Ler lista”**.
- Confira a prévia: pacientes novos, já cadastrados que terão dados completados, linhas com erro e repetidas. Toque em **Importar**.

Paciente já cadastrado (mesmo nome ou mesmo telefone) **não é duplicado**: a ferramenta só completa o que estiver vazio e atualiza a última consulta quando a da lista for mais recente. Nada que já existe é apagado. Limite de 2.000 pacientes por importação.`},
  {t:"Tela de relacionamento", txt:`A tela Pacientes mostra os indicadores de relacionamento com filtro de **período**: pacientes cadastrados, atendidos, pacientes por origem e, para o administrativo, receita e LTV médio.

Na lista, é possível buscar por nome ou telefone, ordenar, filtrar por origem e usar os atalhos **Todos**, **Aniversariantes do mês**, **Com tarefa em aberto** e **Sem retorno há 6+ meses** (último atendimento ou última consulta há mais de seis meses, do mais antigo para o mais recente; bom ponto de partida para campanhas de recaptação).`},
  {t:"Ficha do paciente", txt:`Reúne todo o histórico: consultas, procedimentos, contatos, orçamentos, programas e pagamentos, com filtro de período, e mostra a **última consulta** (a mais recente registrada na ferramenta ou informada no cadastro).

Para o administrativo, mostra também:
- **LTV:** total já pago à clínica, com número de pagamentos e ticket médio.
- **Saldo em aberto:** quanto o paciente ainda deve.

Atalhos da ficha: Editar cadastro, Registrar recebimento e Adesão a programa.

**Produtos utilizados:** tudo o que saiu do estoque para o paciente, com data, produto, dose, procedimento, lote e quem aplicou. Entram sozinhas as baixas das sessões e dos procedimentos com insumo; para lançar um uso avulso, toque em **Registrar uso de produto** (o paciente já vem escolhido). O mesmo lançamento pode ser feito pelo estoque, em Registrar saída › Uso em paciente.`},
  {t:"Excluir paciente", txt:`Só o administrativo exclui pacientes. A exclusão apaga também as tarefas vinculadas, por isso pede confirmação. Use apenas para cadastros feitos por engano.`}
 ]},
 {id:"m8", cap:"8. Programas de acompanhamento", secs:[
  {t:"Como funcionam", txt:`O programa é **montado para cada paciente**, como um pedido: escolha os procedimentos do catálogo e, em cada um, o número de sessões, o intervalo e a dose. Exemplo:
- Tirzepatida, 4 sessões a cada 7 dias, 2,5 mg.
- Tirzepatida, 4 sessões a cada 7 dias, 5 mg, **começando depois do item 1**.
- Drenagem linfática, 3 sessões a cada 30 dias, na data de início.

Procedimentos de sessão única (ex.: toxina botulínica) também entram como programa de 1 sessão, para gerar o contato de retorno. Programas antigos continuam funcionando como programa de um item só.`},
  {t:"Catálogo de procedimentos", adm:true, txt:`Em **Configurações › Procedimentos**, cadastre cada procedimento com:
- **Sessões sugeridas** e **intervalo sugerido** (podem ser mudados na montagem de cada programa).
- **Valor de referência por sessão** (só o administrativo vê): soma o valor sugerido do programa.
- **Baixa no estoque por sessão:** o insumo principal com a quantidade padrão (ex.: 1 ampola) e os **descartáveis** usados em toda sessão (ex.: 1 seringa e 1 agulha).
- Frequência para repetir e antecedência do contato de retorno.`},
  {t:"Nova adesão", txt:`Em **Programas › Nova adesão** (ou na ficha do paciente, “Adesão a programa”), escolha o paciente e a **data de início** e monte os itens:
- **Procedimento**, **sessões**, **a cada (dias)** e quando **começa**: na data de início, depois de outro item ou em outra data.
- **Responsável** e **valor por sessão** (opcional).
- **Insumo do estoque** e **dose por sessão**: já vêm do cadastro do procedimento e podem ser ajustados para a dose daquele paciente. Nos itens com unidade de uso, a dose é informada nela (ex.: 2,5 mg) e a ferramenta converte (0,5 ampola).
- **Dose / observação:** texto livre que aparece em cada sessão (ex.: 2,5 mg).

“+ Adicionar procedimento” inclui mais itens. O resumo mostra as datas de cada item e o valor sugerido. Depois informe o **valor total do programa**, o **pago na adesão** e a forma de pagamento. Se o valor total for maior que o pago, a diferença vira **saldo a receber** do programa, abatido a cada pagamento.

O mesmo montador aparece no **Recebimento › Procedimento ou programa novo**, ao marcar “É um programa de acompanhamento”.`},
  {t:"Baixa automática no estoque", txt:`Ao concluir uma sessão, a ferramenta **dá baixa sozinha** no estoque: o insumo do item na quantidade definida (a dose) e os descartáveis do procedimento. Se a sessão for reaberta ou o programa excluído, a baixa é desfeita.

Nas tarefas avulsas de **Procedimento realizado**, escolha “Qual procedimento?” para dar baixa dos insumos padrão daquele procedimento.

Cada baixa fica ligada ao paciente, com a dose e o lote, em **Produtos utilizados** na ficha. Na análise do estoque, o saldo esperado (contagem inicial + entradas − saídas registradas) é comparado com a contagem final: a diferença mostra o que saiu sem registro (desperdício, sessão não lançada ou desvio).`},
  {t:"Concluir uma sessão", txt:`Toque no círculo da sessão e informe a **data de realização**. Se a sessão aconteceu em outra data, escolha:
- **Reprogramar a partir da data de realização:** as próximas sessões daquele item seguem o intervalo a partir dessa data. Os itens que começam depois dele também são empurrados, se ainda não começaram.
- **Manter as datas originais.**

Se houve pagamento, preencha **“Houve pagamento?”**. Quando o programa tem saldo, o valor recebido abate o saldo.`},
  {t:"Contatos dentro do programa", txt:`Na página do programa, “Nova tarefa do programa” oferece só os tipos que fazem sentido ali: Sessão de plano, Pagamento de saldo em aberto, Reagendamento, Contato de indicação e Pós-consulta.

Se o paciente tem saldo em aberto, a **próxima sessão mostra um alerta** com o valor, para lembrar a cobrança no atendimento.`},
  {t:"Tela Programas", txt:`- Indicadores: pacientes em programa, sessões hoje, sessões atrasadas e (administrativo) saldo a receber, com “Ver quem deve”.
- **Sessões atrasadas:** ficam até serem realizadas. Paciente com sessão atrasada é risco de abandono.
- Hoje, Realizadas hoje e Próximos 7 dias.
- **Contatos de retorno · até 30 dias:** pacientes que já podem repetir o procedimento.
- Lista de pacientes em programa com busca, filtro por programa, por unidade e por situação (em andamento, com atraso, com saldo a receber, concluídos, encerrados).`},
  {t:"Fim do programa e contato de retorno", txt:`Quando a última sessão é concluída, se o procedimento tem **frequência para repetir** cadastrada, a ferramenta cria sozinha uma tarefa de **Retorno de procedimento**, com a antecedência definida no cadastro e para o responsável definido.

Exemplo: toxina botulínica, repetir a cada 4 meses, contato 15 dias antes.`},
  {t:"Encerrar ou excluir um programa", adm:true, txt:`- **Encerrar programa:** o paciente parou antes do fim. Informe o motivo; as sessões em aberto são canceladas e as realizadas ficam no histórico.
- **Excluir adesão:** só para registros feitos por engano. Apaga a adesão e todas as sessões, inclusive as realizadas, e desfaz as baixas de estoque delas.`}
 ]},
 {id:"m9", cap:"9. Campanhas", secs:[
  {t:"Campanhas no dia a dia", txt:`As campanhas são criadas pelo administrativo. A equipe executa as tarefas da campanha normalmente, pela tela Hoje ou pela página da campanha, e pode vincular a uma campanha qualquer tarefa ou pagamento que veio dela (campo “Campanha” na tarefa).

**Campanha do paciente:** ao cadastrar um paciente novo, responda “Chegou por uma campanha?”. A partir daí, e também para pacientes que já estão na lista de uma campanha em andamento, o campo Campanha já vem **sugerido** nos agendamentos e recebimentos dele. Assim o resultado da campanha é medido sem depender de lembrar de marcar.`},
  {t:"Criar uma campanha", adm:true, txt:`Em **Campanhas › Nova campanha**, informe:
- **Tipo:** Aniversariantes, Recaptação, Procedimento específico, Orçamentos em aberto, Data comemorativa, Indicação ou Outra.
- Procedimento em foco (opcional), nome, objetivo ou roteiro, início e fim.
- **Meta** e a métrica dela.`},
  {t:"Métricas da meta", txt:`- **Pacientes convertidos:** pacientes da campanha com consulta, procedimento ou orçamento pago concluído.
- **Contatos realizados:** contatos concluídos com pacientes, sem contar pagamentos.
- **Tipo de contato:** quantidade de tarefas concluídas de um tipo escolhido.
- **Receita:** soma dos pagamentos vinculados à campanha (resultado visível só para o administrativo).`},
  {t:"Importar lista de pacientes", adm:true, txt:`Dentro da campanha, use **“Importar lista de pacientes”**:
- Toque em **“Baixar planilha modelo”** e preencha uma linha por paciente. A coluna **Observação** vai para a tarefa.
- Escolha o arquivo (.xlsx, .xls ou .csv) e toque em **“Ler lista”**.
- Confira a prévia e confirme. Uma tarefa é criada para cada paciente; quem ainda não tem cadastro é cadastrado automaticamente.`},
  {t:"Acompanhar resultados", txt:`A página da campanha mostra o andamento da meta, o **funil** (ações planejadas, realizadas, pacientes alcançados, convertidos e receita), as ações por tipo, quem executou e o histórico de campanhas do mesmo tipo em outros meses.

**“Repetir no próximo mês”** cria a mesma campanha para o mês seguinte. Para vincular um pagamento à campanha, escolha a campanha no lançamento.`}
 ]},
 {id:"m10", cap:"10. Painel", adm:true, secs:[
  {t:"Período", txt:`Escolha 7 dias, 30 dias, Este mês, Mês passado ou Personalizado. Os prazos consideram as tarefas com vencimento no período; contatos e valores contam pela data em que a tarefa foi concluída. Toque nos números com “Ver registros” para abrir a lista.`},
  {t:"Cumprimento de prazos", txt:`Percentual de tarefas concluídas no prazo, tarefas no período, no prazo, concluídas com atraso, atrasadas em aberto e a vencer. Abaixo, a distribuição por responsável e quem solicitou.`},
  {t:"Pacientes no período", txt:`- **Receita registrada**, ticket médio, contatos realizados e orçamentos pagos (com a conversão sobre os enviados).
- **Forma de pagamento:** quanto entrou por Pix, dinheiro, cartões e nota promissória.
- **Top 10 pagantes:** pacientes que mais pagaram, no período ou desde o início. Toque no nome para abrir a ficha.
- **Valores em aberto:** todos os saldos a receber, por paciente.
- Campanhas no período, desempenho por unidade e novos pacientes.`}
 ]},
 {id:"m11", cap:"11. Cadastros da gestão", adm:true, secs:[
  {t:"Equipe", txt:`Em **Configurações › Usuários e acessos**, cadastre cada pessoa com nome, função e PIN de 4 números (combine o PIN direto com a pessoa).
- **Perfil administrativo:** vê painel, valores e equipe. Marque só para quem precisa.
- **Ativa:** desmarque quando a pessoa sair da clínica. O histórico dela é mantido.`},
  {t:"Unidades", txt:`Em **Configurações › Unidades**, cadastre os locais de atendimento (nome e endereço). Cada paciente tem uma unidade principal; atendimentos, pagamentos e programas herdam a unidade dele e podem ser trocados quando o atendimento for em outro local.

Com unidades cadastradas, aparecem filtros por unidade em Tarefas, Programas e no Painel, e a tabela de desempenho por unidade.`},
  {t:"Procedimentos", txt:`Em **Configurações › Procedimentos**, cadastre:
- Nome, número de sessões, intervalo entre sessões e nome de cada sessão (Aplicação, Sessão…).
- Responsável padrão e valor de referência (sugerido na adesão).
- **Repetição do procedimento:** de quanto em quanto tempo pode repetir, quantos dias antes fazer o contato e quem faz. Deixe em branco quando não houver retorno.

A clínica já começa com modelos, que podem ser editados.

**Excluir:** em Editar, “Excluir do catálogo” (toque duas vezes para confirmar). Só itens que nunca foram usados em uma adesão podem ser excluídos, porque o histórico e o contato de retorno desses pacientes dependem do item. Para os demais, desmarque **Ativo**: o item deixa de ser oferecido em novas adesões. Mudanças de sessões e intervalo valem para novas adesões; quem já está no programa mantém as sessões programadas.`}
 ]}
 ,
 {id:"m13", cap:"13. Gestão de pessoas", adm:true, secs:[
  {t:"Ficha da pessoa", txt:`Em **Pessoas › Equipe**, cada pessoa da clínica tem uma ficha, mesmo quem não usa a ferramenta: cargo, tipo de contrato (CLT, PJ, estágio, autônomo, sócia), admissão, aniversário, salário (só o administrativo vê), gestor direto e o usuário da ferramenta ligado a ela (as metas automáticas usam os registros desse usuário).`},
  {t:"Alertas", txt:`A **Visão geral** reúne os alertas da equipe, cada um com botão **Gerar tarefa**:
- **Férias (CLT):** a ferramenta calcula os períodos aquisitivos e avisa 60 dias antes do prazo para conceder. Férias concedidas fora do prazo são pagas em dobro.
- **Experiência (CLT):** aviso perto do fim dos 45 e dos 90 dias, para decidir prorrogação e efetivação.
- **Documentos:** ASO, registro profissional (COREN, CRM), treinamentos. Aviso 30 dias antes de vencer.
- **Banco de horas:** saldo acima do limite (padrão ±10 horas).`},
  {t:"Metas do mês", txt:`Na aba **Metas**, defina as metas de cada pessoa por mês:
- **Automáticas**, calculadas pelos registros da ferramenta: agendamentos, confirmações, contatos, orçamentos fechados (quantidade e valor), recebimentos, tarefas no prazo e contagens de estoque no prazo.
- **Manuais**, para o que não está na ferramenta (ex.: avaliações no Google): o gestor lança o resultado.

“Copiar metas do mês anterior” agiliza o mês seguinte. Cada colaboradora acompanha as próprias metas em **Pessoas › Minhas metas**.`},
  {t:"Conversas 1:1", txt:`Uma conversa por mês com cada pessoa. O registro mostra as metas do mês e guarda **pontos fortes**, **pontos a desenvolver** e **combinados**. Cada combinado pode virar tarefa para a pessoa, com prazo de 30 dias. A aba mostra quem ainda não teve a conversa do mês, e a **rotina mensal** cria a tarefa do gestor todo dia 20.`},
  {t:"Banco de horas", txt:`A ferramenta **não registra ponto**. No fim do mês, lance o saldo de cada pessoa como aparece no aplicativo oficial de ponto (ex.: +6:30 ou −2:15). A tabela mostra os últimos meses e destaca quem passou do limite. A rotina mensal cria a tarefa “Análise do espelho de ponto” todo dia 5.`}
 ]},
 {id:"m12", cap:"12. Estoque", secs:[
  {t:"Como funciona", txt:`O estoque da ferramenta é uma **rotina de inventário**. Não substitui o sistema principal da clínica: o uso por paciente continua lá.

A conta é sempre a mesma: **contagem anterior + entradas − descartes − contagem atual = consumo do período**. Cada nova contagem vira o ponto de partida do período seguinte, e o histórico fica guardado.`},
  {t:"Locais do estoque", adm:true, txt:`Em **Estoque › Locais**, cadastre onde os itens ficam na clínica: sala de estoque, sala de enfermagem, geladeira, sala da doutora. Cada item fica em **um local**.

A lista de contagem pode ser gerada por local (“só a geladeira”, “só a sala da doutora”), e a lista impressa sai agrupada por local, como um roteiro. Antes do primeiro inventário, vale organizar fisicamente o estoque para que cada item esteja no seu lugar.`},
  {t:"Cadastrar itens", adm:true, txt:`Em **Processos › Estoque › Cadastrar item**: nome, categoria, unidade de medida, onde fica na clínica, responsável, estoque mínimo, unidade e custo unitário (visível só para o administrativo).

- **Alto valor**: automático pela curva ABC (os itens que concentram a maior parte do valor em estoque), com opção de forçar sim ou não.
- **Contagem inicial**: a quantidade de hoje é o ponto de partida.`},
  {t:"Unidades de medida", adm:true, txt:`Cada item pode ter até três unidades, com a conversão entre elas:
- **Unidade de estoque:** como a equipe conta na prateleira (ampola, frasco, unidade). Saldos e contagens ficam nela.
- **Unidade de compra** (opcional): como vem na nota (caixa), com quantas unidades de estoque vêm em cada uma. Ex.: 1 caixa = 4 ampolas.
- **Unidade de uso** (opcional): a unidade da dose aplicada (mg, UI, ml), com quanto tem em cada unidade de estoque. Ex.: 1 ampola = 5 mg; 1 frasco = 100 UI.

Com isso, a entrada pode ser lançada em caixas, a contagem em ampolas e o uso em mg: a ferramenta converte sozinha e mostra as duas formas (ex.: 0,5 ampola · 2,5 mg).

**Sobra de ampola ou frasco aberto:** se a sobra não é aproveitada no próximo paciente, desmarque a opção no cadastro do item. Aí, quando a dose usa só parte da ampola, a ferramenta registra o uso no paciente e a sobra como descarte (“Sobra de frasco aberto”).`},
  {t:"Código QR: etiquetas e leitura pelo celular", txt:`Cada item tem uma **etiqueta com código QR**. Em **Estoque › Etiquetas QR** (administrativo), escolha os itens e imprima; cole a etiqueta onde o item fica (prateleira, gaveta, geladeira). No detalhe de cada item há também “Etiqueta QR”, para imprimir só uma.

**Ler código** (botão no topo do estoque e ao lado do campo Item nos formulários): aponte a câmera do celular ou use **“Tirar foto do código”**, que funciona em qualquer celular. A ferramenta abre o item certo e pergunta o que fazer: **Uso em paciente**, **Entrada** ou **Descarte**. Na entrada, basta informar a quantidade; na saída, o paciente e a dose.

**Código da caixa do medicamento:** medicamentos industrializados trazem um código na caixa com o produto, o lote e a validade. Na primeira leitura, escolha a qual item ele corresponde; daí em diante a ferramenta reconhece sozinha e já preenche **validade e lote** na entrada. Funciona também com o código de barras comum. Produtos manipulados não têm esse código: use a etiqueta da ferramenta.`},
  {t:"Importar o cadastro do sistema principal", adm:true, txt:`Em **Estoque › Importar itens**, traga a lista de itens exportada do sistema principal, **sem quantidades**. A ferramenta reconhece colunas como Código, Produto ou Descrição, Grupo ou Categoria, Unidade, Custo e Mínimo (também há uma planilha modelo). Itens já cadastrados (mesmo código ou nome) não são duplicados.

Depois da importação, aparece o aviso dos itens sem contagem inicial, com o botão **Gerar contagem inicial**: a primeira contagem alimenta as quantidades.`},
  {t:"Entrada pela nota", txt:`Com a nota em mãos, use **Estoque › Entrada pela nota**: fornecedor, número, data e uma linha por item (quantidade, validade e custo). Nos itens com unidade de compra, escolha se a quantidade está em caixas ou na unidade do estoque; a conversão é automática. Tudo de uma vez.

Quem tiver o **XML da NF-e** (normalmente o financeiro) pode usar “Tenho o XML da nota”: a ferramenta lê itens, quantidades, custos, lote e validade, sugere o item correspondente e pede a conversão (ex.: 1 caixa = 10 ampolas). A ligação fica salva para as próximas notas do mesmo fornecedor, e a mesma nota não entra duas vezes. Se o custo subir 10% ou mais, a ferramenta avisa.`},
  {t:"Entradas e saídas", txt:`- **Registrar entrada**: compra que chegou. Quantidade (em caixas ou na unidade do estoque), data, validade (se o item controla) e custo.

Toda saída do estoque tem um motivo. Em **Registrar saída**, escolha:
- **Uso em paciente:** paciente, produto, dose (na unidade de uso, ex.: 2,5 mg ou 20 UI), procedimento, quem aplicou e lote. Fica registrado na ficha do paciente.
- **Descarte:** vencido, avaria, sobra de frasco aberto ou outro motivo.
- **Uso interno ou cortesia:** amostra, teste; o motivo é obrigatório.
- **Ajuste de estoque** (só administrativo): faltou ou sobrou, com o motivo. Ex.: correção de lançamento.

O **lote** vem sugerido pelo que vence primeiro e pode ser trocado. As sessões de programa e os procedimentos com insumo dão baixa sozinhos, já ligados ao paciente.`},
  {t:"Gerar lista de contagem", txt:`Na aba **Contagens**, escolha os itens (só alta rotatividade, só alto valor, todos ou uma categoria), a unidade, o responsável e a data. A lista vira uma **tarefa estratégica** para o responsável.
- Com **Repetir** (a cada 15 dias ou todo mês), a próxima contagem é criada sozinha ao concluir a atual.
- A contagem é **às cegas**: a quantidade esperada não aparece, para o número ser real.
- Nos itens com validade, informe quantas unidades vencem em cada mês.
- **Imprimir lista** gera a folha para contar no papel.
- Ao concluir, a ferramenta mostra o consumo de cada item e pode criar tarefas de reposição para o que ficou abaixo do mínimo.`},
  {t:"Análise do estoque", txt:`Na aba **Análise**, com filtro de período e unidade:
- **Inventário do período** de cada item: **contagem inicial**, **entradas**, **saídas registradas** (uso em pacientes, descartes, uso interno e ajustes), **saldo esperado** (inicial + entradas − saídas), **contagem final** e a **diferença** entre o esperado e o contado. Diferença em vermelho é falta (desperdício, desvio ou uso não registrado); em amarelo, sobra. O administrativo vê o valor em reais.
- Ex.: setembro começou com 14 ampolas, entraram 10, saíram 5 registradas: o esperado é 19. Se a contagem final deu 18, falta 1 ampola sem registro.
- **Próximos do vencimento** (30, 60 ou 90 dias), com botão para **gerar tarefa** (ex.: priorizar o uso antes de vencer).
- **Abaixo do mínimo**, com botão para gerar a tarefa de reposição.
- **Imprimir relatório**: a lista para entregar à médica.
- **Criar rotina mensal de análise**: uma tarefa todo dia 1º para revisar o estoque.`}
 ]},
 {id:"m14", cap:"14. Financeiro", secs:[
  {t:"Para que serve", txt:`O Financeiro da ferramenta **não substitui a contabilidade nem o financeiro completo**. Ele coloca na rotina da clínica os rituais que dão uma visão organizada do dinheiro: conferir o caixa todo dia, pagar as contas no prazo, cobrar quem está devendo e olhar o mês por categoria.`},

const negrito = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
function mdManual(txt, termos){
  const marcar = h => { if (!termos.length) return h;
    return h.replace(/(<[^>]+>)|([^<]+)/g, (m, tag, txtp) => tag ? tag : txtp.replace(new RegExp("("+termos.map(w=>w.split("").map(c=>{const b=semAcento(c); return /[a-z]/.test(b) ? `[${b}${({a:"áàâã",e:"éê",i:"í",o:"óôõ",u:"úü",c:"ç"})[b]||""}]` : c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}).join("")).join("|")+")","gi"), "<mark>$1</mark>")); };
  return txt.split(/\n\s*\n/).map(bl => {
    const ls = bl.split("\n");
    const itens = ls.filter(l=>l.startsWith("- ")), texto = ls.filter(l=>!l.startsWith("- "));
    return (texto.length ? `<p>${marcar(negrito(esc(texto.join(" "))))}</p>` : "") + (itens.length ? `<ul>${itens.map(l=>`<li>${marcar(negrito(esc(l.slice(2))))}</li>`).join("")}</ul>` : "");
  }).join("");
}
function vManual(main){
  const adm = S.user.admin || pode("painel") || pode("config");
  const caps = MANUAL.filter(c => adm || !c.adm).map(c => ({...c, secs: c.secs.filter(s => adm || !s.adm)}));
  main.innerHTML = `
    <div class="eyebrow">Manual</div>
    <h1 style="margin-bottom:6px">Manual da ferramenta</h1>
    <p class="note" style="margin-top:0">Como cada tela funciona, passo a passo. Use a lupa para encontrar um assunto ou navegue pelo sumário. Para respostas curtas, veja a <button class="link" type="button" id="maj">Ajuda</button>.</p>
    <div class="ajbusca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="mq" type="search" placeholder="Buscar no manual" aria-label="Buscar no manual" value="${esc(S.manQ||"")}" autocomplete="off"></div>
    <div id="mres"></div>`;
  document.getElementById("maj").onclick = () => ir("ajuda");
  const q = document.getElementById("mq"), res = document.getElementById("mres");
  const desenhar = () => {
    const termos = semAcento(q.value).split(/\s+/).filter(w=>w.length>1);
    if (!termos.length){
      res.innerHTML = `<nav class="card mansum" aria-label="Sumário"><b>Sumário</b><ol>${caps.map(c=>`<li><button class="link" type="button" data-mcap="${c.id}">${esc(c.cap.replace(/^\d+\.\s*/,""))}</button></li>`).join("")}</ol></nav>
        ${caps.map(c=>`<section class="mancap" id="${c.id}"><h2>${esc(c.cap)}</h2>${c.secs.map(s=>`<article class="mansec"><h3>${esc(s.t)}</h3>${mdManual(s.txt, [])}</article>`).join("")}</section>`).join("")}`;
      res.querySelectorAll("[data-mcap]").forEach(b => b.onclick = () => { const el = document.getElementById(b.dataset.mcap); if (el){ el.scrollIntoView({behavior:"smooth", block:"start"}); } });
      return;
    }
    const achados = [];
    caps.forEach(c => c.secs.forEach(s => {
      const tt = semAcento(s.t), tx = semAcento(s.txt.replace(/\*\*/g,"")), tc = semAcento(c.cap);
      let sc = 0;
      for (const w of termos){ if (tt.includes(w)) sc += 3; else if (tx.includes(w)) sc += 1; else if (tc.includes(w)) sc += 1; else { sc = -1; break; } }
      if (sc > 0) achados.push([sc, c, s]);
    }));
    achados.sort((a,b)=>b[0]-a[0]);
    res.innerHTML = achados.length
      ? `<p class="note">${plural(achados.length,"trecho encontrado","trechos encontrados")}</p>${achados.map(([,c,s])=>`<article class="mansec achado"><div class="mancapt">${esc(c.cap)}</div><h3>${mdManual(s.t,termos).replace(/^<p>|<\/p>$/g,"")}</h3>${mdManual(s.txt, termos)}</article>`).join("")}`
      : `<div class="empty">Nada encontrado no manual para “${esc(q.value)}”. Tente outra palavra, como “pagamento”, “sessão” ou “campanha”.</div>`;
  };
  q.oninput = () => { S.manQ = q.value; desenhar(); };
  desenhar();
}

function statsPac(pid){
  const ts = S.tasks.filter(t => t.pacienteId===pid);
  const c = ts.filter(t => t.status==="concluida");
  const rec = c.filter(ehReceita), atend = c.filter(ehAtende), pagos = rec.filter(t => Number(t.valor) > 0);
  const soma = arr => arr.reduce((a,t)=>a+(Number(t.valor)||0),0);
  const orcEnv = c.filter(t=>t.tipo==="Orçamento enviado"), orcFech = c.filter(t=>t.tipo==="Pagamento de orçamento");
  const s = {
    total: ts.length, abertas: ts.filter(t=>t.status==="aberta").length,
    consultas: c.filter(t=>t.tipo==="Consulta realizada").length,
    procedimentos: c.filter(t=>t.tipo==="Procedimento realizado").length,
    contatos: c.filter(ehContato).length,
    atendimentos: atend.length, pagamentos: pagos.length, ltv: soma(rec),
    sessoes: c.filter(ehSessao).length,
    orcEnv: orcEnv.length, orcEnvV: soma(orcEnv), orcFech: orcFech.length, orcFechV: soma(orcFech),
    desde: atend.map(dataRef).sort()[0] || "",
    ultimo: c.map(dataRef).concat([(pac(pid)||{}).ultimaConsulta||""]).sort().pop() || "",
    ultCons: c.filter(t=>t.tipo==="Consulta realizada").map(dataRef).concat([(pac(pid)||{}).ultimaConsulta||""]).sort().pop() || "",
    ultAtend: atend.map(dataRef).concat([(pac(pid)||{}).ultimaConsulta||""]).sort().pop() || "",
    mov: ts.map(dataRef).sort().pop() || ""
  };
  s.ticket = s.pagamentos ? s.ltv/s.pagamentos : 0;
  return s;
}

/* ---------- períodos ---------- */
const PERIODOS = [["7d","7 dias"],["30d","30 dias"],["mes","Este mês"],["ant","Mês passado"],["per","Personalizado"]];
function intervalo(k, ini, fim){
  const h = today(), d = parse(h);
  if (k==="7d") return [addDays(h,-6), h, "Últimos 7 dias"];
  if (k==="30d") return [addDays(h,-29), h, "Últimos 30 dias"];
  if (k==="per") return [ini||addDays(h,-29), fim||h, "Período personalizado"];
  if (k==="mes") return [ymd(new Date(d.getFullYear(),d.getMonth(),1)), ymd(new Date(d.getFullYear(),d.getMonth()+1,0)), MES[d.getMonth()]];
  if (k==="ant"){ const a = new Date(d.getFullYear(),d.getMonth()-1,1); return [ymd(a), ymd(new Date(d.getFullYear(),d.getMonth(),0)), MES[a.getMonth()]]; }
  return null;
}
function datasPersonalizadas(px, ini, fim){
  return `<div class="card row2" style="gap:10px">
    <label class="f" for="${px}ini">De<input id="${px}ini" type="date" value="${ini}" max="${fim}"></label>
    <label class="f" for="${px}fim">Até<input id="${px}fim" type="date" value="${fim}" min="${ini}"></label></div>`;
}
function ligarDatas(px, obj, kIni, kFim, depois){
  const a = document.getElementById(px+"ini"), b = document.getElementById(px+"fim");
  if (!a) return;
  a.onchange = () => { if(!a.value) return; obj[kIni] = a.value; if (obj[kFim] < obj[kIni]) obj[kFim] = obj[kIni]; depois(); };
  b.onchange = () => { if(!b.value) return; obj[kFim] = b.value; if (obj[kIni] > obj[kFim]) obj[kIni] = obj[kFim]; depois(); };
}
const somaValor = arr => arr.reduce((a,t)=>a+(Number(t.valor)||0),0);
const pessoasOrdenadas = () => S.team.slice().sort((a,b)=> (b.ativo-a.ativo) || a.nome.localeCompare(b.nome));

    </div>
    ${f.per==="per" ? datasPersonalizadas("lp", f.ini, f.fim) : ""}
    ${rng ? `<p class="note">${esc(rng[2])}: ${brAno(rng[0])} a ${brAno(rng[1])} · considera a data de realização das concluídas e o prazo das demais.</p>` : ""}
    <div class="row2">
      <label class="f" for="lbusca">Buscar<input id="lbusca" type="search" placeholder="Paciente, descrição ou resultado" value="${esc(f.busca)}"></label>
      <label class="f" for="ltipo">Tipo<select id="ltipo">${tipoOptions(f.tipo, true)}</select></label>
    </div>
    ${S.campanhas.length || temUnidades() ? `<div class="row2">
      ${S.campanhas.length ? `<label class="f" for="lcamp">Campanha<select id="lcamp">${campOptions(f.camp||"", true)}</select></label>` : ""}
      ${temUnidades() ? `<label class="f" for="luni">Unidade<select id="luni">${unidadeFiltro(f.uni)}</select></label>` : ""}
    </div>` : ""}
    <div class="resumo" id="lsum" aria-live="polite"></div>
    <div class="group" id="lres"></div>
  </section>`;
  const lres = document.getElementById("lres"), lsum = document.getElementById("lsum");
  const desenhar = () => {
    let arr = S.tasks.filter(t => !ehSessao(t) && (!f.resp || t.responsavelId===f.resp) && (!f.sol || t.solicitanteId===f.sol));
    arr = arr.filter(t => f.status==="todas" ? true : f.status==="abertas" ? t.status==="aberta" : f.status==="atrasadas" ? (t.status==="aberta"&&t.prazo<h)
      : f.status==="concluidas" ? t.status==="concluida" : t.status==="cancelada");
    if (rng) arr = arr.filter(t => { const d = t.status==="concluida" ? dataRef(t) : t.prazo; return d>=rng[0] && d<=rng[1]; });
    arr = arr.filter(t => passaTipo(t, f.tipo) && passaBusca(t, f.busca)
      && (!f.camp || (f.camp==="__sem" ? !t.campanhaId : t.campanhaId===f.camp)) && passaUnidade(unidadeDaTarefa(t), f.uni));
    const asc = f.status==="abertas" || f.status==="atrasadas";
    arr = asc ? ordenar(arr) : arr.slice().sort((a,b)=> dataRef(b).localeCompare(dataRef(a)));
    const nConc = arr.filter(t=>t.status==="concluida").length, nAb = arr.filter(t=>t.status==="aberta").length;
    const rec = somaValor(arr.filter(t=>t.status==="concluida" && ehReceita(t)));
    lsum.innerHTML = `<b>${plural(arr.length,"tarefa","tarefas")}</b>${f.status==="todas" ? ` · ${nConc} concluídas · ${nAb} em aberto` : ""}${adm && rec ? ` · receita ${brl(rec)}` : ""}`;
    const lim = arr.slice(0,200);
    let ocultasP = 0;
    if (f.resp || f.sol){ const sem = S.tasks.filter(t => !ehSessao(t) && !((!f.resp || t.responsavelId===f.resp) && (!f.sol || t.solicitanteId===f.sol))
      && (f.status==="todas" ? true : f.status==="abertas" ? t.status==="aberta" : f.status==="atrasadas" ? (t.status==="aberta"&&t.prazo<h) : f.status==="concluidas" ? t.status==="concluida" : t.status==="cancelada")
      && (!rng || (d => d>=rng[0] && d<=rng[1])(t.status==="concluida" ? dataRef(t) : t.prazo)) && passaTipo(t, f.tipo) && passaBusca(t, f.busca)); ocultasP = sem.length; }
    lsum.innerHTML += ocultasP ? `<p class="note hojeocultas" style="margin:8px 0 0">${plural(ocultasP,"tarefa","tarefas")} de outras pessoas não ${ocultasP>1?"aparecem":"aparece"} por causa do filtro de pessoa. <button class="link" type="button" id="lvertodas">Ver ${pode("tarefas.equipe") ? "Equipe toda" : "Todas que vejo"}</button></p>` : "";
    const lvt = document.getElementById("lvertodas"); if (lvt) lvt.onclick = () => { f.resp = ""; f.sol = ""; render(); };
    lres.innerHTML = (lim.length ? lim.map(t=>cardTarefa(t)).join("") : '<div class="empty">Nenhuma tarefa com esse filtro.</div>')
      + (arr.length>200 ? `<p class="note">Mostrando 200 de ${arr.length}. Refine os filtros para ver as demais.</p>` : "");
    ligarAcoes(lres);
  };
  desenhar();
  main.querySelectorAll("[data-at]").forEach(b=>b.onclick=()=>{ const k=b.dataset.at;
    f.resp = k==="minhas" ? eu : ""; f.sol = k==="solicitadas" ? eu : ""; render(); });
  document.getElementById("lsol").onchange = e => { f.sol = e.target.value; render(); };
  document.getElementById("lresp").onchange = e => { f.resp = e.target.value; render(); };
  document.getElementById("lstatus").onchange = e => { f.status = e.target.value; render(); };
  document.getElementById("lper").onchange = e => { f.per = e.target.value; if (f.per!=="tudo" && f.status==="abertas") f.status = "todas"; render(); };
  ligarDatas("lp", f, "ini", "fim", render);
  document.getElementById("lbusca").oninput = e => { f.busca = e.target.value; desenhar(); };
  document.getElementById("ltipo").onchange = e => { f.tipo = e.target.value; desenhar(); };
  const lc = document.getElementById("lcamp"); if (lc) lc.onchange = e => { f.camp = e.target.value; desenhar(); };
  const lu = document.getElementById("luni"); if (lu) lu.onchange = e => { f.uni = e.target.value; desenhar(); };
}

/* ---------- PAINEL (admin) ---------- */
function periodoDatas(k){
  if (k==="per" && !S.perIni){ S.perIni = addDays(today(),-29); S.perFim = today(); }
  return intervalo(k, S.perIni, S.perFim);
}
function metricas(ts){
  const m = {ok:0, tarde:0, atrasada:0, avencer:0};
  ts.forEach(t=>{ const s = situacao(t).key;
    if (s==="ok") m.ok++; else if (s==="tarde") m.tarde++; else if (s==="atrasada") m.atrasada++; else if (s!=="cancelada") m.avencer++; });
  m.total = m.ok+m.tarde+m.atrasada+m.avencer;
  const base = m.ok+m.tarde+m.atrasada;
  m.taxa = base ? Math.round(m.ok/base*100) : null;
  return m;
}
function barra(m){
  const t = m.total || 1;
  return `<div class="gauge" role="img" aria-label="${m.ok} no prazo, ${m.tarde} com atraso, ${m.atrasada} atrasadas, ${m.avencer} a vencer">
    <i style="width:${m.ok/t*100}%;background:var(--ok)"></i><i style="width:${m.tarde/t*100}%;background:var(--warn)"></i>
    <i style="width:${m.atrasada/t*100}%;background:var(--bad)"></i><i style="width:${m.avencer/t*100}%;background:var(--gold)"></i></div>`;
}
const grupoPrazo = t => { const k = situacao(t).key; return (k==="hoje"||k==="aberta") ? "avencer" : k; };
function vPainel(main){
  const [ini, fim, rot] = periodoDatas(S.periodo);
  const dentro = s => s>=ini && s<=fim;
  const noPeriodo = S.tasks.filter(t => t.status!=="cancelada" && !ehSessao(t) && dentro(t.prazo));
  const criadas = S.tasks.filter(t => !ehSessao(t) && dentro(dia(t.criadaEm)));
  const m = metricas(noPeriodo);
  const pessoas = S.team.filter(u => u.ativo || noPeriodo.some(t=>t.responsavelId===u.id));
  const linhas = pessoas.map(u => ({u, m: metricas(noPeriodo.filter(t=>t.responsavelId===u.id)),
    sol: criadas.filter(t=>t.solicitanteId===u.id).length,
    auto: criadas.filter(t=>t.solicitanteId===u.id && t.responsavelId===u.id).length}))
    .filter(l => l.m.total || l.sol).sort((a,b)=> b.m.total-a.m.total);
  const pct = v => v===null ? "—" : v+"%";
  // Pacientes: pela data de conclusão
  const conclP = S.tasks.filter(t => t.status==="concluida" && t.pacienteId && dentro(dia(t.concluidaEm)));
  const rec = conclP.filter(ehReceita), receita = somaValor(rec);
  const contatosArr = conclP.filter(ehContato);
  const env = conclP.filter(t=>t.tipo==="Orçamento enviado").concat(S.tasks.filter(t => ehEsteira(t) && histDe(t).some(x => x.e==="orcamento" && !x.rot && dentro(dia(x.em||""))))), fech = conclP.filter(t=>t.tipo==="Pagamento de orçamento");
  // conversão: orçamentos da jornada que fecharam no período ÷ orçamentos enviados no período
  const fechJ = S.tasks.filter(t => ehEsteira(t) && histDe(t).some(x => x.e==="orcamento" && !x.rot) && histDe(t).some(x => x.e==="fechado" && dentro(dia(x.em||"")))).length + conclP.filter(t=>t.tipo==="Orçamento enviado" && S.tasks.some(y => y.tipo==="Pagamento de orçamento" && y.pacienteId===t.pacienteId && dataRef(y) >= dataRef(t))).length;
  const pacAtend = new Set(conclP.filter(ehAtende).map(t=>t.pacienteId)).size;
  const porTipo = CONFIG.TIPOS.map(tp => ({tp, feitos: conclP.filter(t=>t.tipo===tp.nome), previstos: noPeriodo.filter(t=>t.tipo===tp.nome)}))
    .filter(x => x.feitos.length || x.previstos.length);

  // Registros que abrem ao clicar em um número
  const D = {};
  const reg = (key, titulo, arr, alvo) => { D[key] = {titulo, arr, alvo}; return key; };
  const nb = (key, n, cls) => n ? `<button class="numbtn ${cls||""}" type="button" data-drill="${esc(key)}" aria-label="Ver ${n} registros">${n}</button>` : `<span class="muted">0</span>`;
  const kb = (key, inner) => `<button class="kpi kpibtn" type="button" data-drill="${esc(key)}">${inner}<span class="ver">Ver registros</span></button>`;
  const porSit = (arr, sit) => arr.filter(t=>grupoPrazo(t)===sit);
  reg("top:todas","Tarefas com prazo no período", noPeriodo, "dz-top");

  reg("pac:rec","Pagamentos registrados no período", rec, "dz-pac");

  reg("pac:pago","Orçamentos pagos no período", fech, "dz-pac");
  porTipo.forEach(x => { reg("tp:prev:"+x.tp.nome, x.tp.nome+" · com prazo no período", x.previstos, "dz-pac");
    reg("tp:feito:"+x.tp.nome, x.tp.nome+" · concluídos no período", x.feitos, "dz-pac"); });
  linhas.forEach(l => { const ts = noPeriodo.filter(t=>t.responsavelId===l.u.id), n = l.u.nome;
    reg("rs:tot:"+l.u.id, n+" · tarefas recebidas", ts, "dz-resp");
    reg("rs:ok:"+l.u.id, n+" · concluídas no prazo", porSit(ts,"ok"), "dz-resp");
    reg("rs:tarde:"+l.u.id, n+" · concluídas com atraso", porSit(ts,"tarde"), "dz-resp");
    reg("rs:atr:"+l.u.id, n+" · atrasadas em aberto", porSit(ts,"atrasada"), "dz-resp");
    const cs = criadas.filter(t=>t.solicitanteId===l.u.id);
    reg("sl:tot:"+l.u.id, n+" · tarefas solicitadas", cs, "dz-sol");
    reg("sl:auto:"+l.u.id, n+" · solicitadas para si mesma", cs.filter(t=>t.responsavelId===l.u.id), "dz-sol");
    reg("sl:eq:"+l.u.id, n+" · solicitadas para a equipe", cs.filter(t=>t.responsavelId!==l.u.id), "dz-sol"); });

  const fp = S.filtroPainel;
  const novos = S.pacientes.filter(p => dentro(dia(p.criadoEm)));
  const novosOrig = [...new Set(novos.map(origemDe))].map(o => { const g = novos.filter(p=>origemDe(p)===o);
    const at = g.filter(p => S.tasks.some(t => t.pacienteId===p.id && t.status==="concluida" && ehAtende(t)));
    return {o, n:g.length, at:at.length, rec: g.reduce((a,p)=>a+statsPac(p.id).ltv,0)}; }).sort((a,b)=>b.n-a.n);
  const campsPer = S.campanhas.filter(c => c.inicio<=fim && c.fim>=ini).map(c => ({c, s: statsCamp(c)})).sort((a,b)=>a.c.inicio.localeCompare(b.c.inicio));
  main.innerHTML = `<section>
    <div class="weekhead"><div><div class="eyebrow">Painel${nomeClinica() ? " · "+esc(nomeClinica()) : ""}</div><h2 style="font-size:28px">Cumprimento de prazos</h2></div>
      <button class="btn ghost" id="bequipe" type="button" style="padding:8px 12px">${ICON.equipe.replace('<svg ','<svg width="18" height="18" style="vertical-align:-4px;margin-right:4px" ')}Equipe</button></div>
    <div class="seg" role="group" aria-label="Período">${PERIODOS.map(([k,l])=>`<button data-per="${k}" aria-pressed="${S.periodo===k}">${l}</button>`).join("")}</div>
    ${S.periodo==="per" ? datasPersonalizadas("per", ini, fim) : ""}
    <p class="note">${esc(rot)}: ${br(ini)} a ${br(fim)} · prazos consideram tarefas com vencimento no período. Toque nos números sublinhados para ver os registros.</p>
    <div class="kpis">
      <div class="kpi hero"><span>Concluídas no prazo</span><b class="num">${pct(m.taxa)}</b><span style="color:inherit;opacity:.8">das que já venceram</span></div>
      ${kb("top:todas", `<span>Tarefas no período</span><b class="num">${m.total}</b><span>${criadas.length} criadas no período</span>`)}
      ${kb("top:ok", `<span>No prazo</span><b class="num" style="color:var(--ok)">${m.ok}</b><span>com atraso: ${m.tarde}</span>`)}
      ${kb("top:atrasada", `<span>Atrasadas em aberto</span><b class="num" style="color:var(--bad)">${m.atrasada}</b><span>a vencer: ${m.avencer}</span>`)}
    </div>
    <div id="dz-top"></div>
    <div class="card" style="gap:10px">${barra(m)}
      <div class="legend"><span><i style="background:var(--ok)"></i>No prazo</span><span><i style="background:var(--warn)"></i>Concluída com atraso</span><span><i style="background:var(--bad)"></i>Atrasada em aberto</span><span><i style="background:var(--gold)"></i>A vencer</span></div>
    </div>

    <div class="group"><h3>Pacientes no período</h3>
      <p class="note">Contatos e valores contam pela data em que a tarefa foi concluída.</p>
      <div class="kpis">
        ${kb("pac:rec", `<span>Receita registrada</span><b class="num">${brl0(receita)}</b><span>${plural(rec.length,"pagamento","pagamentos")} · ${plural(pacAtend,"paciente","pacientes")}</span>`)}
        <div class="kpi"><span>Ticket médio</span><b class="num">${brl0(rec.length ? receita/rec.length : 0)}</b><span>por pagamento</span></div>
        ${kb("pac:cont", `<span>Contatos realizados</span><b class="num">${contatosArr.length}</b><span>follow-up, recaptação, etc.</span>`)}
        ${kb("pac:pago", `<span>Orçamentos pagos</span><b class="num">${fech.length}</b><span>${brl0(somaValor(fech))} · ${env.length} enviados${env.length?" · conversão "+Math.min(100, Math.round(fechJ/env.length*100))+"%":""}</span>`)}
      </div>
      ${vVal() && rec.length ? (() => { const fs = {}; rec.forEach(t => { const f = t.formaPagamento || "Não informada"; (fs[f] = fs[f] || {n:0, v:0}); fs[f].n++; fs[f].v += Number(t.valor)||0; });
        return `<div class="tablewrap"><table style="min-width:300px"><thead><tr><th>Forma de pagamento</th><th class="n">Pagamentos</th><th class="n">Valor</th><th class="n">%</th></tr></thead>
          <tbody>${Object.entries(fs).sort((a,b)=>b[1].v-a[1].v).map(([f,x])=>`<tr><td>${esc(f)}</td><td class="n">${x.n}</td><td class="n">${brl0(x.v)}</td><td class="n">${receita ? Math.round(x.v/receita*100) : 0}%</td></tr>`).join("")}</tbody></table></div>`; })() : ""}
      <div class="tablewrap"><table style="min-width:420px">
        <thead><tr><th>Tipo de contato</th><th class="n">Com prazo no período</th><th class="n">Concluídos no período</th><th class="n">Valor</th></tr></thead>
        <tbody>${porTipo.map(x=>`<tr><td>${esc(nomeTipo(x.tp.nome))}</td>
          <td class="n">${nb("tp:prev:"+x.tp.nome, x.previstos.length)}</td>
          <td class="n">${nb("tp:feito:"+x.tp.nome, x.feitos.length)}</td>
          <td class="n">${somaValor(x.feitos)?brl0(somaValor(x.feitos)):"—"}</td></tr>`).join("") || '<tr><td colspan="4" class="muted">Nenhum contato com paciente no período.</td></tr>'}</tbody>

      <div id="dz-pac"></div>

    ${campsPer.length ? `<div class="group"><h3>Campanhas no período</h3>
      <div class="tablewrap"><table style="min-width:480px">
        <thead><tr><th>Campanha</th><th class="n">Meta</th><th class="n">Resultado</th><th class="n">% da meta</th><th class="n">Ações</th><th class="n">Receita</th></tr></thead>
        <tbody>${campsPer.map(({c,s})=>`<tr><td><button class="link" type="button" data-campid="${esc(c.id)}">${esc(c.nome)}</button>
          <div class="muted" style="font-size:12px">${esc(rotuloCat(c))} · ${esc(rotuloMeta(c))} · ${br(c.inicio)} a ${br(c.fim)}</div></td>
          <td class="n">${fmtRes(c,s.meta)}</td><td class="n">${fmtRes(c,s.resultado)}</td>
          <td class="n"><b style="color:${s.pct>=100?"var(--ok)":"inherit"}">${s.pct}%</b></td><td class="n">${s.feitas.length}/${s.ts.length}</td><td class="n">${brl0(s.receita)}</td></tr>`).join("")}</tbody>
      </table></div></div>` : ""}

    ${top10Html(ini, fim, rot)}
    ${temUnidades() ? `<div class="group"><h3>Desempenho por unidade</h3>${unidadesTabelaHtml(statsUnidades(ini, fim), rot)}</div>` : ""}
    ${painelPlanosHtml(ini, fim)}
    ${painelSaldosHtml()}
    <div class="group"><h3>Novos pacientes no período <span class="n">${novos.length}</span></h3>
      <p class="note">Pela data de cadastro na ferramenta.</p>
      ${novosOrig.length ? `<div class="tablewrap"><table style="min-width:360px">
        <thead><tr><th>Origem</th><th class="n">Novos</th><th class="n">Já atendidos</th><th class="n">Receita</th></tr></thead>
        <tbody>${novosOrig.map(x=>`<tr><td><button class="link" type="button" data-orig="${esc(x.o)}">${esc(x.o)}</button></td><td class="n">${x.n}</td><td class="n">${x.at}</td><td class="n">${brl0(x.rec)}</td></tr>`).join("")}</tbody>
      </table></div>` : '<div class="empty">Nenhum paciente cadastrado no período.</div>'}
    </div>

    <div class="group"><h3>Por responsável</h3>
      <div class="tablewrap"><table>
        <thead><tr><th>Pessoa</th><th class="n">Recebidas</th><th class="n">No prazo</th><th class="n">Com atraso</th><th class="n">Atrasadas</th><th class="n">% prazo</th><th class="barcell">Distribuição</th></tr></thead>
        <tbody>${linhas.filter(l=>l.m.total).map(l=>`<tr><td><b>${esc(l.u.nome)}</b><div class="muted" style="font-size:12px">${esc(l.u.funcao||"")}</div></td>
          <td class="n">${nb("rs:tot:"+l.u.id, l.m.total)}</td><td class="n">${nb("rs:ok:"+l.u.id, l.m.ok)}</td><td class="n">${nb("rs:tarde:"+l.u.id, l.m.tarde)}</td>
          <td class="n">${nb("rs:atr:"+l.u.id, l.m.atrasada, "bad")}</td>
          <td class="n"><b>${pct(l.m.taxa)}</b></td><td class="barcell">${barra(l.m)}</td></tr>`).join("") || '<tr><td colspan="7" class="muted">Sem tarefas no período.</td></tr>'}</tbody>
      </table></div>
      <div id="dz-resp"></div>
    </div>
    <div class="group"><h3>Quem solicitou</h3>
      <p class="note">Pela data de criação da tarefa.</p>
      <div class="tablewrap"><table style="min-width:360px">
        <thead><tr><th>Pessoa</th><th class="n">Solicitadas</th><th class="n">Para si mesma</th><th class="n">Para a equipe</th></tr></thead>
        <tbody>${linhas.filter(l=>l.sol).sort((a,b)=>b.sol-a.sol).map(l=>`<tr><td>${esc(l.u.nome)}</td>
          <td class="n">${nb("sl:tot:"+l.u.id, l.sol)}</td><td class="n">${nb("sl:auto:"+l.u.id, l.auto)}</td><td class="n">${nb("sl:eq:"+l.u.id, l.sol-l.auto)}</td></tr>`).join("") || '<tr><td colspan="4" class="muted">Nenhuma tarefa criada no período.</td></tr>'}</tbody>
      </table></div>
      <div id="dz-sol"></div>
    </div>
    <div class="group" id="tperiodo"><h3>Tarefas do período <span class="n" id="tpn"></span></h3>
      <div class="seg" role="group" aria-label="Situação">${[["todas","Todas"],["ok","No prazo"],["tarde","Com atraso"],["atrasada","Atrasadas"],["avencer","A vencer"]].map(([k,l])=>`<button data-sit="${k}" aria-pressed="${fp.sit===k}">${l}</button>`).join("")}</div>
      <div class="row2">
        <label class="f" for="fsol">Solicitante<select id="fsol">${optPessoas(fp.sol)}</select></label>
        <label class="f" for="fresp">Responsável<select id="fresp">${optPessoas(fp.resp)}</select></label>
      </div>
      <div class="row2">
        <label class="f" for="ftipo">Tipo<select id="ftipo">${tipoOptions(fp.tipo, true)}</select></label>
        <label class="f" for="fbusca">Paciente ou descrição<input id="fbusca" type="search" placeholder="Ex.: Maria Souza" value="${esc(fp.busca)}"></label>
      </div>
      <div class="group" id="listaP"></div>
    </div>
  </section>`;

  const zonas = ["dz-top","dz-pac","dz-resp","dz-sol"];
  const abrir = (key, rolar) => {
    zonas.forEach(z => document.getElementById(z).innerHTML = "");
    main.querySelectorAll("[data-drill]").forEach(b => b.classList.toggle("on", b.dataset.drill===key));
    const d = D[key];
    if (!d){ S.drill = null; return; }
    S.drill = key;
    const arr = d.arr.slice().sort((a,b)=> dataRef(b).localeCompare(dataRef(a)));
    const tot = somaValor(arr.filter(t=>t.status==="concluida" && ehReceita(t)));
    const el = document.getElementById(d.alvo);
    el.innerHTML = `<div class="drill">
      <div class="drillhead"><b>${esc(d.titulo)}</b><span class="n">${arr.length}</span>${tot?`<span class="valor num">${brl(tot)}</span>`:""}
        <button class="link" type="button" id="dzfechar">Fechar</button></div>
      ${arr.length ? arr.map(t=>cardTarefa(t)).join("") : '<div class="empty">Nenhum registro.</div>'}</div>`;
    document.getElementById("dzfechar").onclick = () => { S.drill = null; abrir(null); };
    ligarAcoes(el);
    if (rolar) el.scrollIntoView({behavior:"smooth", block:"start"});
  };
  main.querySelectorAll("[data-drill]").forEach(b => b.onclick = () => abrir(S.drill===b.dataset.drill ? null : b.dataset.drill, true));
  if (S.drill && D[S.drill]) abrir(S.drill, false); else S.drill = null;

  const listaEl = document.getElementById("listaP");
  const desenhar = () => {
    const arr = ordenar(noPeriodo.filter(t => (fp.sit==="todas" || grupoPrazo(t)===fp.sit) && (!fp.resp || t.responsavelId===fp.resp)
      && (!fp.sol || t.solicitanteId===fp.sol) && passaTipo(t, fp.tipo) && passaBusca(t, fp.busca)));
    document.getElementById("tpn").textContent = arr.length;
    const vt = somaValor(arr.filter(t=>t.status==="concluida" && ehReceita(t)));
    listaEl.innerHTML = (vt ? `<p class="note">Receita nas tarefas filtradas: <b>${brl(vt)}</b></p>` : "")
      + (arr.length ? arr.map(t=>cardTarefa(t)).join("") : '<div class="empty">Nenhuma tarefa com esse filtro no período.</div>');
    ligarAcoes(listaEl);
  };
  desenhar();
  main.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{ S.periodo=b.dataset.per; S.drill=null; render(); });
  main.querySelectorAll("[data-topm]").forEach(b=>b.onclick=()=>{ S.topModo=b.dataset.topm; render(); });
  main.querySelectorAll("[data-pactop]").forEach(b=>b.onclick=()=>abrirPaciente(b.dataset.pactop));
  document.getElementById("bequipe").onclick = () => ir("equipe");
  main.querySelectorAll("[data-orig]").forEach(b => b.onclick = () => { S.filtroPac.origem = b.dataset.orig; S.filtroPac.modo = "todos"; S.filtroPac.busca = ""; ir("pacientes"); });
  main.querySelectorAll("[data-pacsal]").forEach(b => b.onclick = () => abrirPaciente(b.dataset.pacsal));
  main.querySelectorAll("[data-campid]").forEach(b => b.onclick = () => abrirCampanha(b.dataset.campid));
  ligarDatas("per", S, "perIni", "perFim", () => { S.drill = null; render(); });
  main.querySelectorAll("[data-sit]").forEach(b=>b.onclick=()=>{ fp.sit=b.dataset.sit;
    main.querySelectorAll("[data-sit]").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); desenhar(); });
  document.getElementById("fsol").onchange = e => { fp.sol = e.target.value; desenhar(); };
  document.getElementById("fresp").onchange = e => { fp.resp = e.target.value; desenhar(); };
  document.getElementById("ftipo").onchange = e => { fp.tipo = e.target.value; desenhar(); };
  document.getElementById("fbusca").oninput = e => { fp.busca = e.target.value; desenhar(); };
}

/* ---------- MINHA CONTA: trocar PIN ---------- */
function vConta(main){
  main.innerHTML = `<section>
    <div><div class="eyebrow">Minha conta</div><h2 style="font-size:28px">Trocar meu PIN</h2></div>
    <form class="card" id="fpin" autocomplete="off">
      <label class="f" for="patual">PIN atual<input id="patual" type="password" inputmode="numeric" maxlength="4" required></label>
      <div class="row2">
        <label class="f" for="pnovo">Novo PIN<input id="pnovo" type="password" inputmode="numeric" maxlength="4" required></label>
        <label class="f" for="pconf">Repita o novo PIN<input id="pconf" type="password" inputmode="numeric" maxlength="4" required></label>
      </div>
      <small class="muted">Use 4 números que só você saiba. Evite datas de aniversário e sequências como 1234.</small>
      <div class="err" id="perr" style="text-align:left"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" type="submit" id="psalvar">Salvar novo PIN</button>
        <button class="btn ghost" type="button" id="pvoltar">Voltar</button>
      </div>
    </form>
  </section>`;
  document.getElementById("pvoltar").onclick = () => ir("hoje");
  document.getElementById("fpin").addEventListener("submit", async e => {
    e.preventDefault();
    const err = document.getElementById("perr"), atual = patual.value.trim(), novo = pnovo.value.trim();
    if (atual !== S.pin){ err.textContent = "O PIN atual não confere."; return; }
    if (!/^\d{4}$/.test(novo)){ err.textContent = "O novo PIN precisa ter 4 números."; return; }
    if (novo !== pconf.value.trim()){ err.textContent = "A confirmação não é igual ao novo PIN."; return; }
    if (novo === atual){ err.textContent = "O novo PIN é igual ao atual."; return; }
    const btn = document.getElementById("psalvar"); btn.disabled = true; btn.textContent = "Salvando…";
    const r = await api("alterarPin", {novoPin: novo});
    if (!r.ok){ btn.disabled=false; btn.textContent="Salvar novo PIN"; err.textContent = r.error; return; }
    S.pin = novo; store.set(CHAVE_SESSAO,{uid:S.user.id, pin:novo});
    const me = S.team.find(u=>u.id===S.user.id); if (me && "pin" in me) me.pin = novo;
    ir("hoje"); toast("PIN alterado. Use o novo PIN no próximo acesso.");
  });
}

  const fu = document.getElementById("funi");
  if (fu){
    document.getElementById("unicanc").onclick = () => { S.unidadeForm = null; render(); };

      e.preventDefault();

      if (!r.ok){ toast(r.error); return; }
      const i = S.unidades.findIndex(x => x.id===r.data.id); if (i>=0) S.unidades[i] = r.data; else S.unidades.push(r.data);

function vEquipe(main){
  const p = S.editPessoa || {nome:"",funcao:"",pin:"",admin:false,ativo:true,perfilId:""};
  const aba = S.eqAba || "pessoas";
  if (aba==="perfis"){
    main.innerHTML = `<section>
      <div><div class="eyebrow">Configurações</div><h2 style="font-size:28px">Usuários e acessos</h2></div>
      <div class="seg" role="tablist"><button type="button" data-eqa="pessoas" aria-pressed="false">Pessoas</button><button type="button" data-eqa="perfis" aria-pressed="true">Perfis de acesso</button></div>
      <p class="note" style="margin:0">Cada perfil libera o que estiver marcado, pilar por pilar. O Administrador tem acesso total. Mude os perfis aqui e escolha o perfil de cada pessoa na aba Pessoas.</p>
      ${perfisHtml()}</section>`;
    main.querySelectorAll("[data-eqa]").forEach(b => b.onclick = () => { S.eqAba = b.dataset.eqa; render(); });
    ligarPerfis(main); return;
  }
  main.innerHTML = `<section>
    <div><div class="eyebrow">Configurações</div><h2 style="font-size:28px">Usuários e acessos</h2></div>
    <div class="seg" role="tablist"><button type="button" data-eqa="pessoas" aria-pressed="true">Pessoas</button><button type="button" data-eqa="perfis" aria-pressed="false">Perfis de acesso</button></div>
    <p class="note">Todas as pessoas ativas criam e executam as próprias tarefas e consultam o histórico dos pacientes. O que mais cada uma vê (agenda, financeiro, estoque, painel, tarefas da equipe) depende do perfil de acesso.</p>
    <p class="note">Para tirar alguém da equipe: <b>inativar</b> mantém a pessoa nos filtros e relatórios; <b>excluir</b> remove o usuário de vez. Nos dois casos, as tarefas antigas continuam com o nome dela. Antes de excluir, reatribua as tarefas em aberto.</p>
    <div class="group">${S.team.map(u=>`<div class="member ${u.ativo?"":"off"}">
      <div class="avatar">${inicial(u.nome)}</div>
      <div class="info"><b>${esc(u.nome)}</b><span class="muted" style="font-size:12.5px">${esc(u.funcao||"")}${u.ativo?"":" · inativa"}</span></div>
      <span class="pill ${u.admin ? "p-gold" : "p-mute"}">${esc(nomePerfil(u))}</span>
      <button class="link" data-edit="${esc(u.id)}">Editar</button></div>`).join("")}</div>
    <form class="card" id="fpessoa">
      <h3 style="font-size:22px">${p.id?"Editar pessoa":"Adicionar pessoa"}</h3>
      <div class="row2">
        <label class="f" for="pnome">Nome<input id="pnome" type="text" required value="${esc(p.nome)}" placeholder="Ex.: Juliana Santos"></label>
        <label class="f" for="pfuncsel">Função<select id="pfuncsel"><option value="">Selecione</option>${CONFIG.FUNCOES.map(f=>`<option ${p.funcao===f?"selected":""}>${esc(f)}</option>`).join("")}
          <option value="__outra" ${p.funcao && !CONFIG.FUNCOES.includes(p.funcao) ? "selected" : ""}>Outra…</option></select>
          <input id="pfuncao" type="text" maxlength="60" placeholder="Digite a função" value="${p.funcao && !CONFIG.FUNCOES.includes(p.funcao) ? esc(p.funcao) : ""}" ${p.funcao && !CONFIG.FUNCOES.includes(p.funcao) ? "" : "hidden"}></label>
      </div>
      <label class="f" for="ppin">PIN de 4 números<input id="ppin" type="text" inputmode="numeric" maxlength="4" required value="${esc(p.pin)}"><small>Combine o PIN direto com a pessoa. Ela entra com nome + PIN.</small></label>
      <label class="f" for="pperfil" style="max-width:420px">Perfil de acesso<select id="pperfil"><option value="">Selecione</option><option value="__admin" ${p.admin?"selected":""}>Administrador (acesso total)</option>${(S.perfis||[]).map(x => `<option value="${esc(x.id)}" ${!p.admin && p.perfilId===x.id?"selected":""}>${esc(x.nome)}</option>`).join("")}</select>
        <small><button class="link" type="button" id="pverperf">Ver o que cada perfil libera</button></small></label>
      ${p.id?`<label class="chk" for="pativo"><input id="pativo" type="checkbox" ${p.ativo?"checked":""}> Ativa (desmarque quando a pessoa sair da clínica)</label>`:""}
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" type="submit">${p.id?"Salvar alterações":"Adicionar"}</button>
        ${p.id?'<button class="btn ghost" type="button" id="pcancel">Cancelar edição</button>':""}
        ${p.id && p.id!==S.user.id ? '<button class="link danger" type="button" id="pexcluir" style="margin-left:auto">Excluir usuário</button>' : ""}
      </div>
    </form>
  </section>`;
  main.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ S.editPessoa = Object.assign({}, S.team.find(u=>u.id===b.dataset.edit)); render(); document.getElementById("fpessoa").scrollIntoView({behavior:"smooth"}); });
  const pc = document.getElementById("pcancel"); if(pc) pc.onclick=()=>{ S.editPessoa=null; render(); };
  main.querySelectorAll("[data-eqa]").forEach(b => b.onclick = () => { S.eqAba = b.dataset.eqa; render(); });
  document.getElementById("pverperf").onclick = () => { S.eqAba = "perfis"; render(); window.scrollTo(0,0); };
  const fs = document.getElementById("pfuncsel");
  fs.onchange = () => { const out = document.getElementById("pfuncao"); out.hidden = fs.value!=="__outra"; if (!out.hidden) out.focus(); };
  const px = document.getElementById("pexcluir");
  if (px) px.onclick = async () => {
    const abertas = S.tasks.filter(t => t.responsavelId===p.id && t.status==="aberta").length;
    if (px.dataset.confirm !== "1"){
      px.dataset.confirm = "1";
      px.textContent = abertas ? `Toque de novo para excluir · ${plural(abertas,"tarefa em aberto fica","tarefas em aberto ficam")} sem responsável ativo` : "Toque de novo para excluir";
      return;
    }
    px.disabled = true;
    const r = await api("excluirPessoa", {id: p.id});

    if (r.data.id===S.user.id){ S.user=Object.assign(S.user,r.data); S.pin=r.data.pin; store.set(CHAVE_SESSAO,{uid:S.user.id,pin:S.pin}); }
    S.editPessoa=null; render(); toast(p.id?"Alterações salvas":"Pessoa adicionada");
  });
}

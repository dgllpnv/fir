# O Firmare Rotinas de Gestão em produção.
#
# ## Por que containers avulsos, e não um stack do EasyPanel
#
# A VPS roda a produção de outros negócios em Docker Swarm, orquestrada pelo
# EasyPanel — a Mavia inclusive. Este produto entra **ao lado e nunca dentro**
# daquela orquestração, pelas mesmas três razões já pagas lá:
#
# 1. **Um erro aqui não pode alcançar o que já está lá.**
# 2. `docker compose down` desfaz tudo; um stack meio-criado no painel, não.
# 3. O Traefik do EasyPanel tem o provider Docker ligado, então ele descobre
#    estes containers por **label** — sem escrever no arquivo que o painel
#    gera e sobrescreve.
#
# ## O que encara a internet
#
# Só o `web`. A API **não é publicada**: o navegador chama `/api/...` na
# origem do web, e o servidor do Next repassa pela rede interna. É a mesma
# topologia do ambiente local, e é o que faz o cookie `__Host-` funcionar sem
# CORS.
#
# Nenhum serviço publica porta no host.

name: fir

services:
  # -------------------------------------------------------------------------
  # Postgres — o banco deste produto, e só dele
  # -------------------------------------------------------------------------
  # As migrations criam RLS, tornam `fir_migrate` dono do esquema `public` e
  # dependem de três papéis com senha. Instalar isso no cluster de outro
  # produto seria sujar o banco alheio com a nossa topologia de papéis.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fir
      POSTGRES_PASSWORD: ${SENHA_POSTGRES:?defina SENHA_POSTGRES}
      POSTGRES_DB: fir
      # UTC no banco, sempre. A conversão para o fuso DA CLÍNICA é do domínio
      # (regra 22) — e o fuso é propriedade da clínica, nunca global.
      TZ: UTC
      PGTZ: UTC
      SENHA_MIGRATE: ${SENHA_MIGRATE:?defina SENHA_MIGRATE}
      SENHA_APP: ${SENHA_APP:?defina SENHA_APP}
    volumes:
      - postgres-dados:/var/lib/postgresql/data
      # Roda uma vez, na criação do volume. Cria `fir_migrate` e `fir_app`.
      # **`fir_painel` NÃO nasce aqui**: ele é criado por
      # `provisionar-painel.sh`, contra um banco que já existe, com a senha
      # vinda do `.env`. Ver o cabeçalho daquele arquivo.
      - ./10-papeis.sh:/docker-entrypoint-initdb.d/10-papeis.sh:ro
    networks: [dados]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fir -d fir']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${SENHA_REDIS:?defina SENHA_REDIS}']
    environment:
      # O `redis-cli` lê esta variável sozinho — sem ela o `ping` do
      # healthcheck responde NOAUTH e o container nunca fica saudável.
      REDISCLI_AUTH: ${SENHA_REDIS:?defina SENHA_REDIS}
    volumes:
      - redis-dados:/data
    networks: [dados]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: fir/api:${VERSAO:-mais-recente}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fir_app:${SENHA_APP:?}@postgres:5432/fir
      DATABASE_URL_MIGRATE: postgresql://fir_migrate:${SENHA_MIGRATE:?}@postgres:5432/fir
      # A conexão do PAINEL — segunda conexão, **autenticada** como
      # `fir_painel` (D-5, restrição 5). Escrita no `.env` por
      # `provisionar-painel.sh`. Sem ela, o painel sobe apontando para o
      # padrão local e falha em voz alta na primeira consulta, que é melhor
      # do que subir apontando para `fir_app` e funcionar.
      DATABASE_URL_PAINEL: ${DATABASE_URL_PAINEL:?rode ./provisionar-painel.sh}
      # A conexão da CARTEIRA COMERCIAL — terceira conexão, autenticada como
      # `fir_carteira` (ADR 0012). Escrita no `.env` por
      # `provisionar-carteira.sh`. Sem ela, o fallback de
      # `banco.service.ts` aponta para 127.0.0.1:4832 — o Postgres LOCAL de
      # desenvolvimento — que dentro deste container não existe: falha em voz
      # alta, que é melhor que uma conexão ambígua funcionar por acaso.
      DATABASE_URL_CARTEIRA: ${DATABASE_URL_CARTEIRA:?rode ./provisionar-carteira.sh}
      # A conexão do PORTAL DO GRUPO — quarta conexão, autenticada como
      # `fir_portal` (ADR 0018). Escrita no `.env` por
      # `provisionar-portal.sh`. Mesma razão da linha acima.
      DATABASE_URL_PORTAL: ${DATABASE_URL_PORTAL:?rode ./provisionar-portal.sh}
      # O e-mail da conta de serviço do Google (ticket 4A), para a tela dizer com
      # quem compartilhar a planilha. Só o endereço: a chave fica no worker-planilhas.
      GOOGLE_SA_EMAIL: ${GOOGLE_SA_EMAIL:-}
      REDIS_URL: redis://:${SENHA_REDIS:?}@redis:6379
      # Um salto confiável: o Traefik, e mais nada. Sem isto `req.ip` é o
      # endereço do proxy, todas as clínicas viram um IP só, e o limite por
      # origem passa a ser um limite global. Ver `main.ts`.
      PROXY_SALTOS_CONFIAVEIS: '1'

      # O PISO DE TEMPO DE `/v1/entrar` (D2), calibrado **nesta** máquina.
      #
      # O padrão do código é 100 ms, e foi calibrado na máquina de
      # desenvolvimento (máximo medido lá: 52 ms). Esta VPS divide 4 vCPU com
      # 27 containers de produção de outros negócios, então o número de lá não
      # vale aqui — e estimar seria exatamente o erro que o piso existe para
      # não cometer.
      #
      # MEDIDO na VPS, contra a API em container, com `PISO_RESPOSTA_ENTRAR_MS=0`
      # e o limite por origem levantado, 200 amostras, 200/200 em HTTP 200 —
      # o caminho de SUCESSO, que é o mais lento dos quatro (ele soma o Argon2
      # à criação de sessão e a duas transações curtas):
      #
      #     p50 19,4 ms   p90 22,7 ms   p95 25,1 ms   p99 36,0 ms   máx 87,3 ms
      #
      # Numa segunda série, mais ruidosa: p99 44,9 ms e máx 109,5 ms.
      #
      # 150 ms fica acima do p99 das duas séries com folga de mais de três
      # vezes, e acima dos dois máximos observados — inclusive o de 109,5 ms,
      # que o padrão de 100 ms NÃO cobriria. Um pico acima do piso não é
      # catastrófico (ele não é atribuível a um caso específico), mas um piso
      # que o ruído do vizinho atravessa com frequência deixa de igualar a
      # classe, que é o que ele existe para fazer.
      #
      # Custo em tráfego real: nenhum. São ~24 logins POR MÊS (quatro clínicas,
      # seis pessoas, sessão de 30 dias). Custo sob ataque: nenhum, porque sob
      # fila a espera já passa do piso e nenhuma espera é somada.
      PISO_RESPOSTA_ENTRAR_MS: ${PISO_RESPOSTA_ENTRAR_MS:-150}

      # Anexos da carteira (G8 4C, A-13): a chave de cifra POR ARQUIVO, gerada
      # por `implantar.sh` e nunca no banco — quem tem o dump e o volume, sem
      # o `.env`, não lê nada. `:?` para a API não subir sem ela.
      CHAVE_ANEXOS: ${CHAVE_ANEXOS:?rode ./implantar.sh}
      DIRETORIO_ANEXOS: /dados/anexos
      # Lista de "não contatar" da prospecção (G8 1E): HMAC, a chave fora do banco.
      FIR_CHAVE_SUPRESSAO_DE_CONTATO: ${FIR_CHAVE_SUPRESSAO_DE_CONTATO:?rode ./implantar.sh}
      # Segundo fator da carteira (G8 0.6, A-12): cifra do segredo TOTP e
      # pepper dos códigos de recuperação. `:?` para a API não subir sem ela.
      FIR_CHAVE_SEGUNDO_FATOR_CARTEIRA: ${FIR_CHAVE_SEGUNDO_FATOR_CARTEIRA:?rode ./implantar.sh}
      # Exigência do segundo fator: desligada por decisão do dono (D-23, ADR 0023).
      SEGUNDO_FATOR_CARTEIRA_LIGADO: ${SEGUNDO_FATOR_CARTEIRA_LIGADO:-false}

      TZ: UTC
      HOST: '0.0.0.0'
    # O volume dos anexos, fora de qualquer diretório servido. O web não o
    # monta: o arquivo só sai pela rota autenticada da API.
    volumes:
      - anexos-dados:/dados/anexos
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [dados]

  # -------------------------------------------------------------------------
  # worker-agenda — a sincronização da agenda iCal das clínicas (ADR 0019)
  # -------------------------------------------------------------------------
  # Mesma imagem da API, outro processo: a cada 15 min (job repetível) e sob
  # demanda ("Sincronizar agora" enfileira em `agenda:sincronizacao`), ele
  # baixa o feed de cada clínica e concilia os compromissos.
  #
  # **Ele é o único serviço com saída para a internet**, e é por isso que é um
  # container à parte e não um módulo da API: buscar o iCal exige HTTPS e DNS
  # para fora, e a API continua na rede sem rota de saída. Conteúdo externo é
  # baixado e interpretado aqui, longe do processo que serve o balcão.
  #
  # A saída é para a internet, não para dentro: o SSRF é fechado no `lookup`
  # da conexão (`src/agenda/baixar-feed.ts` — só https:443, endereço privado,
  # loopback, link-local e CGNAT recusados no momento de conectar). Isso
  # importa porque este container ENXERGA o Postgres e o Redis pela `dados`;
  # sem aquela trava, um link de agenda apontado para `postgres` ou para o IP
  # de metadados da VPS seria um proxy para dentro.
  worker-agenda:
    image: fir/api:${VERSAO:-mais-recente}
    command: ['node', 'worker-agenda.js']
    restart: unless-stopped
    environment:
      # `fir_app`, o mesmo papel da API, sujeito a RLS. Nada de `fir_migrate`:
      # um processo que lê conteúdo da internet é o último lugar para um papel
      # com BYPASSRLS.
      DATABASE_URL: postgresql://fir_app:${SENHA_APP:?}@postgres:5432/fir
      REDIS_URL: redis://:${SENHA_REDIS:?}@redis:6379
      TZ: UTC
      # O heap abaixo do teto do container: com o limite só no cgroup, o V8
      # não sabe dele e o kernel mata o processo por OOM em vez de o coletor
      # trabalhar. O feed tem teto de 5 MB (ADR 0019), então 192 MB sobram.
      NODE_OPTIONS: --max-old-space-size=192
    # Disco, CPU e memória são compartilhados com a produção de OUTROS
    # negócios. Um feed patológico (recorrência que expande para milhares de
    # ocorrências) não pode virar a vez de outro container ficar sem memória.
    mem_limit: 256m
    cpus: 0.5
    # SEM healthcheck, e a escolha é deliberada.
    #
    # A imagem herda o `HEALTHCHECK` HTTP da API (`/v1/saude` na 4811), que
    # aqui nunca responde: o container ficaria `unhealthy` para sempre. Isso
    # não é só ruído — `implantar.sh` conta serviços saudáveis com
    # `grep -c 'healthy'`, e `unhealthy` CONTÉM `healthy`.
    #
    # E um teste não-HTTP não compraria nada: o Compose (fora do Swarm) não
    # reinicia container `unhealthy`. Quem reinicia é o `restart` acima, quando
    # o processo morre — e um worker que perde o Redis morre ou reconecta
    # sozinho. O sinal que de fato importa é de NEGÓCIO: clínica cuja
    # sincronização parou de dar certo, que mora no banco, não no container.
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # `dados` para Postgres e Redis; `saida` para a internet. Nenhuma porta
    # publicada, nenhuma label do Traefik: nada de fora chega até ele.
    networks: [dados, saida]

  # -------------------------------------------------------------------------
  # worker-planilhas — a leitura das planilhas de indicadores (ticket 4A)
  # -------------------------------------------------------------------------
  # Mesma imagem, outro processo: a cada 30 min (repetível) e sob demanda
  # ("Ler planilha agora" enfileira em `carteira-planilhas`), lê pela API do
  # Google Sheets, com a conta de serviço, a planilha de cada cliente.
  #
  # A CREDENCIAL DO GOOGLE MORA SÓ AQUI. `GOOGLE_SA_JSON` é o JSON da chave da
  # conta de serviço, numa linha, entre aspas simples no `.env` da VPS (nunca
  # no repositório, nunca na imagem, nunca no banco). Ausente, o worker sobe e
  # cada leitura registra "não configurado". A API nunca a recebe: ela só
  # recebe `GOOGLE_SA_EMAIL`, o endereço com que compartilhar a planilha.
  #
  # REDE PRÓPRIA (`saida-planilhas`), e não a `saida` do worker-agenda: o
  # worker-agenda precisa falar com qualquer host de iCal; este, só com
  # `oauth2.googleapis.com` e `sheets.googleapis.com` (gate A-16). Uma bridge
  # só dele, com sub-rede fixa, é o que permite a regra de egress descrita em
  # `infra/producao/README.md` sem cortar a agenda. O código já só fala com
  # esses dois hosts (URLs fixas, `redirect: error`); a regra é a segunda
  # camada, para o dia em que o processo for comprometido.
  worker-planilhas:
    image: fir/api:${VERSAO:-mais-recente}
    command: ['node', 'worker-planilhas.js']
    restart: unless-stopped
    environment:
      # `fir_app` só para ler o fuso da clínica; a escrita é em `fir_carteira`.
      DATABASE_URL: postgresql://fir_app:${SENHA_APP:?}@postgres:5432/fir
      DATABASE_URL_CARTEIRA: ${DATABASE_URL_CARTEIRA:?rode ./provisionar-carteira.sh}
      REDIS_URL: redis://:${SENHA_REDIS:?}@redis:6379
      GOOGLE_SA_JSON: ${GOOGLE_SA_JSON:-}
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m
    cpus: 0.5
    # Mesmo motivo do worker-agenda: o HEALTHCHECK HTTP herdado nunca responde aqui.
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [dados, saida-planilhas]

  # Telemetria diária do FIR Clinic para a carteira (G4), 06:00 UTC.
  # Worker da carteira (D13): mesma imagem, sem porta, sem Traefik, SÓ na rede
  # `dados` — ele não fala com a internet, e por isso não ganha `saida`.
  # Duas conexões: `fir_app` (o job lê dentro de cada clínica, com a RLS
  # dela) e `fir_carteira` (escreve nas tabelas da carteira, RLS por grupo).
  worker-uso-diario:
    image: fir/api:${VERSAO:-mais-recente}
    command: ["node", "worker-uso-diario.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fir_app:${SENHA_APP:?}@postgres:5432/fir
      DATABASE_URL_CARTEIRA: ${DATABASE_URL_CARTEIRA:?rode ./provisionar-carteira.sh}
      REDIS_URL: redis://:${SENHA_REDIS:?}@redis:6379
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m
    cpus: 0.5
    # Mesmo motivo do worker-agenda: o HEALTHCHECK HTTP herdado nunca responde aqui.
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [dados]

  # Cobranças mensais do Cliente Firmare (G3), dia 1 às 07:00 UTC.
  # Worker da carteira (D13): mesma imagem, sem porta, sem Traefik, SÓ na rede
  # `dados` — ele não fala com a internet, e por isso não ganha `saida`.
  # Duas conexões: `fir_app` (o job lê dentro de cada clínica, com a RLS
  # dela) e `fir_carteira` (escreve nas tabelas da carteira, RLS por grupo).
  worker-cobrancas:
    image: fir/api:${VERSAO:-mais-recente}
    command: ["node", "worker-cobrancas.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fir_app:${SENHA_APP:?}@postgres:5432/fir
      DATABASE_URL_CARTEIRA: ${DATABASE_URL_CARTEIRA:?rode ./provisionar-carteira.sh}
      REDIS_URL: redis://:${SENHA_REDIS:?}@redis:6379
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m
    cpus: 0.5
    # Mesmo motivo do worker-agenda: o HEALTHCHECK HTTP herdado nunca responde aqui.
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [dados]

  # Tarefas das rotinas internas da carteira (G5), 06:30 UTC.
  # Worker da carteira (D13): mesma imagem, sem porta, sem Traefik, SÓ na rede
  # `dados` — ele não fala com a internet, e por isso não ganha `saida`.
  # Duas conexões: `fir_app` (o job lê dentro de cada clínica, com a RLS
  # dela) e `fir_carteira` (escreve nas tabelas da carteira, RLS por grupo).
  worker-rotinas-internas:
    image: fir/api:${VERSAO:-mais-recente}
    command: ["node", "worker-rotinas-internas.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fir_app:${SENHA_APP:?}@postgres:5432/fir
      DATABASE_URL_CARTEIRA: ${DATABASE_URL_CARTEIRA:?rode ./provisionar-carteira.sh}
      REDIS_URL: redis://:${SENHA_REDIS:?}@redis:6379
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m
    cpus: 0.5
    # Mesmo motivo do worker-agenda: o HEALTHCHECK HTTP herdado nunca responde aqui.
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [dados]

  # Campanhas da FIR Clinic para a carteira (G8 1C/K4), 07:30 UTC.
  # Worker da carteira (D13): mesma imagem, sem porta, sem Traefik, SÓ na rede
  # `dados`. Duas conexões: `fir_app` (lê as campanhas dentro de cada clínica,
  # com a RLS dela) e `fir_carteira` (grava `campanhas_carteira`).
  worker-campanhas:
    image: fir/api:${VERSAO:-mais-recente}
    command: ["node", "worker-campanhas.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fir_app:${SENHA_APP:?}@postgres:5432/fir
      DATABASE_URL_CARTEIRA: ${DATABASE_URL_CARTEIRA:?rode ./provisionar-carteira.sh}
      REDIS_URL: redis://:${SENHA_REDIS:?}@redis:6379
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m
    cpus: 0.5
    # Mesmo motivo do worker-agenda: o HEALTHCHECK HTTP herdado nunca responde aqui.
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [dados]

  # Varredura antivírus dos anexos da carteira (G8 4C, A-13), a cada 30 s.
  # Lê o arquivo cifrado do volume, decifra, manda ao clamd, e marca
  # `limpo`/`infectado` (infectado: apaga o arquivo, mantém a linha). Sem
  # clamd, tudo fica `pendente` — e `pendente` não é servido a ninguém.
  worker-anexos:
    image: fir/api:${VERSAO:-mais-recente}
    command: ["node", "worker-anexos.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL_CARTEIRA: ${DATABASE_URL_CARTEIRA:?rode ./provisionar-carteira.sh}
      REDIS_URL: redis://:${SENHA_REDIS:?}@redis:6379
      CHAVE_ANEXOS: ${CHAVE_ANEXOS:?rode ./implantar.sh}
      DIRETORIO_ANEXOS: /dados/anexos
      CLAMD_HOST: clamav
      CLAMD_PORTA: '3310'
      TZ: UTC
      # Um anexo de 20 MB vira ~60 MB em memória no pico (cifrado + decifrado
      # + a cópia enviada ao clamd).
      NODE_OPTIONS: --max-old-space-size=192
    volumes:
      - anexos-dados:/dados/anexos
    mem_limit: 256m
    cpus: 0.5
    # Mesmo motivo do worker-agenda: o HEALTHCHECK HTTP herdado nunca responde aqui.
    healthcheck:
      disable: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [dados]

  # O ANTIVÍRUS, em dois containers, e a divisão é a razão de existir:
  #
  # - `clamav` (clamd) recebe o conteúdo hostil e fica SÓ na `dados`
  #   (`internal: true`): um clamd comprometido por um arquivo malicioso não
  #   tem rota de saída para exfiltrar o que viu.
  # - `clamav-atualizador` (freshclam) precisa da internet para baixar as
  #   assinaturas, e por isso fica numa rede PRÓPRIA de saída — não na
  #   `dados` (não alcança Postgres nem Redis) e não na `saida` do
  #   worker-agenda (não alcança outro serviço pelo nome).
  #
  # Os dois dividem o volume das assinaturas; o clamd o monta só leitura e
  # recarrega sozinho quando ele muda (`SelfCheck`, 600 s).
  #
  # CUSTO: o clamd ocupa ~1,2–1,5 GB de RAM com as assinaturas carregadas, e
  # a primeira subida baixa ~300 MB. Até o clamd ficar saudável, os anexos
  # ficam `pendente` (falha fechada) — o deploy não espera por ele.
  clamav-atualizador:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    # Com um comando, o `/init` da imagem roda só ele (sem clamd).
    command: ["freshclam", "--daemon", "--foreground", "--stdout", "--checks=12", "--user=clamav"]
    volumes:
      - clamav-assinaturas:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/clamav/main.cvd || test -s /var/lib/clamav/main.cld"]
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 600s
    mem_limit: 256m
    cpus: 0.25
    networks: [saida-antivirus]

  clamav:
    image: clamav/clamav:1.4.3
    restart: unless-stopped
    environment:
      # Quem atualiza é o container acima; este só varre.
      CLAMAV_NO_FRESHCLAMD: 'true'
      # Acima do teto de 20 MB do anexo. Um stream maior que isto volta
      # `size limit exceeded`, que o worker trata como indisponível — nunca
      # como limpo.
      CLAMD_CONF_StreamMaxLength: 25M
    volumes:
      - clamav-assinaturas:/var/lib/clamav:ro
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    mem_limit: 2g
    cpus: 1.0
    depends_on:
      clamav-atualizador: { condition: service_healthy }
    networks: [dados]

  web:
    image: fir/web:${VERSAO:-mais-recente}
    restart: unless-stopped
    environment:
      # O NOME importa: `next.config.mjs` lê `FIR_API_URL`, e a chave que
      # estava aqui antes (`API_INTERNA`) não era lida por ninguém — o web
      # caía no padrão `127.0.0.1:4811`, que dentro deste container é o
      # PRÓPRIO web. Todas as telas serviriam 200 e `/api/*` falharia.
      #
      # E o valor que de fato decide o rewrite é o `ARG` do
      # `apps/web/Dockerfile`, porque `rewrites()` entra no manifesto de rotas
      # no **build**. Esta variável existe para que build e runtime concordem,
      # e para que quem ler o compose veja o endereço certo em vez de deduzir.
      FIR_API_URL: http://api:4811
      TZ: UTC
    depends_on:
      api: { condition: service_started }
    networks: [dados, easypanel]
    labels:
      traefik.enable: 'true'
      # `easypanel` e não `dados`: sem isto o Traefik pode escolher o IP da
      # rede errada e falhar em alcançar o container, com um 502 que não
      # explica nada.
      traefik.docker.network: easypanel

      # -----------------------------------------------------------------------
      # O PRODUTO — tudo que **não** é o painel
      # -----------------------------------------------------------------------
      # A negação não é estilo: é o que faz a allowlist do painel **falhar
      # fechada**. Sem ela, os dois roteadores se sobrepõem e o do produto casa
      # `/superadmin` também; no dia em que o middleware não puder ser
      # construído — `IPS_DO_PAINEL` vazia, um CIDR com erro de digitação — o
      # Traefik **descarta o roteador do painel** em vez de bloquear, e o
      # produto passa a servir `/superadmin` sem allowlist nenhuma. O controle
      # não falharia fechado: ele sumiria, em silêncio, com uma linha de log
      # num Traefik que não é nosso.
      #
      # E o gatilho mais provável desse erro de digitação é justamente o
      # procedimento de recuperação de lockout, executado por uma pessoa só,
      # sob pressão, por SSH.
      #
      # Com as regras **disjuntas**, se o painel cai ninguém o serve: 404.
      # Disjunção também torna `priority` desnecessária — não há empate a
      # desempatar, e uma label a menos é um acoplamento a menos.
      traefik.http.routers.fir.rule: 'Host(`${DOMINIO:?defina DOMINIO}`) && !PathRegexp(`(?i)(^|/)superadmin(/|$$)`)'
      traefik.http.routers.fir.entrypoints: https
      traefik.http.routers.fir.tls: 'true'
      # Explícito, e não herdado de um certificado padrão: um `*.easypanel.host`
      # vem coberto pelo wildcard que o EasyPanel já mantém, mas um domínio
      # PRÓPRIO (`DOMINIO=meudominio.com.br`) nunca pede certificado nenhum sem
      # isto — o Traefik serve o certificado de fallback (autoassinado,
      # `CN=Easypanel`) em silêncio, e a página parece no ar enquanto o
      # navegador real recusa a conexão. Medido no primeiro deploy fora do
      # subdomínio padrão (`firmaregestao.com.br`, G7 da Carteira): o DNS
      # apontava certo, o Traefik respondia, e mesmo assim nenhum cadeado.
      # `letsencrypt` é o nome do resolver que o próprio EasyPanel já declara
      # (`/etc/easypanel/traefik/config/main.yaml`) para os domínios PRÓPRIOS
      # que ELE gerencia — este stack só precisa pedir a mesma coisa.
      traefik.http.routers.fir.tls.certresolver: letsencrypt
      # Explícito nos três roteadores, embora o Traefik resolva sozinho hoje:
      # a dedução por serviço único **só vale enquanto o serviço for único**.
      # No dia em que este container declarar um segundo
      # `loadbalancer.server.port`, todo roteador sem `service` é removido da
      # configuração — inclusive o do produto, e o site inteiro sai do ar por
      # uma label que ninguém ligou ao sintoma.
      traefik.http.routers.fir.service: fir
      traefik.http.services.fir.loadbalancer.server.port: '4810'

      # -----------------------------------------------------------------------
      # O PAINEL — atrás da allowlist de IP (D-5, restrição 6)
      # -----------------------------------------------------------------------
      # A contrapartida assumida pelo adiamento do MFA. Mesma troca que o
      # Mavia registrou na C-6a.
      #
      # ## Por que a regra é "um segmento chamado `superadmin`", e não um prefixo
      #
      # O caminho óbvio — `PathPrefix('/superadmin') || PathPrefix('/api/v1/superadmin')`
      # — **é contornável, e foi contornado contra a produção do Mavia antes
      # de existir allowlist**. Duas assimetrias entre o Traefik e o Next se
      # somam:
      #
      # 1. `PathPrefix` do Traefik é sensível à caixa; o rewrite do Next não é
      #    (`caseSensitive: false` no `routes-manifest.json`).
      #    `/API/v1/superadmin/eu` não casa a regra e ainda assim alcança o
      #    controlador — 401 medido lá.
      # 2. O Traefik casa o caminho **cru**; quem normaliza `//`, `/./` e
      #    `/x/../` é o servidor do Next. `/api//v1/superadmin/eu` também
      #    mediu 401.
      #
      # Enumerar grafias num prefixo é jogo perdido — some sempre uma. Casar
      # **um segmento igual a `superadmin`** é imune às duas: qualquer grafia
      # que o Next normalize para uma rota de painel tem esse segmento, em
      # qualquer caixa e sob qualquer ruído de barra.
      #
      # O excesso é deliberado e é para o lado seguro: bloqueia também
      # `/_next/static/chunks/app/superadmin/*`, que anunciaria a forma do
      # painel a quem quiser ler. **Nenhuma rota de produto tem segmento
      # `superadmin`**, e `teste/rotas-protegidas.test.ts` cobra isso nos dois
      # sentidos — toda rota de painel sob o segmento, nenhuma de produto.
      #
      # E o segmento NÃO é `painel` de propósito: `painel` é chave de
      # permissão existente (`painel` → `valores`) e é o nome da tela do épico
      # 8. No dia em que `/painel` virasse tela de indicadores, esta allowlist
      # a bloquearia para a clínica inteira.
      traefik.http.routers.fir-painel.rule: 'Host(`${DOMINIO}`) && PathRegexp(`(?i)(^|/)superadmin(/|$$)`)'
      # Explícito: um roteador sem `entrypoints` liga-se a **todas** as
      # entradas, e o painel passaria a ser servido em texto claro no `http`
      # em vez de redirecionado.
      traefik.http.routers.fir-painel.entrypoints: https
      traefik.http.routers.fir-painel.tls: 'true'
      # Mesma razão do roteador `fir`, acima — cada roteador TLS pede o seu.
      traefik.http.routers.fir-painel.tls.certresolver: letsencrypt
      traefik.http.routers.fir-painel.service: fir
      traefik.http.routers.fir-painel.middlewares: fir-ips-do-painel

      # `sourcerange` e **NADA MAIS**. Sem `ipstrategy`, sem `depth`, sem
      # `excludedips` — e isto é a decisão de segurança desta seção, não
      # estilo.
      #
      # A estratégia padrão compara contra o endereço do **socket**, que não
      # se forja. Qualquer `ipstrategy` faria o middleware ler o
      # `X-Forwarded-For` — e a entrada HTTPS deste Traefik roda com
      # `FORWARDEDHEADERS_INSECURE=true`, o que significa que o cabeçalho
      # **vem do cliente**. Uma allowlist que lê um cabeçalho que o atacante
      # escreve atravessa-se com uma linha de `curl`.
      #
      # ⚠️ **INVARIANTE DO PRIMEIRO SALTO.** Isto só vale enquanto o Traefik
      # for o primeiro salto TCP. Um CDN à frente faz o `RemoteAddr` virar o
      # do CDN e a allowlist **falha aberta, sem mudar de cor**. Item
      # obrigatório de conferência no dia em que o domínio próprio entrar
      # (pendência P-8).
      #
      # `:-` e não `-`: com `:-`, variável ausente **e** vazia caem no padrão
      # fechado. Com `-`, a string vazia sobrescreveria o padrão, o middleware
      # não se construiria, e cairíamos no modo de falha que a negação do
      # roteador do produto existe para conter.
      traefik.http.middlewares.fir-ips-do-painel.ipallowlist.sourcerange: '${IPS_DO_PAINEL:-127.0.0.1/32}'

      # HTTP existe só para mandar embora. O cookie de sessão tem prefixo
      # `__Host-`, que obriga `Secure` — em `http://` o navegador o descarta e
      # ninguém consegue ficar logado. Servir isto sem TLS não é degradação: é
      # o login não existir.
      #
      # **Ele cobre `/superadmin` por redirecionar tudo**, e é por isso que o
      # painel não precisa de um par em `http`: um `GET http://…/superadmin`
      # de origem não permitida leva 301 antes de qualquer coisa alcançar a
      # aplicação, refaz em HTTPS e aí encontra a allowlist.
      #
      # Se um dia esta entrada passar a **servir** algo em vez de
      # redirecionar, o painel fica descoberto nela. Esta é a linha que
      # precisa disparar o alarme nesse dia.
      traefik.http.routers.fir-http.rule: Host(`${DOMINIO}`)
      traefik.http.routers.fir-http.entrypoints: http
      traefik.http.routers.fir-http.service: fir
      # `@file` porque o middleware é definido pelo provider de arquivo do
      # EasyPanel, e este router vem do provider Docker.
      traefik.http.routers.fir-http.middlewares: redirect-to-https@file

networks:
  # Onde os dados vivem. **Sem saída para a internet**, e é o ponto: um
  # Postgres comprometido não tem por onde exfiltrar.
  dados:
    driver: bridge
    internal: true

  # A rota de saída do `worker-agenda`, e de **mais ninguém**. Bridge comum,
  # sem `internal`, porque buscar o iCal exige DNS e HTTPS para fora.
  #
  # Uma rede própria, e não a `easypanel`, porque aquela é do Traefik e dos
  # containers de outros negócios: pôr o worker lá o deixaria alcançar
  # serviços alheios pelo nome. E não se acrescenta `saida` a outro serviço —
  # um segundo serviço nesta lista é um segundo serviço com rota para a
  # internet, e `implantar.sh` mede que o Postgres continua sem ela.
  saida:
    driver: bridge

  # A rede do EasyPanel, onde o Traefik vive. `external` porque ela já existe
  # e **não é nossa** — declarar sem isso faria o compose tentar criá-la.
  easypanel:
    external: true

  # A saída do `clamav-atualizador`, e só dele (ver o serviço). Bridge comum,
  # separada da `saida`, para que o freshclam não enxergue o worker-agenda.
  saida-antivirus:
    driver: bridge

  # A saída do `worker-planilhas`, e só dele: Google Sheets por conta de
  # serviço. Sub-rede FIXA para a regra de egress (só *.googleapis.com:443)
  # poder ser escrita contra ela — ver infra/producao/README.md.
  saida-planilhas:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.248.0/24

volumes:
  postgres-dados:
  redis-dados:
  # Os anexos da carteira, cifrados por arquivo (A-13). Entra no backup com a
  # retenção da reunião — ver infra/producao/backup.sh (pendência registrada).
  anexos-dados:
  clamav-assinaturas:
